<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>일원 5회차 여행 영상</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 상단 sticky(제목+STEP 탭) / 본문 카드 그리드 + 오른쪽 sticky 카드 메뉴 / 하단 sticky 이동 줄. position:fixed 없음, 일반 문서 스크롤 */
:root{
  --bg:#FBFAF8; --surface:#FFFFFF; --line:#E7E3DF; --line-2:#D6D0CA;
  --fg:#24201E; --fg-2:#5A534E; --fg-3:#8A827B;
  --acc:#9A4A36; --acc-ink:#FFFFFF; --acc-soft:#F6ECE8; --acc-line:#E5CFC7;
  --set:#EEF3F7; --set-line:#CFDCE8; --set-ink:#365A7A;
  --warn:#FBEFEF; --warn-line:#EDCFCF; --warn-ink:#A03838;
  --ext:#EEF6F0; --ext-line:#CBE3D2; --ext-ink:#2F6B45;
  --code:#F5F2EF;
  --f-display:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,"Malgun Gothic",monospace;
  --fs:20px; --hdr:130px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171514; --surface:#201D1B; --line:#34302D; --line-2:#433E3A;
  --fg:#EEE9E5; --fg-2:#C2BAB3; --fg-3:#958C85;
  --acc:#E09A84; --acc-ink:#1E1210; --acc-soft:#33231E; --acc-line:#5A3A31;
  --set:#1C2530; --set-line:#2F4256; --set-ink:#9EC0E0;
  --warn:#301E1E; --warn-line:#5A3333; --warn-ink:#F0A8A8;
  --ext:#1B2A20; --ext-line:#2F5140; --ext-ink:#93D3A9;
  --code:#262220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171514; --surface:#201D1B; --line:#34302D; --line-2:#433E3A;
  --fg:#EEE9E5; --fg-2:#C2BAB3; --fg-3:#958C85;
  --acc:#E09A84; --acc-ink:#1E1210; --acc-soft:#33231E; --acc-line:#5A3A31;
  --set:#1C2530; --set-line:#2F4256; --set-ink:#9EC0E0;
  --warn:#301E1E; --warn-line:#5A3333; --warn-ink:#F0A8A8;
  --ext:#1B2A20; --ext-line:#2F5140; --ext-ink:#93D3A9;
  --code:#262220; color-scheme:dark}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:1rem;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.35;margin:0;font-weight:700}
p{margin:0}
button,select,input{font:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
b{font-weight:700}

/* 상단 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1360px;margin:0 auto;padding-inline:16px}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px 4px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-family:var(--f-display);font-size:1rem}
.brand small{font-size:.64rem;color:var(--fg-3)}
.fsz{display:flex;gap:4px;align-items:center}
.fsz span{font-size:.6rem;color:var(--fg-3);margin-right:2px}
.fsz button{border:1px solid var(--line-2);background:var(--surface);color:var(--fg-2);border-radius:8px;padding:2px 10px;font-size:.66rem;cursor:pointer}
.fsz button:hover{border-color:var(--acc);color:var(--acc)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tab{flex:none;border:0;border-bottom:3px solid transparent;background:none;color:var(--fg-2);padding:6px 12px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.tab small{font-size:.54rem;font-weight:700;color:var(--fg-3);letter-spacing:.04em}
.tab span{font-size:.7rem;white-space:nowrap}
.tab[aria-selected="true"]{border-bottom-color:var(--acc);color:var(--fg)}
.tab[aria-selected="true"] small{color:var(--acc)}
.tab[aria-selected="true"] span{font-weight:700}

/* 본문 */
.wrap{max-width:1360px;margin:0 auto;padding-inline:16px;padding-block:20px 32px;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:28px;align-items:start}
.sh{display:flex;gap:16px;align-items:center;background:var(--acc-soft);border:1px solid var(--acc-line);border-radius:14px;padding:16px 20px;margin-bottom:18px}
.sh .badge{flex:none;background:var(--acc);color:var(--acc-ink);font-weight:800;border-radius:10px;padding:8px 14px;font-size:.8rem;letter-spacing:.02em}
.sh h2{font-size:1.3rem}
.sh p{color:var(--fg-2);font-size:.88rem;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0;scroll-margin-top:calc(var(--hdr) + 12px)}
.card.wide{grid-column:1/-1}
.card-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card-h .no{font-family:var(--f-mono);font-size:.64rem;color:var(--fg-3)}
.card-h h3{font-size:1.05rem;flex:1;min-width:0}
.tag{font-size:.6rem;font-weight:700;border-radius:6px;padding:1px 8px;white-space:nowrap}
.tag.key{background:var(--acc);color:var(--acc-ink)}
.tag.do{background:var(--acc-soft);color:var(--acc);border:1px solid var(--acc-line)}
.tag.you{background:var(--surface);color:var(--acc);border:1px solid var(--acc)}
.tag.set{background:var(--set);color:var(--set-ink)}
.tag.warn{background:var(--warn);color:var(--warn-ink)}
.tag.ext{background:var(--ext);color:var(--ext-ink)}
.card.set{background:var(--set);border-color:var(--set-line)}
.card.warn{background:var(--warn);border-color:var(--warn-line)}
.card.ext{background:var(--ext);border-color:var(--ext-line)}
.card ul,.card ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.muted{color:var(--fg-2)}
.small{font-size:.8rem}
.k{background:var(--acc-soft);color:var(--acc);border-radius:4px;padding:0 4px;font-weight:700}
code{font-family:var(--f-mono);font-size:.8em;background:var(--code);padding:1px 6px;border-radius:5px}
.where{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.76rem}
.where span{border:1px solid var(--line-2);border-radius:999px;padding:1px 10px;background:var(--bg);color:var(--fg-2)}
.where i{font-style:normal;color:var(--fg-3)}

/* 프롬프트 */
.pr{border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--code)}
.pr-h{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.pr-h span{flex:1;font-size:.7rem;font-weight:700;color:var(--fg-2);min-width:0}
.cp{border:1px solid var(--acc);color:var(--acc);background:var(--surface);border-radius:7px;padding:1px 12px;font-size:.66rem;cursor:pointer;font-weight:700;flex:none}
.cp.ok{background:var(--acc);color:var(--acc-ink)}
.pr pre{margin:0;padding:12px 14px;font-family:var(--f-mono);font-size:.74rem;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:var(--fg)}
.pr .ko{padding:0 14px 12px;font-size:.74rem;color:var(--fg-2)}
.pr .sv{padding:6px 14px;border-top:1px dashed var(--line-2);font-size:.7rem;color:var(--acc);font-weight:700;background:var(--surface)}

/* 표 */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.8rem;min-width:480px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--code);font-weight:700;color:var(--fg-2);font-size:.72rem;white-space:nowrap}
tr:last-child td{border-bottom:none}
td[contenteditable]{background:var(--surface);min-width:70px}
td[contenteditable]:empty::before{content:"입력";color:var(--fg-3)}

/* 박스 */
.box{border:1px solid;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:.86rem}
.box .bt{font-weight:700;font-size:.72rem}
.box.easy{background:var(--bg);border-color:var(--line-2);border-style:dashed}
.box.easy .bt{color:var(--fg-2)}
.box.acc{background:var(--acc-soft);border-color:var(--acc-line)}
.box.acc .bt{color:var(--acc)}

/* 체크 */
.checks{list-style:none;padding:0!important}
.checks li{display:flex;gap:10px;align-items:flex-start}
.checks input{width:1.1em;height:1.1em;margin-top:.35em;accent-color:var(--acc);flex:none}

/* 도식·그림 */
.fig{overflow-x:auto}
.fig svg{display:block;width:100%;height:auto;min-width:540px}
.svg-t{fill:var(--fg);font-family:var(--f-body)}
.svg-s{fill:var(--fg-2);font-family:var(--f-body)}
.svg-box{fill:var(--surface);stroke:var(--line-2)}
.svg-acc{fill:var(--acc-soft);stroke:var(--acc)}
.svg-solid{fill:var(--acc)}
.svg-ink{fill:var(--acc-ink);font-family:var(--f-body)}
.svg-al{stroke:var(--acc);fill:none}
.svg-af{fill:var(--acc)}
.svg-ln{stroke:var(--line-2);fill:none}

/* 실제 예시 */
.shots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.shot{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.shot img{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);display:block}
.shot figcaption{font-size:.72rem;color:var(--fg-2);line-height:1.5}
.shot figcaption b{color:var(--warn-ink)}

/* 링크 카드 */
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.links a{display:flex;flex-direction:column;gap:2px;text-decoration:none;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);min-width:0}
.links a:hover{border-color:var(--acc)}
.links a b{font-size:.74rem;color:var(--acc)}
.links a b::after{content:" ↗"}
.links small{font-size:.6rem;color:var(--fg-3);line-height:1.4}

/* 연습 대상 고르기 */
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line-2);background:var(--surface);color:var(--fg-2);border-radius:999px;padding:3px 14px;font-size:.72rem;cursor:pointer}
.pick button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.pick-l{font-size:.68rem;font-weight:700;color:var(--fg-3)}

/* 플레이어 */
.pl{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column}
.pl-stage{background:var(--bg);padding:14px;display:flex;flex-direction:column;gap:8px;align-items:center;overflow-x:auto}
.pl-stage svg{width:100%;height:auto;display:block;min-width:520px}
.pl-cap{min-height:2.6em;font-size:.8rem;font-weight:700;color:var(--acc);text-align:center;line-height:1.4}
.pl-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.pl-b{border:1px solid var(--line-2);background:var(--surface);color:var(--fg);border-radius:8px;padding:2px 10px;font-size:.66rem;cursor:pointer;white-space:nowrap}
.pl-b.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.pl-r{flex:1;min-width:120px;accent-color:var(--acc)}
.pl-note{width:100%;font-size:.66rem;color:var(--fg-3)}

/* 오른쪽 카드 메뉴 */
.side{position:sticky;top:calc(var(--hdr) + 16px);border-left:1px solid var(--line);padding:4px 0 4px 10px;display:flex;flex-direction:column;gap:1px;max-height:calc(100vh - var(--hdr) - 90px);overflow:auto}
.side .st{font-size:.62rem;color:var(--fg-3);font-weight:700;margin-bottom:6px;padding-left:8px}
.side a{display:block;text-decoration:none;color:var(--fg-2);font-size:.7rem;padding:5px 8px;border-left:3px solid transparent;margin-left:-13px;padding-left:18px;line-height:1.45}
.side a:hover{color:var(--fg)}
.side a.on{color:var(--acc);border-left-color:var(--acc);font-weight:700}

/* 하단 */
.foot{position:sticky;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.foot-in{max-width:1360px;margin:0 auto;padding-inline:16px;padding-block:8px;display:flex;gap:8px;align-items:center}
.nav{border:1px solid var(--line-2);background:var(--surface);color:var(--fg);border-radius:9px;padding:4px 16px;font-size:.74rem;cursor:pointer;white-space:nowrap}
.nav.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.nav:disabled{opacity:.4;cursor:default}
.foot select{flex:1;min-width:0;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);border-radius:9px;padding:4px 8px;font-size:.7rem}

@media (max-width:1000px){.wrap{grid-template-columns:minmax(0,1fr)}.side{display:none}}
@media (max-width:760px){:root{--fs:18px}.grid,.shots{grid-template-columns:minmax(0,1fr)}.card{padding:16px}.foot-in{flex-wrap:wrap}.foot select{flex-basis:40%}.sh{flex-direction:column;align-items:flex-start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<header class="top" id="top">
  <div class="top-in">
    <div class="bar">
      <div class="brand"><b>시작과 끝을 정하면 여행이 됩니다</b><small>일원평생학습센터 · SNS·유튜브를 사로잡는 AI영상제작 · 5회차 · 구글 플로우 + 캡컷</small></div>
      <div class="fsz" aria-label="글자 크기"><span>글자</span><button type="button" data-fs="-1" aria-label="글자 작게">가−</button><button type="button" data-fs="1" aria-label="글자 크게">가+</button></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="STEP"></nav>
  </div>
</header>

<div class="wrap">
  <main id="main"></main>
  <aside class="side" id="side" aria-label="이 STEP 카드"></aside>
</div>

<footer class="foot">
  <div class="foot-in">
    <button type="button" class="nav" id="prev">◀ 이전</button>
    <select id="selStep" aria-label="STEP 이동"></select>
    <select id="selCard" aria-label="카드 이동"></select>
    <button type="button" class="nav pri" id="next">다음 ▶</button>
  </div>
</footer>

<script>
/* ================= 도우미 ================= */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let PID=0;
function P(label,text,ko,save,id){PID++;const pid=id||('p'+PID);return `<div class="pr"><div class="pr-h"><span>${label}</span><button type="button" class="cp" data-p="${pid}">복사</button></div><pre id="${pid}">${esc(text)}</pre>${ko?`<div class="ko">${ko}</div>`:''}${save?`<div class="sv">저장: ${save}</div>`:''}</div>`}
const B=(k,t,h)=>`<div class="box ${k}"><div class="bt">${t}</div><div>${h}</div></div>`;
const W=(...a)=>`<div class="where">${a.map((x,i)=>(i?'<i>→</i>':'')+`<span>${x}</span>`).join('')}</div>`;
const T=(head,rows)=>`<div class="tbl"><table><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
const CHK=items=>`<ul class="checks">${items.map((x,i)=>`<li><input type="checkbox" id="ck${++PID}"><label for="ck${PID}">${x}</label></li>`).join('')}</ul>`;
const US=q=>'https://unsplash.com/s/photos/'+q.trim().toLowerCase().replace(/\s+/g,'-');
const PX=q=>'https://www.pexels.com/search/'+encodeURIComponent(q)+'/';
const LINKS=items=>`<div class="links">${items.map(([lab,u,src])=>`<a href="${u}" target="_blank" rel="noopener"><b>${lab}</b><small>${src}</small></a>`).join('')}</div>`;

/* ================= 그림 도구 (강의용 자체 제작 도식) ================= */
let UID=0;const uid=p=>(p||'g')+(++UID);
const SK='#EFC9A8',HAIR='#2A2320';
/* 서 있는 사람: 원점 = 발 가운데, 키 약 120 */
function MAN(o={}){
  const top=o.top||'#3A3A3E',bot=o.bot||'#3E5378',hat=o.hat===undefined?'#1F1F22':o.hat;
  let g='';
  g+=`<rect x="-13" y="-58" width="11" height="56" rx="4" fill="${bot}"/><rect x="2" y="-58" width="11" height="56" rx="4" fill="${bot}"/>`;
  g+=`<ellipse cx="-8" cy="-1" rx="9" ry="4" fill="#5A3B26"/><ellipse cx="8" cy="-1" rx="9" ry="4" fill="#5A3B26"/>`;
  g+=`<path d="M-18 -98 Q-18 -106 -10 -106 H10 Q18 -106 18 -98 V-56 H-18 Z" fill="${top}"/>`;
  if(o.back){g+=`<circle cx="0" cy="-116" r="12" fill="${HAIR}"/>`}else{g+=`<circle cx="0" cy="-116" r="12" fill="${SK}"/><circle cx="-4" cy="-117" r="1.5" fill="#2B2B2B"/><circle cx="4" cy="-117" r="1.5" fill="#2B2B2B"/><path d="M-6 -110 Q0 -104 6 -110 L6 -108 Q0 -100 -6 -108Z" fill="#3A2B22" opacity=".8"/>`}
  if(hat) g+=`<path d="M-12.5 -117 Q-13 -132 0 -132 Q13 -132 12.5 -117 Z" fill="${hat}"/>`;
  if(o.phone){g+=`<path d="M-17 -96 L-12 -78 L-3 -74" stroke="${top}" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M17 -96 L12 -78 L3 -74" stroke="${top}" stroke-width="7" fill="none" stroke-linecap="round"/>`}
  else{g+=`<path d="M-18 -96 L-21 -62" stroke="${top}" stroke-width="7" stroke-linecap="round"/><path d="M18 -96 L21 -62" stroke="${top}" stroke-width="7" stroke-linecap="round"/><circle cx="-21" cy="-60" r="3.5" fill="${SK}"/><circle cx="21" cy="-60" r="3.5" fill="${SK}"/>`}
  return g;
}
const PHONE=(x,y,k)=>`<g ${k?`data-r="${k}"`:''}><rect x="${x-5}" y="${y-8}" width="10" height="15" rx="2" fill="#20242C"/><rect x="${x-3.5}" y="${y-6.5}" width="7" height="11" rx="1" fill="#7FB4F0"/><circle cx="${x}" cy="${y-1}" r="10" fill="#9CC8FF" opacity=".35"/></g>`;
const BAG=(k)=>`<g ${k?`data-r="${k}"`:''}><path d="M-12 -104 L16 -62" stroke="#7A4A2A" stroke-width="3"/><rect x="10" y="-70" width="20" height="17" rx="3" fill="#8A5530"/></g>`;
/* 앉은 사람 + 테이블 + 찻잔 (카페 창가) */
function CAFE(o={}){
  const id=uid('w');const cup=o.cupUp?`<g data-r="${o.cupKey||''}"><rect x="34" y="-78" width="12" height="11" rx="2" fill="#FFFFFF" stroke="#8A8A8A"/></g>`:`<g data-r="${o.cupKey||''}"><rect x="58" y="-38" width="12" height="11" rx="2" fill="#FFFFFF" stroke="#8A8A8A"/></g>`;
  return `<rect x="-90" y="-150" width="180" height="150" fill="#F4EEE6"/>
  <rect x="-70" y="-135" width="70" height="80" fill="#CFE4F2" stroke="#B8A898" stroke-width="4"/><path d="M-35 -135 V-55 M-70 -95 H0" stroke="#B8A898" stroke-width="3"/>
  <rect x="-90" y="-27" width="180" height="27" fill="#C9B49A"/>
  <rect x="10" y="-27" width="80" height="6" fill="#8C6A4C"/>
  <rect x="2" y="-74" width="30" height="48" rx="8" fill="#D9C2A0"/>
  <circle cx="${o.turn?18:12}" cy="-86" r="12" fill="${SK}"/><path d="M0 -88 Q4 -102 18 -100 Q28 -98 26 -84 Q22 -94 12 -94 Q4 -92 0 -88Z" fill="#5A4030"/>
  <path d="M28 -66 ${o.cupUp?'L36 -74':'L52 -32'}" stroke="#D9C2A0" stroke-width="7" stroke-linecap="round"/>${cup}`;
}
/* 돌담길 장소 */

const TL={};
const seg=(t,a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a)));
function PLAYER(key,svg,dur,draw,note){
  TL[key]={dur,draw};
  return `<div class="pl" data-pl="${key}"><div class="pl-stage">${svg}<div class="pl-cap" aria-live="polite"></div></div>

}
const R=(root,n)=>root.querySelector(`[data-r="${n}"]`);
const op=(el,v)=>el&&el.setAttribute('opacity',(+v).toFixed(3));
const tf=(el,v)=>el&&el.setAttribute('transform',v);
const AH=id=>`<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="svg-af"/></marker>`;

function CUTCARD(pl,i,tone,name,ph){
  const c=pl.cuts[i];
  return `<div class="grid">
  <div style="display:flex;flex-direction:column;gap:10px;min-width:0">${W('＋ 레퍼런스',`${name==='컷1'||name==='컷2'||name==='컷3'?'준호_시트':'내 시트'}`,ph,'비율 16:9')}${P('스타트',cutStart(c,tone.t),'',`${name}_스타트`)}</div>
  <div style="display:flex;flex-direction:column;gap:10px;min-width:0">${W('＋ 레퍼런스',`${name}_스타트 한 장`)}${P('엔드',cutEnd(c,tone.t),'',`${name}_엔드`)}</div></div>
  ${W('영상','시작 칸 '+name+'_스타트','끝 칸 '+name+'_엔드','360p')}${P('영상',cutVid(c),'',`${name}_영상`)}`;
}

  const o=document.createElement('option');o.value=i;o.textContent=`STEP ${i} · ${s.tab}`;selStep.appendChild(o);
  const sec=document.createElement('section');sec.id=s.id;sec.hidden=true;sec.setAttribute('role','tabpanel');
  sec.innerHTML=`<div class="sh"><span class="badge">STEP ${i}</span><div><h2>${s.title}</h2><p>${s.lead}</p></div></div>
  <div class="grid">${s.cards.map((c,j)=>`<article class="card${c.w?' wide':''}${['set','warn','ext'].includes(c.k)?' '+c.k:''}" id="${s.id}-c${j+1}"><div class="card-h"><span class="no">${i}-${j+1}</span><h3>${c.t}</h3><span class="tag ${c.k}">${tagTxt[c.k]}</span></div>${c.h()}</article>`).join('')}</div>`;
  mainEl.appendChild(sec);
});

/* 연습 대상 고르기 */
function bindPick(id,fn,init){const el=document.getElementById(id);if(!el)return;const run=i=>{el.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.i===i));fn(i)};el.addEventListener('click',e=>{const b=e.target.closest('button');if(b)run(+b.dataset.i)});run(init)}
bindPick('pkScene',i=>{const s=SCENES[i];document.getElementById('scBox').innerHTML=`<div class="grid" style="margin-top:12px">${P('스타트',sceneStart(s),s.ko[0],'내_스타트','ps1')}${P('엔드 — 내_스타트를 레퍼런스로',sceneEnd(s),'바뀌는 것 하나: '+s.ko[1],'내_엔드','ps2')}</div><div style="margin-top:12px">${P('영상 — 시작 칸 내_스타트 · 끝 칸 내_엔드',sceneVidA(s),'','내_영상','ps3')}</div>`},1);
bindPick('pkPerson',i=>{const p=PEOPLE[i];const sv=p.sv;document.getElementById('psBox').innerHTML=`<div class="grid" style="margin-top:12px">${P('앵커 — 비율 9:16, 레퍼런스 없이',anchorP(p),p.ko+' · 빈손 · 연회색 배경',sv+'_앵커','pp1')}${P('시트 — '+sv+'_앵커만 레퍼런스로, 비율 16:9',sheetP(p),'정면 · 비스듬히 · 옆 · 뒤 전신을 한 줄로, 빈손',sv+'_시트','pp2')}</div>`},1);
bindPick('pkPlace4',i=>{const pl=PLACES[i];document.getElementById('plBox4').innerHTML=`<div style="margin-top:12px">${LINKS(pl.cuts.flatMap((c,k)=>[[`장소_${k+1} ${c.nm}`,US(c.q),`언스플래시 “${c.q}”`],[`장소_${k+1} 더 보기`,PX(c.q),`펙셀 “${c.q}”`]]))}</div>`},2);
let pl5=2,tn5=0;
function renderPl5(){const pl=PLACES[pl5],tone=TONES[tn5];document.getElementById('plBox5').innerHTML=pl.cuts.map((c,k)=>`<div style="margin-top:14px;display:flex;flex-direction:column;gap:10px"><p><b>컷 ${k+1} · ${c.nm}</b> <span class="muted small">— 레퍼런스: 내 시트 + 장소_${k+1}</span></p><div class="grid">${P('스타트',cutStart(c,tone.t),'',`컷${k+1}_스타트`,'pc'+k+'a')}${P('엔드 — 컷'+(k+1)+'_스타트를 레퍼런스로',cutEnd(c,tone.t),'',`컷${k+1}_엔드`,'pc'+k+'b')}</div>${P('영상 — 시작·끝 칸에 두 장',cutVid(c),'',`컷${k+1}_영상`,'pc'+k+'c')}</div>`).join('')}
bindPick('pkPlace5',i=>{pl5=i;renderPl5()},2);
bindPick('pkTone',i=>{tn5=i;renderPl5()},0);

/* 플레이어 */
function initPlayers(){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.pl').forEach(root=>{
    const T=TL[root.dataset.pl];if(!T)return;
    const rng=root.querySelector('.pl-r'),cap=root.querySelector('.pl-cap');
    let t=0,raf=0,last=0,playing=false,played=false;
    const render=()=>{cap.textContent=T.draw(root,t);rng.value=Math.round(t*1000)};
    const tick=now=>{if(!playing)return;t=Math.max(0,t+Math.max(0,now-last)/T.dur);last=now;if(t>=1){t=1;playing=false;render();return}render();raf=requestAnimationFrame(tick)};
    const play=()=>{if(t>=1)t=0;playing=true;played=true;last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)};
    const pause=()=>{playing=false;cancelAnimationFrame(raf)};
    root.querySelector('.pl-bar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
      if(a==='play')play();if(a==='pause')pause();if(a==='stop'){pause();t=0;render()}if(a==='rew'){pause();t=Math.max(0,t-.2);render()}});
    rng.addEventListener('input',()=>{pause();t=rng.value/1000;render()});
    t=1;render();t=0;if(reduce){t=1}render();
    if(!reduce&&'IntersectionObserver' in window){new IntersectionObserver((es,o)=>{es.forEach(en=>{if(en.isIntersecting&&!played&&!en.target.closest('[hidden]')){play();o.disconnect()}})},{threshold:.6}).observe(root)}
  });
}

/* 이동 — scrollIntoView 대신 창 안에서만 스크롤 (구글 사이트 임베드에서 바깥 페이지가 움직이지 않게) */
function setHdr(){document.documentElement.style.setProperty('--hdr',document.getElementById('top').offsetHeight+'px')}
function tabIntoView(btn){const L=btn.offsetLeft,Rr=L+btn.offsetWidth;if(L<tabsEl.scrollLeft)tabsEl.scrollLeft=L-8;else if(Rr>tabsEl.scrollLeft+tabsEl.clientWidth)tabsEl.scrollLeft=Rr-tabsEl.clientWidth+8}
function go(i,scroll){
  cur=Math.max(0,Math.min(STEPS.length-1,i));
  STEPS.forEach((s,k)=>{document.getElementById(s.id).hidden=k!==cur;document.getElementById('tab-'+s.id).setAttribute('aria-selected',k===cur)});
  const s=STEPS[cur];
  sideEl.innerHTML=`<div class="st">이 화면 카드</div>`+s.cards.map((c,j)=>`<a href="#${s.id}-c${j+1}" data-c="${s.id}-c${j+1}">${c.t}</a>`).join('');
  selCard.innerHTML=s.cards.map((c,j)=>`<option value="${s.id}-c${j+1}">${cur}-${j+1} ${c.t}</option>`).join('');
  selStep.value=cur;
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===STEPS.length-1;
  tabIntoView(document.getElementById('tab-'+s.id));
  if(scroll) window.scrollTo({top:0,behavior:'smooth'});
  try{localStorage.setItem('ilwon5step',cur)}catch(e){}
  observe();
}
function jump(id){const el=document.getElementById(id);if(!el)return;setHdr();const y=el.getBoundingClientRect().top+window.scrollY-document.getElementById('top').offsetHeight-12;window.scrollTo({top:Math.max(0,y),behavior:'smooth'})}
sideEl.addEventListener('click',e=>{const a=e.target.closest('a');if(a){e.preventDefault();jump(a.dataset.c)}});
selCard.onchange=()=>jump(selCard.value);
selStep.onchange=()=>go(+selStep.value,true);
document.getElementById('prev').onclick=()=>go(cur-1,true);
document.getElementById('next').onclick=()=>go(cur+1,true);
let io;
function observe(){
  if(io) io.disconnect();
  if(!('IntersectionObserver' in window)) return;
  io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){const id=en.target.id;sideEl.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.c===id));if(selCard.value!==id) selCard.value=id;}})},{rootMargin:'-30% 0px -60% 0px'});
  document.querySelectorAll('#'+STEPS[cur].id+' .card').forEach(c=>io.observe(c));
  /* 숨겨져 있던 플레이어가 화면에 나타나면 자동 재생 */
  document.querySelectorAll('#'+STEPS[cur].id+' .pl').forEach(p=>{p.dispatchEvent(new Event('stepshow'))});
}
/* 복사 */
document.addEventListener('click',e=>{
  const b=e.target.closest('.cp');if(!b) return;
  const pre=document.getElementById(b.dataset.p);const txt=pre.textContent;
  const done=()=>{b.textContent='복사됨';b.classList.add('ok');setTimeout(()=>{b.textContent='복사';b.classList.remove('ok')},1600)};
  const fallback=()=>{const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);try{document.execCommand('copy');done()}catch(_){b.textContent='Ctrl+C'}};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fallback)}else fallback();
});
/* 글자 크기 */
let fs=20;try{fs=+localStorage.getItem('ilwon5fs')||20}catch(e){}
function applyFs(){document.documentElement.style.setProperty('--fs',fs+'px');setHdr()}
document.querySelectorAll('.fsz button').forEach(b=>b.onclick=()=>{fs=Math.max(16,Math.min(28,fs+(+b.dataset.fs)*2));try{localStorage.setItem('ilwon5fs',fs)}catch(e){}applyFs()});
if(fs!==20) applyFs();
/* 시작 */
let start=0;const h=location.hash.replace('#','');const hi=STEPS.findIndex(s=>s.id===h);
if(hi>=0) start=hi; else {try{start=+localStorage.getItem('ilwon5step')||0}catch(e){}}
initPlayers();go(start,false);setHdr();addEventListener('resize',setHdr);
</script>
