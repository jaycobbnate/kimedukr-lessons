<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>샷 · 무브 · 팝업 — 구글 플로우 실전 100분</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F8FA;--paper:#fff;--line:#DCE3EA;--ink:#1B2530;--ink2:#5A6B7C;--ac:#0E7C86;--ac2:#E3F3F4;--acl:#B7DEE1;
--set:#EEF2F7;--warn:#FFF3EC;--warnl:#F5D3BF;--ext:#F3EEFB;--extl:#D8CBF0;--fs:20px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Noto Sans KR",sans-serif;font-size:var(--fs);line-height:1.55;font-weight:400}
body.big{--fs:24px}
.nav{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid var(--line)}
.nav-in{max-width:1360px;margin:0 auto;padding:8px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:600;color:var(--ac);font-size:.78em;border-right:1px solid var(--line);padding-right:12px}
.tabs{display:flex;gap:2px;flex:1;flex-wrap:wrap}
.tab{border:none;border-bottom:3px solid transparent;background:none;padding:8px 10px;font-size:.74em;cursor:pointer;color:var(--ink2);font-family:inherit;font-weight:600}
.tab.active{color:var(--ac);border-bottom-color:var(--ac)}
.fb{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;font-size:.74em;cursor:pointer;font-family:inherit}
.step{display:none;max-width:1360px;margin:0 auto;padding:24px 24px 30px}.step.active{display:block}
.head{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:end;border-bottom:3px solid var(--ac);padding-bottom:12px;margin-bottom:18px}
.head .lab{font-size:.72em;color:var(--ac);font-weight:600;letter-spacing:.06em}
.head h1{margin:0;font-size:1.5em;font-weight:600;letter-spacing:-.01em}
.head .goal{margin:4px 0 0;color:var(--ink2);font-size:.9em;font-weight:300}
.head .time{font-size:1.6em;font-weight:300;color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.wide{grid-column:1/-1}
.card h2{margin:0 0 8px;font-size:1em;font-weight:600;display:flex;align-items:center;gap:8px}
.card h2 .tag{font-size:.7em;font-weight:600;color:#fff;background:var(--ac);border-radius:4px;padding:1px 7px}
.card p{margin:5px 0}.card ul,.card ol{margin:5px 0;padding-left:1.25em}.card li{margin:3px 0}
.set{background:var(--set)}.warn{background:var(--warn);border-color:var(--warnl)}.ext{background:var(--ext);border-color:var(--extl)}.key{background:var(--ac2);border-color:var(--acl)}
details{border-top:1px dashed var(--line);margin-top:10px;padding-top:6px}
summary{cursor:pointer;color:var(--ac);font-weight:600;font-size:.85em;list-style:none}
summary::before{content:"＋ ";}details[open] summary::before{content:"－ ";}
details p{font-size:.92em;color:var(--ink2)}
.fig{background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px;margin:8px 0}
.fig svg{width:100%;height:auto;display:block}
.fig .cap{font-size:.78em;color:var(--ink2);margin-top:4px}
.pr{position:relative;background:#F9FBFC;border:1px solid var(--line);border-radius:6px;padding:10px 92px 10px 12px;margin:6px 0;font-size:.86em;line-height:1.5}
.pr .en{font-weight:600}.pr .ko{display:block;color:var(--ink2);margin-top:3px;font-weight:300}.pr .w{display:block;font-size:.85em;color:var(--ac);margin-top:3px}
.pr .k{color:var(--ac);font-weight:600;background:var(--ac2);border-radius:3px;padding:0 4px}
.pr .st{display:inline-block;font-size:.75em;font-weight:600;color:#fff;background:var(--ink2);border-radius:4px;padding:0 7px;margin-bottom:4px}
.copy{position:absolute;top:8px;right:8px;border:1px solid var(--acl);background:#fff;color:var(--ac);border-radius:4px;padding:2px 9px;font-size:.75em;cursor:pointer;font-family:inherit}
.copy.done{background:var(--ac);color:#fff}
table{width:100%;border-collapse:collapse;font-size:.86em;background:#fff}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}th{color:var(--ac);font-weight:600;border-bottom:2px solid var(--ac)}
.tbl{overflow-x:auto}
.mono{font-family:"IBM Plex Mono",monospace;font-size:.9em}
.foot{max-width:1360px;margin:0 auto;padding:0 24px 50px;display:flex;justify-content:space-between;gap:12px}
.foot button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:10px 16px;font-size:.82em;cursor:pointer;font-family:inherit;max-width:48%}
.foot button:disabled{opacity:.3}
.ok{color:#1E7F4F;font-weight:600}.no{color:#B4382E;font-weight:600}
.lead{font-size:1.15em;font-weight:600;color:var(--ac)}
.nav-in{flex-wrap:nowrap}
.tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;flex:0 0 auto}
.fb{flex:0 0 auto;color:#222;font-family:"Noto Sans KR","IBM Plex Sans KR","Malgun Gothic",sans-serif;min-width:48px}
@media (max-width:900px){
 .nav-in{flex-wrap:wrap;padding:6px 12px;gap:6px}
 .brand{flex:1;border:none;padding:0;font-size:.7em}
 .tabs{order:3;flex:0 0 100%}
 .tab{font-size:.68em}
 .fb{font-size:.68em;padding:3px 8px}
 .grid{grid-template-columns:1fr}
 .step{padding:18px 12px 24px}
 .pr{padding-right:14px;padding-top:36px}
}
</style></head>
<body>
<div class="nav"><div class="nav-in"><div class="brand">일원 · AI 영상제작 · 구글 플로우</div><div class="tabs" id="tabs"></div><button class="fb" id="fontbtn" type="button">가+</button></div></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><marker id="m" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#E07A3F"/></marker></defs></svg>
<div id="app"></div>
<div class="foot"><button id="prev" type="button">←</button><button id="next" type="button">→</button></div>
<script>
const AC="#0E7C86",INK="#1B2530",G="#DCE3EA",OR="#E07A3F";
const defs="";
const svg=(w,h,i)=>`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${defs}${i}</svg>`;
const T=(x,y,t,s=13,c=INK,w=400,a="middle")=>`<text x="${x}" y="${y}" font-size="${s}" fill="${c}" font-weight="${w}" text-anchor="${a}" font-family="IBM Plex Sans KR,sans-serif">${t}</text>`;
const ar=(a,b,c,d,col=OR)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${col}" stroke-width="3" marker-end="url(#m)"/>`;
const grid=(w,h)=>{let s="";for(let x=20;x<w;x+=20)s+=`<line x1="${x}" y1="0" x2="${x}" y2="${h}" stroke="${G}" stroke-width=".6"/>`;for(let y=20;y<h;y+=20)s+=`<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="${G}" stroke-width=".6"/>`;return s};
const camI=(x,y,r=0)=>`<g transform="translate(${x} ${y}) rotate(${r})"><rect x="-16" y="-10" width="32" height="20" rx="3" fill="none" stroke="${AC}" stroke-width="2.5"/><path d="M16 -5 L26 -10 L26 10 L16 5 z" fill="none" stroke="${AC}" stroke-width="2.5"/><circle cx="-4" cy="0" r="5" fill="none" stroke="${AC}" stroke-width="2.5"/></g>`;
const cup=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><path d="M-14 -10 L-11 14 L11 14 L14 -10 z" fill="none" stroke="${INK}" stroke-width="2.5"/><path d="M14 -4 q12 2 0 12" fill="none" stroke="${INK}" stroke-width="2.5"/><line x1="-16" y1="-10" x2="16" y2="-10" stroke="${INK}" stroke-width="2.5"/></g>`;
const S={};
const mv=(name,inner)=>svg(240,130,grid(240,130)+inner+T(120,16,name,12,AC,600));
S.push=mv("push in",camI(50,70)+ar(80,70,140,70)+cup(195,70));
S.dolly=mv("dolly out",camI(130,70)+ar(105,70,45,70)+cup(195,70));
S.pan=mv("pan L→R",cup(60,80,.8)+cup(180,80,.8)+camI(120,50)+`<path d="M95 40 A30 30 0 0 1 145 40" fill="none" stroke="${OR}" stroke-width="3" marker-end="url(#m)"/>`);
S.orbit=mv("orbit",cup(120,80)+`<ellipse cx="120" cy="75" rx="75" ry="28" fill="none" stroke="${OR}" stroke-width="3" stroke-dasharray="6 5"/>`+camI(45,75));
S.tilt=mv("tilt up",cup(195,80)+camI(60,80)+`<path d="M90 100 A40 40 0 0 1 90 50" fill="none" stroke="${OR}" stroke-width="3" marker-end="url(#m)"/>`);
S.track=mv("tracking",cup(90,85)+ar(105,85,160,85,INK)+camI(90,40)+ar(115,40,175,40));
S.crane=mv("crane up",cup(150,85)+camI(70,95)+ar(70,75,70,30));
S.zoom=mv("zoom (lens)",camI(50,70)+cup(195,70)+`<rect x="165" y="45" width="60" height="55" fill="none" stroke="${OR}" stroke-width="2.5"/><rect x="178" y="55" width="34" height="35" fill="none" stroke="${OR}" stroke-width="2.5"/>`);
S.pvz=svg(720,190,grid(720,190)+T(180,30,"push in · 카메라 이동",14,AC,600)+T(540,30,"zoom · 초점거리 변화",14,AC,600)+cup(180,120,1.6)+`<rect x="60" y="60" width="70" height="60" fill="none" stroke="${INK}" stroke-width="1.5" opacity=".5"/><rect x="250" y="80" width="40" height="40" fill="none" stroke="${INK}" stroke-width="1.5" opacity=".5"/>`+T(180,170,"배경 물체 간 거리가 변한다 (시차 발생)",12,INK)+cup(540,120,1.6)+`<rect x="420" y="60" width="70" height="60" fill="none" stroke="${INK}" stroke-width="1.5" opacity=".5"/><rect x="600" y="60" width="70" height="60" fill="none" stroke="${INK}" stroke-width="1.5" opacity=".5"/>`+T(540,170,"모든 것이 같은 비율로 커진다 (시차 없음)",12,INK)+`<line x1="360" y1="15" x2="360" y2="180" stroke="${G}" stroke-width="2"/>`);
S.map=svg(720,120,grid(720,120)+[["T2V","무브 변수 8종",30],["T2I","앵글 확정 3장",205],["I2V","샷×무브 결합",380],["팝업","메뉴판 이미지→재현",555]].map(([a,b,x],i)=>`<rect x="${x}" y="25" width="140" height="70" rx="4" fill="${i==3?AC:'#fff'}" stroke="${AC}" stroke-width="2"/>`+T(x+70,55,a,18,i==3?"#fff":AC,600)+T(x+70,80,b,12,i==3?"#fff":INK)).join("")+ar(172,60,203,60)+ar(347,60,378,60)+ar(522,60,553,60));
S.shots=svg(720,200,grid(720,200)+[["WS",110,.9,"잔 + 테이블 + 카페"],["MS",360,1.8,"잔 + 손·접시"],["CU",610,3.6,"잔 표면 · 거품"]].map(([n,x,s,d])=>`<rect x="${x-90}" y="20" width="180" height="120" fill="#fff" stroke="${INK}" stroke-width="1.5"/><clipPath id="k${x}"><rect x="${x-90}" y="20" width="180" height="120"/></clipPath><g clip-path="url(#k${x})">${cup(x,90+(s-1)*15,s)}</g>`+T(x,165,n,15,AC,600)+T(x,185,d,12)).join(""));
S.angles=svg(720,210,grid(720,210)+`<line x1="40" y1="170" x2="680" y2="170" stroke="${INK}" stroke-width="1.5"/>`+cup(360,155,1.6)+camI(110,165)+T(110,195,"low — 위엄",12,AC,600)+camI(250,110)+T(250,95,"eye level",12,AC,600)+camI(600,55)+T(600,40,"high — 관찰",12,AC,600)+camI(360,30,90)+T(400,30,"top-down 90°",12,AC,600)+ar(140,160,300,140)+ar(575,70,420,125)+ar(360,55,360,120)+`<line x1="40" y1="170" x2="40" y2="30" stroke="${G}" stroke-width="1"/>`+T(32,40,"높이",10,INK,400,"end"));
S.ar=svg(720,180,grid(720,180)+`<rect x="30" y="30" width="230" height="130" fill="#fff" stroke="${AC}" stroke-width="2.5"/><rect x="320" y="15" width="85" height="150" fill="#fff" stroke="${AC}" stroke-width="2.5"/><rect x="460" y="15" width="230" height="150" fill="none" stroke="${G}" stroke-width="1.5" stroke-dasharray="5 4"/>`+T(145,100,"16:9",26,AC,600)+T(145,130,"영상 · 이미지 둘 다",11)+T(362,95,"9:16",20,AC,600)+T(362,120,"영상 · 이미지",10)+T(575,85,"1:1 · 4:3 · 3:4",16,INK,600)+T(575,110,"이미지만 가능",12)+T(575,135,"→ 영상으로 못 잇는다",12,OR,600));
S.blocks=svg(720,100,grid(720,100)+[["subject","피사체"],["shot size","샷"],["angle","앵글"],["light / mood","조명"]].map(([a,b],i)=>`<rect x="${20+i*175}" y="18" width="160" height="64" fill="${i==2?AC:'#fff'}" stroke="${AC}" stroke-width="2"/>`+T(100+i*175,45,a,15,i==2?"#fff":AC,600)+T(100+i*175,68,b,12,i==2?"#fff":INK)).join(""));
S.match=svg(720,210,grid(720,210)+[["WS 16:9",45],["CU 9:16",105],["top-down 16:9",165]].map(([n,y])=>`<rect x="30" y="${y-20}" width="170" height="40" fill="${AC}"/>`+T(115,y+5,n,14,"#fff",600)).join("")+[["dolly in · orbit",45],["subtle push in · tilt",105],["orbit · crane up",165]].map(([n,y])=>`<rect x="500" y="${y-20}" width="200" height="40" fill="#fff" stroke="${AC}" stroke-width="2"/>`+T(600,y+5,n,13,INK,600)).join("")+ar(205,45,495,45)+ar(205,105,495,105)+ar(205,165,495,165)+T(360,30,"어울리는 무브",11,AC,600)+`<line x1="205" y1="105" x2="495" y2="45" stroke="${G}" stroke-width="2" stroke-dasharray="4 4"/>`+T(360,80,"점선 = 피할 조합 (CU에 orbit)",10,OR));
S.i2v=svg(720,130,grid(720,130)+`<rect x="20" y="20" width="330" height="90" fill="#fff" stroke="#B4382E" stroke-width="2"/><rect x="370" y="20" width="330" height="90" fill="#fff" stroke="#1E7F4F" stroke-width="2"/>`+T(185,48,"이미지가 이미 말한 것",14,"#B4382E",600)+T(185,75,"subject · outfit · place · time",13,INK)+T(185,98,"→ 프롬프트에서 삭제",11)+T(535,48,"이미지가 말 못 하는 것",14,"#1E7F4F",600)+T(535,75,"move · speed · sound · micro-action",13,INK)+T(535,98,"→ 이것만 쓴다",11));
S.pop=svg(720,200,grid(720,200)+`<rect x="40" y="140" width="640" height="10" fill="#fff" stroke="${INK}" stroke-width="1.5"/>`+T(360,175,"flat printed menu (paper)",12)+[["① rim — 그릇 두께",150],["② contact shadow — 접지 그림자",380],["③ parallax — 앞뒤 어긋남",600]].map(([n,x],i)=>`<ellipse cx="${x}" cy="140" rx="60" ry="9" fill="${INK}" opacity="${i==1?.35:.15}"/><ellipse cx="${x+(i==2?12:0)}" cy="${100}" rx="58" ry="20" fill="#fff" stroke="${AC}" stroke-width="3"/>${i==0?`<ellipse cx="${x}" cy="100" rx="58" ry="20" fill="none" stroke="${AC}" stroke-width="3" transform="translate(0 6)"/>`:''}${i==2?`<ellipse cx="${x-12}" cy="104" rx="58" ry="20" fill="none" stroke="${AC}" stroke-width="1.5" stroke-dasharray="4 4"/>`:''}`+T(x,45,n,13,INK,600)).join("")+ar(380,125,380,138,INK));
S.anat=svg(720,100,grid(720,100)+[["angle",1],["subject",0],["move",0],["transition",1],["sound",0]].map(([n,f],i)=>`<rect x="${20+i*138}" y="18" width="126" height="60" fill="${f?AC:'#fff'}" stroke="${AC}" stroke-width="2"/>`+T(83+i*138,53,n,15,f?"#fff":INK,600)).join(""));
S.omni=svg(720,120,grid(720,120)+`<rect x="20" y="25" width="200" height="70" fill="#fff" stroke="${AC}" stroke-width="2"/><rect x="260" y="25" width="200" height="70" fill="#fff" stroke="${AC}" stroke-width="2"/><rect x="500" y="25" width="200" height="70" fill="${AC}"/>`+T(120,52,"1차 생성",15,AC,600)+T(120,78,"Veo 3.1 · 360p",11)+T(360,52,"말로 고치기",15,AC,600)+T(360,78,"Omni Flash · 대화형",11)+T(600,52,"확정",15,"#fff",600)+T(600,78,"9:16 or 16:9 · 다운로드",11,"#fff")+ar(225,60,255,60)+ar(465,60,495,60));
/* 추가: 메뉴판 이미지 → 팝업 2단계 */
S.menu=svg(720,190,grid(720,190)+`<rect x="30" y="35" width="290" height="115" fill="#fff" stroke="${INK}" stroke-width="2"/>`+[0,1,2].map(i=>`<rect x="${52+i*92}" y="58" width="70" height="50" fill="#E3F3F4" stroke="${AC}" stroke-width="1.5"/><line x1="${52+i*92}" y1="125" x2="${122+i*92}" y2="125" stroke="${INK}" stroke-width="3"/>`).join("")+T(175,175,"① 이미지 생성: 평평한 메뉴판 (음식 사진 인쇄)",13,AC,600)+ar(330,92,392,92)+`<rect x="400" y="120" width="290" height="10" fill="#fff" stroke="${INK}" stroke-width="1.5"/>`+[0,1,2].map(i=>`<ellipse cx="${448+i*97}" cy="120" rx="30" ry="6" fill="${INK}" opacity=".25"/><ellipse cx="${448+i*97}" cy="${78-(i%2)*10}" rx="30" ry="12" fill="#fff" stroke="${AC}" stroke-width="3"/>`).join("")+T(545,175,"② 프레임→동영상: 사진이 입체로 솟음",13,AC,600)+T(360,22,"메뉴판 이미지가 없으면 솟을 재료가 없습니다",12,OR,600));

/* 카드 헬퍼 (P에 단계 라벨 st 추가) */
const P=(en,ko,w,st)=>`<div class="pr">${st?`<span class="st">${st}</span><br>`:""}<span class="en">${en}</span><button class="copy" type="button">복사</button><span class="ko">${ko}</span>${w?`<span class="w">${w}</span>`:""}</div>`;
const card=(h,body,cls="",wide=false,tag="")=>`<div class="card ${cls}${wide?" wide":""}"><h2>${tag?`<span class="tag">${tag}</span>`:""}${h}</h2>${body}</div>`;
const fig=(s,c)=>`<div class="fig">${s}${c?`<div class="cap">${c}</div>`:""}</div>`;
const more=(t,body)=>`<details><summary>${t}</summary>${body}</details>`;
/* ===== STEP 1 (카페·제품) — 원본 유지 ===== */
const BASE=[["카페","A ceramic latte cup on a wooden cafe counter, morning window light, steam rising.","나무 카운터 위 세라믹 라떼 잔. 아침 창빛, 김이 오른다."],
["디저트","A slice of strawberry cake on a white plate, marble table, soft studio light.","흰 접시 위 딸기 케이크 한 조각. 대리석 테이블, 부드러운 스튜디오 조명."],
["바리스타","A barista in an apron pours milk into a cup behind the counter, warm cafe interior.","앞치마 바리스타가 카운터 뒤에서 잔에 우유를 붓는다. 따뜻한 카페 내부."]];
const MOVES=[
["push","push in","Camera slowly pushes in toward the subject.","피사체를 향해 천천히 전진.","push in = 카메라 물리 이동 · slowly = 속도 변수 (기본값 없음, 안 쓰면 빠르다)","피사체를 '중요하게' 만든다. 제품 컷 기본값."],
["dolly","dolly out","Camera slowly dollies out, revealing the whole scene.","천천히 후진, 주변 전체 노출.","revealing = 후진의 목적. 목적어가 있으면 프레이밍이 안정된다","공간 소개, 엔딩."],
["pan","pan","Camera pans slowly from left to right across the scene.","장면을 가로질러 좌→우 패닝.","across the scene = 팬의 경로. 경로 없는 팬은 흔들린다","여러 제품을 훑을 때."],
["orbit","orbit","Camera orbits 90 degrees around the subject, keeping it centered.","피사체 중심으로 90° 궤도, 중앙 유지.","keeping it centered = 프레임 이탈 방지 · 90 = 8초에 맞는 각도","제품 360° 쇼케이스의 절반. 팝업에서 재사용."],
["tilt","tilt up","Camera tilts up slowly from the bottom to the top of the subject.","피사체 아래에서 위까지 천천히 틸트업.","from A to B = 시작·끝 지정","세로 제품(병·잔)의 리빌."],
["track","tracking","The subject moves across the scene; camera tracks alongside at the same speed.","피사체가 이동, 카메라가 같은 속도로 병행.","same speed = 상대속도 0. 없으면 카메라가 앞선다","움직이는 피사체 전용 — 3번 바리스타 문장을 고른 분만. 잔·케이크는 스스로 움직이지 않아요."],
["crane","crane up","Camera rises straight up, looking down at the subject.","수직 상승, 시선은 피사체.","looking down = 틸트 결합 명시. 없으면 천장을 본다","탑다운으로 '도착'하는 무브."],
["zoom","zoom","Slow zoom in, lens only, camera stays fixed.","렌즈만 줌인, 카메라 고정.","lens only + stays fixed = 이중 명시. 하나만 쓰면 push in으로 해석","시차가 없어 평면적. 의도적으로 '감시 카메라 느낌'을 낼 때만."]];
const step1=()=>{
  let g=card("고정 문장 3종 — 하나 고르기",`<p>피사체 문장은 고정, 뒤의 카메라 문장만 교체. 아래 무브 문장은 전부 <b>the subject</b>로 써서 셋 중 무엇을 골라도 그대로 붙습니다. 텍스트→동영상 · Veo 3.1 <b>Lite</b> · 16:9 · <b>360p</b>.</p>`+BASE.map(([n,e,k])=>P(e+' <span class="k">+ camera</span>',k)).join("")+more("왜 문장을 고정하나",`<p>변수를 하나만 바꿔야 결과 차이를 그 변수 탓으로 돌릴 수 있습니다. 두 개를 바꾸면 원인을 못 가립니다. 무브 감각은 이 비교에서 나옵니다.</p>`),"key",true);

  g+=card("규칙 하나",`<p class="lead">카메라 지시는 문장당 하나.</p><p>두 무브를 한 문장에 넣으면 Veo는 평균을 냅니다. 결합은 씬빌더에서 클립을 이어서.</p>`,"set");
  MOVES.forEach(([id,name,en,ko,w,use],i)=>{g+=card(name,fig(S[id])+P(en,ko,w)+`<p style="font-size:.9em;color:var(--ink2)">${use}</p>`,[0,3,6,7].includes(i)?"":"ext",false,[0,3,6,7].includes(i)?"필수":"확장")});
  g+=card("push in vs zoom",fig(S.pvz)+more("왜 다른가",`<p>push in은 카메라가 이동하므로 앞 물체와 뒤 물체의 상대 위치가 변합니다(시차). zoom은 초점거리만 바뀌어 모든 것이 같은 비율로 확대됩니다. 사람 눈은 시차를 '입체'로 읽기 때문에 push in이 자연스럽고, zoom은 납작합니다.</p>`),"",true);
  g+=card("더 돌려볼 것",P("Camera pushes in slowly, then holds for the last 2 seconds.","천천히 전진 후 마지막 2초 정지.","then holds = 순서 지시. Veo는 대략적 순서를 지킨다")+P("Camera orbits 90 degrees counter-clockwise, low angle, keeping the subject centered.","반시계 90° 궤도, 로우앵글, 중앙 유지.","orbit + angle 결합 — 앵글은 무브가 아니라 '위치'라 함께 써도 된다")+P("Handheld, slight natural shake, camera slowly pushes in.","핸드헬드, 미세한 흔들림, 천천히 전진.","handheld = 스타일 변수. 브이로그 톤")+P("Camera dollies out while the barista keeps pouring. Milk sound, no music.","바리스타가 계속 붓는 동안 후진.","3번 바리스타 문장 전용 · 피사체 동작 + 카메라 무브 동시 — 서로 다른 주체라 가능"),"ext",true);
  g+=card("흔한 실패",`<div class="tbl"><table><tr><th>증상</th><th>원인</th><th>수정</th></tr><tr><td>제자리 떨림</td><td>무브 2개</td><td>하나로</td></tr><tr><td>피사체 이탈</td><td>keeping … centered 누락</td><td>추가</td></tr><tr><td>너무 빠름</td><td>slowly 누락</td><td>추가 (Veo 기본 속도는 빠르다)</td></tr></table></div>`,"warn");
  return g;};

/* ===== STEP 2 — 원본 유지 ===== */

  g+=card("직접 ③ 탑다운 · 16:9 (STEP 4 탑다운 무브용)",P("Top-down view, 90 degrees straight down. A Korean dessert cafe set on a light oak table: a plate of injeolmi bingsu, a cup of yuja tea with floating slices, three colorful tteok on a small wooden board, clean styling, soft daylight.","수직 탑다운. 연한 오크 테이블 위 한식 디저트 세트 — 인절미 빙수, 유자 슬라이스 띄운 유자차, 나무 보드 위 색 떡 세 개.","이 이미지는 테이블 위 실물 세트 — 메뉴판 팝업용 '종이 메뉴판' 이미지는 STEP 5에서 따로 만듭니다"));
  g+=card("블록별 대체어",`<div class="tbl"><table><tr><th>블록</th><th>영문</th><th>뜻</th></tr><tr><td rowspan="4">subject</td><td>a ceramic latte cup</td><td>세라믹 라떼 잔</td></tr><tr><td>a slice of strawberry cake</td><td>딸기 케이크 조각</td></tr><tr><td>a bottle of cold brew with condensation</td><td>물방울 맺힌 콜드브루 병</td></tr><tr><td>a barista in an apron</td><td>앞치마 바리스타</td></tr><tr><td rowspan="3">shot</td><td>wide shot, whole counter visible</td><td>와이드</td></tr><tr><td>medium shot, cup and hands</td><td>미디엄</td></tr><tr><td>close-up, surface fills the frame</td><td>클로즈업</td></tr><tr><td rowspan="4">angle</td><td>eye level</td><td>눈높이</td></tr><tr><td>low angle, looking up</td><td>로우</td></tr><tr><td>high angle, 45 degrees</td><td>하이 45°</td></tr><tr><td>top-down view, 90 degrees straight down</td><td>탑다운</td></tr><tr><td rowspan="4">light</td><td>morning window light</td><td>아침 창빛</td></tr><tr><td>soft studio light, white background</td><td>스튜디오, 흰 배경</td></tr><tr><td>warm tungsten, evening</td><td>따뜻한 백열, 저녁</td></tr><tr><td>overcast, flat light, no shadows</td><td>흐림, 무그림자</td></tr></table></div>`,"",true);

/* ===== STEP 4 — 원본 유지 ===== */

/* ===== STEP 5 — 수정: 메뉴판 원본 이미지부터 만들기 ===== */

STEPS.forEach(([t,tm,goal,fn],i)=>{const s=document.createElement('section');s.className='step';
 s.innerHTML=`<div class="head"><div><div class="lab">STEP ${i}</div><h1>${t}</h1>${goal?`<p class="goal">${goal}</p>`:""}</div><div></div><div class="time">${tm}<span style="font-size:.5em">분</span></div></div><div class="grid">${fn()}</div>`;
 app.appendChild(s);const b=document.createElement('button');b.className='tab';b.type='button';b.textContent=i+' '+t;b.onclick=()=>go(i);tabs.appendChild(b);});
const steps=[...document.querySelectorAll('.step')],prev=document.getElementById('prev'),next=document.getElementById('next');let cur=0;
function go(i){cur=i;steps.forEach((s,j)=>s.classList.toggle('active',j===i));[...tabs.children].forEach((t,j)=>t.classList.toggle('active',j===i));prev.disabled=i===0;next.disabled=i===steps.length-1;prev.textContent=i>0?'← '+STEPS[i-1][0]:'←';next.textContent=i<steps.length-1?STEPS[i+1][0]+' →':'→';window.scrollTo(0,0);const at=tabs.children[i];if(at&&at.scrollIntoView)at.scrollIntoView({block:'nearest',inline:'center'});}
prev.onclick=()=>cur>0&&go(cur-1);next.onclick=()=>cur<steps.length-1&&go(cur+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<steps.length-1)go(cur+1);if(e.key==='ArrowLeft'&&cur>0)go(cur-1);});
document.getElementById('fontbtn').onclick=function(){document.body.classList.toggle('big');this.textContent=document.body.classList.contains('big')?'가-':'가+';};
document.querySelectorAll('.copy').forEach(btn=>btn.onclick=()=>{const t=btn.parentNode.querySelector('.en').textContent.replace(/\s+/g,' ').trim();const done=()=>{btn.textContent='복사됨';btn.classList.add('done');setTimeout(()=>{btn.textContent='복사';btn.classList.remove('done')},1500)};if(navigator.clipboard)navigator.clipboard.writeText(t).then(done,()=>{fb(t);done()});else{fb(t);done()}});
function fb(t){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove()}
go(0);
