<!DOCTYPE html>
<html lang="ko" data-theme="paris">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1회차 · 노을 카페, 나의 첫 8초</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --bg:#faf9f7; --card:#fff; --ink:#1c1b22; --ink2:#6b6975; --line:#e9e7ee; --fill:#f3f1f7;
  --accent:#f0623e; --accent-soft:#fff0ea; --lilac:#7b5cff; --lilac-soft:#f1edff;
  --green:#1f8a4c; --green-soft:#e9f7ee; --blue:#2d6cdf; --blue-soft:#eaf1fd; --amber:#b7791f; --amber-soft:#fff6e5;
  --fs:20px; --fs-prompt:19px; --fs-h:28px; --fs-hero:34px; --r:16px; --sh:0 1px 2px rgba(20,18,30,.05),0 6px 20px rgba(20,18,30,.06);
}
html[data-size="big"]{ --fs:24px; --fs-prompt:22px; --fs-h:32px; --fs-hero:40px; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:var(--fs);line-height:1.6;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:10px}

/* 상단 */
.top{position:sticky;top:0;z-index:20;background:rgba(250,249,247,.94);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border-bottom:1px solid var(--line)}
.top .row1{max-width:1100px;margin:0 auto;padding:12px 22px 6px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.brand .dot{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#ffb36b,#f0623e 55%,#7b5cff);flex:none}
.brand .t{font-weight:800;font-size:.9em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .t small{display:block;font-weight:500;color:var(--ink2);font-size:.72em}
.ctl{display:flex;gap:6px}
.ctl button{min-height:40px;padding:0 12px;border-radius:10px;font-weight:600;font-size:.78em;color:var(--ink2);background:var(--fill)}
.ctl button[aria-pressed="true"]{background:var(--ink);color:#fff}
.tabs{max-width:1100px;margin:0 auto;padding:4px 22px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:40px;padding:0 14px;border-radius:999px;font-weight:700;font-size:.8em;color:var(--ink2);background:transparent;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tab b{font-weight:800;font-variant-numeric:tabular-nums}
.tab:hover{background:var(--fill)}
.tab.on{background:var(--accent);color:#fff}
.tab.done{color:var(--ink)}
.tab.done b::after{content:" ✓";color:var(--green)}
.tab.on.done b::after{color:#fff}

/* 본문 */
.wrap{max-width:1100px;margin:0 auto;padding:22px 22px 60px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:6px 0 18px;flex-wrap:wrap}
.head .n{font-size:.8em;font-weight:700;color:var(--accent);letter-spacing:.04em}
.head h2{font-size:var(--fs-h);font-weight:800;letter-spacing:-.02em;line-height:1.2}
.head .arrows{display:flex;gap:6px}
.head .arrows button{min-height:42px;padding:0 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:.8em;color:var(--ink)}
.head .arrows button.next{background:var(--ink);color:#fff;border-color:var(--ink)}
.head .arrows button:disabled{opacity:.35;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--sh)}
.card.wide{grid-column:1/-1}
.card h3{font-size:1em;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;letter-spacing:-.01em}
.pill{font-size:.66em;font-weight:700;padding:3px 10px;border-radius:999px;line-height:1.5}
.pill.common{color:var(--green);background:var(--green-soft)}
.pill.ext{color:var(--blue);background:var(--blue-soft)}
.card.ext{background:linear-gradient(180deg,#fff,var(--blue-soft));border-color:#d8e4fb}
p{margin-bottom:10px}
ul,ol{margin:0 0 10px 1.2em}
li{margin:5px 0}
strong{font-weight:700}
.big{font-size:1.08em;font-weight:800}
.sub,.muted{color:var(--ink2);font-size:.88em}
.tip{color:var(--ink2);font-size:.88em;padding:10px 14px;background:var(--fill);border-radius:12px;margin:10px 0 0}
.warn{padding:10px 14px;border-radius:12px;background:var(--amber-soft);color:var(--amber);margin:10px 0;font-weight:600;font-size:.92em}
.setting{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;background:var(--lilac-soft);color:#3f2fa3;border-radius:12px;margin:8px 0 12px;font-size:.9em;font-weight:500}
.setting .lbl{font-weight:700;white-space:nowrap}
.setting .lbl::before{content:"⚙";margin-right:6px}
.formula{font-weight:800;padding:12px 16px;background:var(--ink);color:#fff;border-radius:12px;margin:8px 0 12px;line-height:1.5;word-break:keep-all}
.formula i{font-style:normal;color:#ffb36b}
.hero{font-size:var(--fs-hero);font-weight:900;line-height:1.15;letter-spacing:-.03em;margin:0 0 10px}
.hero .ac{background:linear-gradient(90deg,#f0623e,#ff8c5a 50%,#7b5cff);-webkit-background-clip:text;background-clip:text;color:transparent}

/* 프롬프트 */
.prompt{background:var(--fill);border-radius:14px;margin:10px 0;overflow:hidden}
.prompt .bar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 0}
.prompt .name{font-size:.76em;font-weight:700;color:var(--ink2)}
.prompt .copy{background:var(--accent);color:#fff;font-weight:700;font-size:.82em;padding:6px 16px;border-radius:999px;min-height:38px;box-shadow:0 2px 6px rgba(240,98,62,.3)}
.prompt .copy.done{background:var(--green);box-shadow:none}
.prompt pre{font-family:inherit;font-size:var(--fs-prompt);line-height:1.75;padding:8px 16px 16px;white-space:pre-wrap;word-break:keep-all;font-weight:500}
.prompt.ext .copy{background:var(--blue)}

.rows{margin:4px 0 6px}
.row{display:flex;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}
.row:last-child{border-bottom:none}
.row .k{font-weight:700;flex:0 0 7.5em;line-height:1.4}
.row .v{flex:1;color:var(--ink2);line-height:1.45;font-size:.9em}
.row.hi{background:var(--accent-soft);margin:0 -10px;padding:9px 10px;border-radius:10px;border:none}
.row.hi .v{color:var(--ink)}
.row.hi .k{color:var(--accent)}
.check{list-style:none;margin:4px 0 6px}
.check li{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.check li:last-child{border-bottom:none}
.check input{width:26px;height:26px;flex:none;margin-top:6px;accent-color:var(--green);cursor:pointer}
.check label{cursor:pointer;flex:1}
.check input:checked+label{color:var(--ink2);text-decoration:line-through}
.words{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px}
.words span{background:var(--fill);border-radius:999px;padding:4px 14px;font-weight:600;font-size:.88em}
.words span.hi{background:var(--accent);color:#fff}
.result{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
.result:last-of-type{border-bottom:none}
.result .num{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-size:.8em;align-self:center}

/* 테마 */
.theme{display:flex;gap:10px;margin:10px 0 6px}
.theme button{flex:1;text-align:left;padding:16px 18px;border-radius:14px;background:var(--fill);font-weight:800;line-height:1.3;border:2px solid transparent}
.theme button small{display:block;font-weight:500;color:var(--ink2);font-size:.74em;margin-top:4px}
.theme button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.paris,.jeju{display:none}
html[data-theme="paris"] .paris{display:revert}
html[data-theme="jeju"] .jeju{display:revert}
pre.paris,pre.jeju{display:none}
html[data-theme="paris"] pre.paris{display:block}
html[data-theme="jeju"] pre.jeju{display:block}

/* 프레이밍 */
.frames{display:flex;gap:10px;overflow-x:auto;padding:4px 0 10px;scroll-snap-type:x mandatory}
.frame{flex:0 0 132px;scroll-snap-align:start;text-align:center;background:var(--fill);border-radius:12px;padding:8px}
.frame.hi{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.frame svg{width:100%;height:auto;display:block}
.frame .fn{font-weight:800;font-size:.88em;margin-top:6px;line-height:1.3}
.frame .fe{font-size:.64em;color:var(--ink2);line-height:1.3}

/* 하단 이동 */
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.foot button{min-height:52px;padding:0 20px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:.9em;flex:1;text-align:left}
.foot button.next{background:var(--accent);color:#fff;border-color:var(--accent);text-align:right}
.foot button:disabled{opacity:.35;cursor:default}
html[data-ext="off"] .card.ext{display:none}
@media (max-width:700px){.wrap{padding:16px 14px 40px}.card{padding:16px 16px}.top .row1,.tabs{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<header class="top">
  <div class="row1">
    <div class="brand"><div class="dot"></div><div class="t">노을 카페, 나의 첫 8초<small>SNS·유튜브를 사로잡는 AI영상제작 · 1회차</small></div></div>
    <div class="ctl">
      <button id="btnExt" aria-pressed="true">확장 보기</button>
      <button id="btnSize" aria-pressed="false">가+</button>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<div class="wrap">
  <div class="head">
    <div><div class="n" id="hn">STEP 0</div><h2 id="ht"></h2></div>
    <div class="arrows"><button id="aPrev">← 이전</button><button id="aNext" class="next">다음 →</button></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="foot"><button id="fPrev"></button><button id="fNext" class="next"></button></div>
</div>

<script>
/* ---------- 프레이밍 실루엣 SVG ---------- */
function sil(top,bot){ // top/bot: 0~1 of body shown, crop box
  return `<svg viewBox="0 0 100 130" aria-hidden="true">
  <rect x="2" y="2" width="96" height="126" fill="#fff" stroke="#e3e1ea" stroke-width="2"/>
  <g transform="translate(0,${top})">
   <circle cx="50" cy="26" r="13" fill="#7c7a86"/>
   <path d="M30 44 q20 -10 40 0 l6 40 h-52z" fill="#7c7a86"/>
   <rect x="34" y="82" width="12" height="42" fill="#7c7a86"/><rect x="54" y="82" width="12" height="42" fill="#7c7a86"/>
  </g>
  <rect x="2" y="${bot}" width="96" height="${126-bot+2}" fill="#fff"/>
  </svg>`;
}
const FR=[
 ['눈·입만','Extreme Close-Up (ECU)',-30,60],
 ['얼굴','Close-Up (CU)',-10,70],
 ['가슴 위','Medium Close-Up (MCU)',0,82],
 ['허리 위','Medium Shot (MS)',0,98],
 ['무릎 위','Medium Long Shot (MLS)',0,112],
 ['전신','Full Shot (FS)',0,128],
 ['멀리','Long Shot (LS)',0,128],
];
function frames(){
  return '<div class="frames">'+FR.map((f,i)=>{
    let svg = i==6 ? `<svg viewBox="0 0 100 130" aria-hidden="true"><rect x="2" y="2" width="96" height="126" fill="#fff" stroke="#e3e1ea" stroke-width="2"/><g transform="translate(35,60) scale(.3)"><circle cx="50" cy="26" r="13" fill="#7c7a86"/><path d="M30 44 q20 -10 40 0 l6 40 h-52z" fill="#7c7a86"/><rect x="34" y="82" width="12" height="42" fill="#7c7a86"/><rect x="54" y="82" width="12" height="42" fill="#7c7a86"/></g><path d="M2 100 q30 -20 60 0 t36 0" fill="none" stroke="#e3e1ea" stroke-width="2"/></svg>` : sil(f[2],f[3]);
    return `<div class="frame ${i==3?'hi':''}">${svg}<div class="fn">${f[0]}${i==3?' ⭐':''}</div><div class="fe">${f[1]}</div></div>`;
  }).join('')+'</div>';
}
function prompt(name,text,ext){
  const id='p'+Math.random().toString(36).slice(2,7);
  return `<div class="prompt ${ext?'ext':''}"><div class="bar"><span class="name">${name}</span><button class="copy" data-copy="${id}">복사</button></div><pre id="${id}">${text}</pre></div>`;
}
function promptTheme(name,paris,jeju,ext){
  const a='p'+Math.random().toString(36).slice(2,7), b='p'+Math.random().toString(36).slice(2,7);
  return `<div class="prompt ${ext?'ext':''}"><div class="bar"><span class="name">${name}</span><button class="copy" data-copy-theme="${a}|${b}">복사</button></div><pre class="paris" id="${a}">${paris}</pre><pre class="jeju" id="${b}">${jeju}</pre></div>`;
}
const setting=(t)=>`<div class="setting"><span class="lbl">플로우 설정 버튼</span>${t}</div>`;
const check=(items)=>'<ul class="check">'+items.map((t,i)=>{const id='c'+Math.random().toString(36).slice(2,7);return `<li><input type="checkbox" id="${id}"><label for="${id}">${t}</label></li>`}).join('')+'</ul>';
const rows=(arr)=>'<div class="rows">'+arr.map(r=>`<div class="row ${r[2]||''}"><div class="k">${r[0]}</div><div class="v">${r[1]}</div></div>`).join('')+'</div>';

/* ---------- 카드 데이터 ---------- */
const STEPS=[
 [0,'오늘 손에 남는 것'],[1,'준비 점검'],[2,'원리 한 장'],[3,'비율은 버튼으로'],[4,'플로우 이미지 + 모델 3종'],
 [5,'인물 프레이밍'],[6,'효과·분위기 단어장'],[7,'딥엘로 영어 프롬프트'],[8,'실습 A · 첫 이미지'],
 [9,'영상 모델 · 오늘은 옴니'],[10,'실습 B · 이미지→영상'],[11,'실습 C · 내 취향 + 마무리']
];
const C=[]; // {step, sub, badge, body}
const add=(step,sub,badge,body)=>C.push({step,sub,badge,body});

add(0,'주제 고르기',null,`
<div class="hero">노을 카페,<br><span class="ac">나의 첫 8초</span></div>
<p class="big">오늘 장면을 하나 고르세요.</p>
<div class="theme">
 <button data-theme="paris" aria-pressed="false">🇫🇷 파리<small>센 강변 카페 · 와인 · 에펠탑</small></button>
 <button data-theme="jeju" aria-pressed="false">🇰🇷 제주<small>애월 바닷가 카페 · 커피 · 노을</small></button>
</div>
<p class="sub">나중에 상단 목차에서 STEP 0으로 와서 바꿀 수 있어요.</p>`);
add(0,'오늘의 결과물',null,`
<div class="result"><div class="num">1</div><div><strong>가로 8초 영상</strong> 1개<br><span class="sub">유튜브용 16:9</span></div></div>
<div class="result"><div class="num">2</div><div><strong>세로 8초 영상</strong> 1개<br><span class="sub">쇼츠용 9:16, 같은 장면</span></div></div>
<div class="result"><div class="num">3</div><div><strong>내 취향 이미지 + 영상</strong> 1개</div></div>
<div class="tip">🟢 공통은 실습 A → B → C 세 개만 따라오면 세 가지 모두 완성됩니다.<br>🔵 확장 카드는 상단 「확장」 버튼을 켜면 나타납니다.</div>`);

add(1,'4개 모두 체크되면 통과','common',`
${check(['구글 계정 로그인','gemini.google.com → 화면에 <strong>Pro</strong> 표시','labs.google/fx/tools/flow → 프로젝트 만들기 화면','플로우 오른쪽 위 <strong>크레딧 숫자</strong> 확인','(선택) deepl.com 탭 열어두기'])}
<div class="tip">하나라도 안 되면 옆자리 짝꿍에게 먼저, 그래도 안 되면 손 들어주세요.</div>`);
add(1,'12주 흐름 · 휴강',null,`
${rows([['기본 1~4회','내 첫 영상 · 주인공 · 콘티 · 카메라'],['응용 5~8회','여행 · 하루 · 말하기 · 다큐'],['완성 9~12회','식품 · 화장품 · 내 가게 · 30초 영화']])}
<div class="warn">휴강: 9/24·25(추석) · 10/5(개천절 대체) · 10/9(한글날)</div>`);

add(2,'글이 그림이 되고, 그림이 영상이 된다',null,`
<p class="big">프롬프트 = 설명서</p>
<p>누가 / 어디서 / 무엇을 / 어떤 분위기<br>네 칸만 채우면 됩니다.</p>
<p class="big">이미지 → 영상</p>
<p>첫 장면(이미지) + 움직임 한 줄 = 8초 영상</p>
<div class="warn">비율·길이·해상도는 프롬프트가 아니라 <strong>플로우 설정 버튼</strong>으로 정합니다.</div>
<p class="sub">이론은 여기까지. 나머지는 손으로 익힙니다.</p>`);

add(3,'프롬프트에 써도 안 바뀝니다',null,`
<div class="warn">비율은 프롬프트 창 옆 <strong>비율 버튼</strong>에서 고릅니다.</div>
<p class="big">영상 비율 — 2종만</p>
${rows([['16:9 가로','유튜브, TV'],['9:16 세로','쇼츠, 릴스, 틱톡']])}
<div class="tip">🟢 오늘은 이 둘만 씁니다.</div>`);
add(3,'이미지 비율 5종 · 인물 넣을 때',null,`
${rows([['16:9','썸네일, 영상 첫 장면 — 인물 한쪽, 배경 보이게'],['9:16','쇼츠 첫 장면 — 상반신 이상, 머리 위 여백'],['1:1','인스타 피드 — 얼굴 중앙, 어깨까지'],['4:3','프레젠테이션 — 허리 위, 안정적'],['3:4','포스터, 세로 사진 — 전신 또는 상반신']])}`);
add(3,'확장 · 비율 비교','ext',`
<p>같은 인물을 <strong>1:1</strong>과 <strong>3:4</strong>로 한 장씩 더 만들어 어디가 잘리는지 비교해 보세요.</p>
<div class="tip">비율만 바꾸고 프롬프트는 그대로.</div>`);

add(4,'한 화면에서 이미지 → 영상까지',null,`
<p>플로우 안에서 이미지도 만들고, 그 이미지로 바로 영상도 만듭니다.</p>
<p class="big">이미지 모델 3종</p>

  document.getElementById('ht').textContent=STEPS[n][1];
  grid.innerHTML=blocks.map(c=>{
    const wide=WIDE.test(c.sub)||c.body.includes('class="prompt')||c.body.includes('class="frames')||c.body.includes('class="rows');
    const pill=c.badge==='common'?'<span class="pill common">공통</span>':c.badge==='ext'?'<span class="pill ext">확장</span>':'';
    return `<div class="card ${c.badge==='ext'?'ext':''} ${wide?'wide':''}"><h3>${c.sub}${pill}</h3>${c.body}</div>`;
  }).join('');
  // 첫 STEP 안내 문구 정리
  grid.querySelectorAll('.tip').forEach(t=>{ if(t.textContent.includes('상단 「확장」')) t.innerHTML='공통은 실습 A → B → C만 따라오면 세 가지 모두 완성됩니다.<br>확장 항목은 파란 카드. 상단 「확장 보기」로 숨길 수 있어요.'; });
  tabs.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('on',+b.dataset.n===n);b.classList.toggle('done',visited.has(+b.dataset.n)&&+b.dataset.n!==n);});
  const on=tabs.querySelector('.tab.on'); if(on&&on.scrollIntoView) on.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  const p=document.getElementById('fPrev'),q=document.getElementById('fNext');
  p.disabled=n===0; q.disabled=n===STEPS.length-1;
  p.textContent=n>0?`← ${n-1}. ${STEPS[n-1][1]}`:'← 처음';
  q.textContent=n<STEPS.length-1?`${n+1}. ${STEPS[n+1][1]} →`:'수고하셨습니다 🎉';
  document.getElementById('aPrev').disabled=n===0; document.getElementById('aNext').disabled=n===STEPS.length-1;
  syncTheme(); try{window.scrollTo({top:0});}catch(e){}
}
const go=d=>show(Math.min(Math.max(cur+d,0),STEPS.length-1));
document.getElementById('fPrev').onclick=()=>go(-1); document.getElementById('fNext').onclick=()=>go(1);
document.getElementById('aPrev').onclick=()=>go(-1); document.getElementById('aNext').onclick=()=>go(1);
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);});
document.getElementById('btnExt').onclick=function(){const off=html.dataset.ext!=='off';html.dataset.ext=off?'off':'';this.setAttribute('aria-pressed',!off);this.textContent=off?'확장 숨김':'확장 보기';}
document.getElementById('btnSize').onclick=function(){const on=html.dataset.size!=='big';html.dataset.size=on?'big':'';this.setAttribute('aria-pressed',on);}

function syncTheme(){document.querySelectorAll('.theme button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.theme===html.dataset.theme));}
document.addEventListener('click',e=>{
  const t=e.target.closest('.theme button'); if(t){html.dataset.theme=t.dataset.theme;syncTheme();return;}
  const cp=e.target.closest('.copy'); if(cp){
    let id=cp.dataset.copy;
    if(cp.dataset.copyTheme){const [a,b]=cp.dataset.copyTheme.split('|');id=html.dataset.theme==='jeju'?b:a;}
    const txt=document.getElementById(id).textContent;
    const done=()=>{cp.textContent='복사됨 ✓';cp.classList.add('done');setTimeout(()=>{cp.textContent='복사';cp.classList.remove('done')},1800)};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>fb(txt,done));}else fb(txt,done);
  }
});
function fb(txt,done){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}document.body.removeChild(ta);}
show(0);
</script>
</body>
