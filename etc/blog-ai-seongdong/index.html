<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>블로그&amp;AI(성동)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--band:#1f6b8a;--ink:#2b2b2b;--line:#d6dde2;--link:#1f6b8a;--soft:#f2f5f7}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans KR",sans-serif;color:var(--ink);background:#fff;font-size:18px;line-height:1.7;overflow-x:hidden}
section{padding:22px 16px}
section.band{background:var(--band);color:#fff}
section.band a{color:#fff}
section.band summary{color:#fff}
section.band summary::after{color:#fff}
section.soft{background:var(--soft)}
.row{max-width:1100px;margin:0 auto;display:flex;gap:24px;align-items:flex-start}
.col{min-width:0}
.txt h2{font-size:clamp(28px,4vw,44px);font-weight:900;margin:.2em 0;line-height:1.3}
.txt h3{font-size:clamp(22px,2.6vw,30px);font-weight:700;margin:.3em 0;line-height:1.4}
.txt h4{font-size:20px;font-weight:700;margin:.3em 0;line-height:1.5}
.txt p{margin:.25em 0}
.txt ul,.txt ol{margin:.3em 0;padding-left:1.4em}
.c{text-align:center}
section.band .txt{text-align:center}
a{color:var(--link);word-break:break-word}
figure{margin:8px 0}
figure img{display:block;width:100%;height:auto;border-radius:6px}
.btn{display:block;text-align:center;background:var(--band);color:#fff!important;text-decoration:none;padding:12px 10px;border-radius:6px;font-weight:500;margin:8px 0}
section.band .btn{background:#fff;color:var(--band)!important}
.emb{position:relative;width:100%;margin:8px 0;background:#f4f4f4;border-radius:6px;overflow:hidden}
.emb iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.open{display:inline-block;font-size:15px;margin:2px 0 10px}
.card{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px;text-decoration:none;color:var(--ink);margin:8px 0;background:#fff}
.card img{width:120px;height:80px;object-fit:cover;border-radius:4px}
.card b{display:block;color:var(--link)} .card small{color:#777}
.sp{height:24px}
details{border-bottom:1px solid #9aa5ad;margin:4px 0}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:16px 4px 12px;font-size:21px;color:var(--link);font-weight:500}
summary::-webkit-details-marker{display:none}
summary::after{content:"⌄";font-size:24px;color:#555;transition:transform .2s;margin-left:12px}
details[open] summary::after{transform:rotate(180deg)}
.dbody{padding:2px 4px 16px}
@media (max-width:720px){.row{flex-direction:column;gap:8px}.col{width:100%;flex:none!important}.col.empty{display:none}}
</style>
</head>
