<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>미드저니 6차시 PNG 요소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 상단 sticky(제목+STEP 탭) / 본문 카드 그리드 + 오른쪽 sticky 카드 메뉴 / 하단 sticky 이동 줄. position:fixed 없음, 문서 스크롤 */
:root{
  --bg:#FAFAF8; --surface:#FFFFFF; --line:#E3E5E8; --line-2:#D3D7DC;
  --fg:#1E2329; --fg-2:#4D5560; --fg-3:#7A828C;
  --accent:#2C5FA8; --accent-ink:#FFFFFF; --accent-soft:#EAF1FA;
  --set:#EEF4FB; --set-line:#C9DAF0;
  --warn:#FBEFF1; --warn-line:#EDCAD1; --warn-ink:#9B3448;
  --ext:#EEF7F1; --ext-line:#C6E3D0; --ext-ink:#2E7048;
  --code:#F3F4F6;
  --stk-gray:#D9D9D9; --stk-white:#FFFFFF; --stk-out:#4A4A4A;
  --f-display:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,"Malgun Gothic",monospace;
  --fs:20px;
  --hdr:120px;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%;display:block}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:1rem;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.35;margin:0}
p{margin:0}
button,select{font:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* 상단 */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1360px;margin:0 auto;padding-inline:16px}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand small{font-size:.66rem;color:var(--fg-3);letter-spacing:.06em}
.brand b{font-family:var(--f-display);font-size:.98rem;font-weight:700}
.fsz{display:flex;gap:4px}
.fsz button{border:1px solid var(--line-2);background:var(--surface);color:var(--fg-2);border-radius:8px;padding:2px 10px;font-size:.7rem;cursor:pointer}
.fsz button:hover{border-color:var(--accent);color:var(--accent)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}
.tab{flex:none;border:1px solid var(--line-2);background:var(--surface);color:var(--fg-2);border-radius:999px;padding:4px 14px;font-size:.74rem;cursor:pointer;white-space:nowrap}
.tab b{font-family:var(--f-display);margin-right:6px;color:var(--fg-3)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] b{color:var(--accent-ink)}
.prog{height:3px;background:var(--line)}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}

/* 본문 */
.wrap{max-width:1360px;margin:0 auto;padding-inline:16px;padding-block:24px 32px;display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:28px;align-items:start}
.step-head{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.eyebrow{font-size:.66rem;letter-spacing:.12em;color:var(--accent);font-weight:700}
.step-head h2{font-size:1.5rem}
.step-head p{color:var(--fg-2);max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0;scroll-margin-top:calc(var(--hdr) + 12px)}
.card.wide{grid-column:1/-1}
.card-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card-h .no{font-family:var(--f-mono);font-size:.7rem;color:var(--fg-3)}
.card-h h3{font-size:1.08rem;flex:1;min-width:0}
.tag{font-size:.62rem;font-weight:700;border-radius:6px;padding:1px 8px;letter-spacing:.04em}
.tag.do{background:var(--accent-soft);color:var(--accent)}
.tag.read{background:var(--code);color:var(--fg-2)}
.tag.adv{background:var(--ext);color:var(--ext-ink)}
.card ul,.card ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.muted{color:var(--fg-2)}
.small{font-size:.8rem}
code{font-family:var(--f-mono);font-size:.82em;background:var(--code);padding:1px 6px;border-radius:5px}

.box{border:1px solid;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.box .bt{font-weight:700;font-size:.74rem;letter-spacing:.04em}
.box.set{background:var(--set);border-color:var(--set-line)}
.box.set .bt{color:var(--accent)}
.box.warn{background:var(--warn);border-color:var(--warn-line)}
.box.warn .bt{color:var(--warn-ink)}
.box.ext{background:var(--ext);border-color:var(--ext-line)}
.box.ext .bt{color:var(--ext-ink)}
.box.easy{background:var(--surface);border-color:var(--line-2);border-style:dashed}
.box.easy .bt{color:var(--fg-2)}

.pr{border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--code)}
.pr-h{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.pr-h span{flex:1;font-size:.72rem;font-weight:700;color:var(--fg-2);min-width:0}
.pr-h em{font-style:normal;font-size:.62rem;color:var(--fg-3);border:1px solid var(--line-2);border-radius:5px;padding:0 6px}
.cp{border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:7px;padding:1px 12px;font-size:.68rem;cursor:pointer;font-weight:700}
.cp.ok{background:var(--accent);color:var(--accent-ink)}
.pr pre{margin:0;padding:12px 14px;font-family:var(--f-mono);font-size:.76rem;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:var(--fg)}
.pr pre .hx{color:var(--accent);font-weight:500}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.8rem;min-width:520px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--code);font-weight:700;color:var(--fg-2);font-size:.72rem}
tr:last-child td{border-bottom:none}
td[contenteditable]{background:var(--surface);min-width:70px}
td[contenteditable]:empty::before{content:"입력";color:var(--fg-3)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.72rem;border:1px solid var(--line-2);border-radius:999px;padding:1px 10px;background:var(--surface);color:var(--fg-2)}
.swatch{display:inline-block;width:.9em;height:.9em;border-radius:3px;border:1px solid var(--line-2);vertical-align:-.1em;margin-right:4px}
.checks{list-style:none;padding:0!important}
.checks li{display:flex;gap:10px;align-items:flex-start}
.checks input{width:1.1em;height:1.1em;margin-top:.35em;accent-color:var(--accent);flex:none}
.fig{overflow-x:auto}
.fig svg{display:block;width:100%;height:auto;min-width:560px}
.fig.sm svg{min-width:0;max-width:520px;margin-inline:auto}
.svg-t{fill:var(--fg);font-family:var(--f-body)}
.svg-s{fill:var(--fg-2);font-family:var(--f-body)}
.svg-box{fill:var(--surface);stroke:var(--line-2)}
.svg-acc{fill:var(--accent-soft);stroke:var(--accent)}
.svg-ln{stroke:var(--fg-3);fill:none}
.svg-al{stroke:var(--accent);fill:none}
.svg-af{fill:var(--accent)}

.ex{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.ex-h{font-size:.7rem;font-weight:700;color:var(--fg-2);letter-spacing:.04em}
.ex-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.ex-l a{display:flex;flex-direction:column;gap:2px;text-decoration:none;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--fg);min-width:0}
.ex-l a:hover{border-color:var(--accent)}
.ex-l a b{font-size:.76rem;color:var(--accent)}
.ex-l a b::after{content:" ↗"}
.ex-l small{font-size:.62rem;color:var(--fg-3);line-height:1.4}
.ex-n{font-size:.62rem;color:var(--fg-3)}

.art{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.art svg{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:10px;background:#FFFFFF}
.art figcaption{font-size:.64rem;color:var(--fg-2);text-align:center;line-height:1.45}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.gal.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.art-cr{font-size:.6rem;color:var(--fg-3);letter-spacing:.03em}
.motion{max-width:420px;width:100%;margin-inline:auto}
.motion.w{max-width:560px}
.a-dash{stroke-dasharray:7 6;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-26}}
.a-wipe{transform-box:fill-box;transform-origin:right center;animation:wipe 6s ease-in-out infinite}
@keyframes wipe{0%,18%{transform:scaleX(1)}55%,88%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.a-scan{animation:scan 6s ease-in-out infinite}
@keyframes scan{0%,18%{transform:translateX(0);opacity:1}55%{transform:translateX(160px);opacity:1}57%,96%{transform:translateX(160px);opacity:0}100%{transform:translateX(0);opacity:0}}
.a-ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-in-out infinite}
@keyframes ping{0%,100%{opacity:.35}50%{opacity:1}}
.a-pop{transform-box:fill-box;transform-origin:center;animation:pop 2.4s ease-in-out infinite}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.a-dark{animation:dark 5s ease-in-out infinite}
@keyframes dark{0%,22%{opacity:0}38%,84%{opacity:1}100%{opacity:0}}
.a-ping2{animation:ping2 5s ease-in-out infinite}
@keyframes ping2{0%,40%{opacity:0}50%,84%{opacity:1}100%{opacity:0}}
.a-fade{animation:fade 5s ease-in-out infinite}
@keyframes fade{0%,25%{opacity:1}45%,85%{opacity:0}100%{opacity:1}}
.a-s1{animation:s1 9s ease-in-out infinite}
@keyframes s1{0%,28%{opacity:1}36%,94%{opacity:0}100%{opacity:1}}
.a-s2{opacity:0;animation:s2 9s ease-in-out infinite}
@keyframes s2{0%,28%{opacity:0}36%,94%{opacity:1}100%{opacity:0}}
.a-s3{animation:s3 9s ease-in-out infinite}
@keyframes s3{0%,58%{opacity:1}68%,94%{opacity:0}100%{opacity:1}}
.k1{animation:k1 9s infinite}.k2{opacity:0;animation:k2 9s infinite}.k3{opacity:0;animation:k3 9s infinite}
@keyframes k1{0%,30%{opacity:1}34%,100%{opacity:0}}
@keyframes k2{0%,32%{opacity:0}36%,60%{opacity:1}64%,100%{opacity:0}}
@keyframes k3{0%,62%{opacity:0}66%,94%{opacity:1}98%,100%{opacity:0}}
.k1-t{animation:k1t 9s infinite}.k2-t{animation:k2t 9s infinite}.k3-t{animation:k3t 9s infinite}
@keyframes k1t{0%,30%{fill:#FFFFFF}34%,100%{fill:#1E2329}}
@keyframes k2t{0%,32%{fill:#1E2329}36%,60%{fill:#FFFFFF}64%,100%{fill:#1E2329}}
@keyframes k3t{0%,62%{fill:#1E2329}66%,94%{fill:#FFFFFF}98%,100%{fill:#1E2329}}
@media (prefers-reduced-motion:reduce){.art *,.fig *{animation:none!important}.a-s2,.k2,.k3{opacity:0}}
@media (max-width:520px){.gal.two{grid-template-columns:minmax(0,1fr)}}
.pl{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column}
.pl-t{font-family:var(--f-display);font-weight:700;font-size:.8rem;padding:10px 14px;border-bottom:1px solid var(--line)}
.pl-stage{background:var(--bg);padding:14px;display:flex;flex-direction:column;gap:8px;align-items:center}
.pl-stage svg{width:100%;max-width:520px;height:auto;display:block;border-radius:8px;background:#FFFFFF}
.pl-cap{min-height:2.8em;font-size:.78rem;font-weight:700;color:var(--accent);text-align:center;line-height:1.4}
.pl-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.pl-b{border:1px solid var(--line-2);background:var(--surface);color:var(--fg);border-radius:8px;padding:2px 10px;font-size:.68rem;cursor:pointer;white-space:nowrap}
.pl-b.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pl-r{flex:1;min-width:120px;accent-color:var(--accent)}
/* 오른쪽 카드 메뉴 */
.side{position:sticky;top:calc(var(--hdr) + 16px);border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - var(--hdr) - 40px);overflow:auto}
.side .st{font-size:.66rem;letter-spacing:.1em;color:var(--fg-3);font-weight:700;margin-bottom:6px}
.side a{display:flex;gap:8px;text-decoration:none;color:var(--fg-2);font-size:.72rem;padding:5px 8px;border-radius:7px;line-height:1.45}
.side a span{font-family:var(--f-mono);color:var(--fg-3);flex:none}
.side a:hover{background:var(--code);color:var(--fg)}
.side a.on{background:var(--accent-soft);color:var(--accent);font-weight:700}

/* 하단 */
.foot{position:sticky;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line)}
.foot-in{max-width:1360px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;gap:8px;align-items:center}
.nav{border:1px solid var(--line-2);background:var(--surface);color:var(--fg);border-radius:9px;padding:4px 16px;font-size:.76rem;cursor:pointer;white-space:nowrap}
.nav.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nav:disabled{opacity:.4;cursor:default}
.foot select{flex:1;min-width:0;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);border-radius:9px;padding:4px 8px;font-size:.72rem}

@media (max-width:1000px){.wrap{grid-template-columns:minmax(0,1fr)}.side{display:none}}
@media (max-width:760px){:root{--fs:18px}.grid{grid-template-columns:minmax(0,1fr)}.card{padding:16px}.foot-in{flex-wrap:wrap}.foot select{flex-basis:40%}}
@media (max-height:820px){.brand small{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<header class="top" id="top">
  <div class="top-in">
    <div class="bar">
      <div class="brand"><small>AI 이미지 수익화 · 미드저니 · 6차시</small><b>사진 한 장으로 PNG 두 장 — 실사 요소와 스티커 요소</b></div>
      <div class="fsz" aria-label="글자 크기"><button type="button" data-fs="-1" aria-label="글자 작게">가−</button><button type="button" data-fs="0" aria-label="기본 크기">가</button><button type="button" data-fs="1" aria-label="글자 크게">가+</button></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="STEP"></nav>
  </div>
  <div class="prog"><i id="prog"></i></div>
</header>

<div class="wrap">
  <main id="main"></main>
  <aside class="side" id="side" aria-label="카드 목록"></aside>
</div>

<footer class="foot">
  <div class="foot-in">
    <button type="button" class="nav" id="prev">◀ 이전</button>
    <select id="selStep" aria-label="STEP 이동"></select>
    <select id="selCard" aria-label="카드 이동"></select>
    <button type="button" class="nav pri" id="next">다음 ▶</button>
  </div>
</footer>

      h: "<div class=\"tbl\"><table><tr><th>\uC774\uB7F0 \uD654\uBA74/\uC99D\uC0C1</th><th>\uC6D0\uC778</th><th>\uC870\uCE58</th></tr>\n <tr><td>\uCCA8\uBD80\uD55C \uC0AC\uB78C \uC5BC\uAD74\uC774 \uB9CE\uC774 \uB2EC\uB77C\uC9D0</td><td>\uD654\uD48D\uC774 \uBC14\uB00C\uBA74 \uC5BC\uAD74 \uD45C\uD604\uB3C4 \uBC14\uB01C</td><td>\uC815\uC0C1 \uBC94\uC704. \uC637 \uC0C9\xB7\uC18C\uD488\xB7\uD3EC\uC988\uB97C \uCCAB \uC904\uC5D0 \uB354 \uAD6C\uCCB4\uC801\uC73C\uB85C</td></tr>\n <tr><td>\uC6D0\uBCF8\uC744 \uBB34\uC2DC\uD558\uACE0 \uC0C8 \uADF8\uB9BC\uC744 \uADF8\uB9BC</td><td>\uCCA8\uBD80\uAC00 Attach\uB85C \uC9C0\uC815\uB418\uC9C0 \uC54A\uC74C</td><td>\uC774\uBBF8\uC9C0\uAC00 Attach to Prompt \uCE78\uC5D0 \uB4E4\uC5B4\uAC14\uB294\uC9C0 \uD655\uC778</td></tr>\n <tr><td>\uD22C\uBA85 PNG\uB97C \uCCA8\uBD80\uD588\uB354\uB2C8 \uBC30\uACBD\uC774 \uAC80\uC815</td><td>\uD22C\uBA85 \uBD80\uBD84\uC744 \uAC80\uC815\uC73C\uB85C \uD574\uC11D</td><td>\uD770 \uBC30\uACBD \uC6D0\uBCF8 JPG\uB97C \uCCA8\uBD80</td></tr>\n <tr><td>\uBC30\uACBD\uC774 \uD68C\uC0C9 \uADF8\uB77C\uB370\uC774\uC158</td><td>\uC0AC\uC9C4 \uB290\uB08C \uC5F0\uCD9C</td><td><code>seamless flat</code> + <code>--no gradient</code>. \uC57D\uD55C \uADF8\uB77C\uB370\uC774\uC158\uC740 \uBC30\uACBD \uC81C\uAC70\uAC00 \uCC98\uB9AC\uD558\uB2C8 \uB118\uC5B4\uAC00\uB3C4 \uB428</td></tr>\n <tr><td>\uC2A4\uD2F0\uCEE4\uAC00 2~4\uC7A5 \uBD99\uC5B4 \uB098\uC634</td><td>\"\uC2A4\uD2F0\uCEE4 \uC2DC\uD2B8\"\uB85C \uD574\uC11D</td><td><code>one single sticker, single subject only</code></td></tr>\n <tr><td>\uAE00\uC790\xB7\uC11C\uBA85\uC774 \uC0DD\uAE40</td><td>\uC2A4\uD2F0\uCEE4\xB7\uD3EC\uC2A4\uD130 \uD559\uC2B5 \uC601\uD5A5</td><td><code>--no text, letters, watermark</code></td></tr>\n <tr><td>\uB108\uBB34 \uC5B4\uB461\uACE0 \uC601\uD654 \uAC19\uC74C</td><td>\uAE30\uBCF8 \uBBF8\uAC10\uC774 \uAC15\uD568</td><td>\uC2E4\uC0AC\uB294 <code>--raw --s 50</code>, <code>bright high-key lighting</code></td></tr></table></div>"
    }]
  }];
  var tabsEl = document.getElementById('tabs'),
    mainEl = document.getElementById('main'),
    sideEl = document.getElementById('side');
  var selStep = document.getElementById('selStep'),
    selCard = document.getElementById('selCard');
  var cur = 0;
  var tagTxt = {
    do: '다 같이',
    read: '읽기',
    adv: '한 걸음 더'
  };
  STEPS.forEach(function (s, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'tab';
    b.setAttribute('role', 'tab');
    b.id = 'tab-' + s.id;
    b.innerHTML = "<b>STEP ".concat(i, "</b>").concat(s.tab);
    b.onclick = function () {
      return go(i, true);
    };
    tabsEl.appendChild(b);
    var o = document.createElement('option');
    o.value = i;
    o.textContent = "STEP ".concat(i, " \xB7 ").concat(s.tab);
    selStep.appendChild(o);
    var sec = document.createElement('section');
    sec.id = s.id;
    sec.hidden = true;
    sec.setAttribute('role', 'tabpanel');
    sec.innerHTML = "<div class=\"step-head\"><span class=\"eyebrow\">STEP ".concat(i, " / ").concat(STEPS.length - 1, "</span><h2>").concat(s.title, "</h2><p>").concat(s.lead, "</p></div>\n  <div class=\"grid\">").concat(s.cards.map(function (c, j) {
      return "<article class=\"card".concat(c.w ? ' wide' : '', "\" id=\"").concat(s.id, "-c").concat(j + 1, "\"><div class=\"card-h\"><span class=\"no\">").concat(i, "-").concat(j + 1, "</span><h3>").concat(c.t, "</h3><span class=\"tag ").concat(c.k, "\">").concat(tagTxt[c.k], "</span></div>").concat(c.h, "</article>");
    }).join(''), "</div>");
    mainEl.appendChild(sec);
  });
  function setHdr() {
    document.documentElement.style.setProperty('--hdr', document.getElementById('top').offsetHeight + 'px');
  }
  function go(i, scroll) {
    cur = Math.max(0, Math.min(STEPS.length - 1, i));
    STEPS.forEach(function (s, k) {
      document.getElementById(s.id).hidden = k !== cur;
      document.getElementById('tab-' + s.id).setAttribute('aria-selected', k === cur);
    });
    var s = STEPS[cur];
    sideEl.innerHTML = "<div class=\"st\">STEP ".concat(cur, " \uCE74\uB4DC</div>") + s.cards.map(function (c, j) {
      return "<a href=\"#".concat(s.id, "-c").concat(j + 1, "\" data-c=\"").concat(s.id, "-c").concat(j + 1, "\"><span>").concat(cur, "-").concat(j + 1, "</span>").concat(c.t, "</a>");
    }).join('');
    selCard.innerHTML = s.cards.map(function (c, j) {
      return "<option value=\"".concat(s.id, "-c").concat(j + 1, "\">").concat(cur, "-").concat(j + 1, " ").concat(c.t, "</option>");
    }).join('');
    selStep.value = cur;
    document.getElementById('prog').style.width = cur / (STEPS.length - 1) * 100 + '%';
    document.getElementById('prev').disabled = cur === 0;
    document.getElementById('next').disabled = cur === STEPS.length - 1;
    {
      var tb = document.getElementById('tab-' + s.id);
      var l = tb.offsetLeft - tabsEl.offsetLeft;
      if (l < tabsEl.scrollLeft || l + tb.offsetWidth > tabsEl.scrollLeft + tabsEl.clientWidth) tabsEl.scrollLeft = l - 16;
    }
    if (scroll) window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });
    observe();
  }
  function jump(id) {
    var el = document.getElementById(id);
    if (el) {
      setHdr();
      var y = el.getBoundingClientRect().top + window.pageYOffset - document.getElementById('top').offsetHeight - 12;
      window.scrollTo({
        top: y,
        behavior: 'smooth'
      });
    }
  }
  sideEl.addEventListener('click', function (e) {
    var a = e.target.closest('a');
    if (a) {
      e.preventDefault();
      jump(a.dataset.c);
    }
  });
  selCard.onchange = function () {
    return jump(selCard.value);
  };
  selStep.onchange = function () {
    return go(+selStep.value, true);
  };
  document.getElementById('prev').onclick = function () {
    return go(cur - 1, true);
  };
  document.getElementById('next').onclick = function () {
    return go(cur + 1, true);
  };
  var io;
  function observe() {
    if (io) io.disconnect();
    if (!('IntersectionObserver' in window)) return;
    io = new IntersectionObserver(function (es) {
      es.forEach(function (en) {
        if (en.isIntersecting) {
          var id = en.target.id;
          sideEl.querySelectorAll('a').forEach(function (a) {
            return a.classList.toggle('on', a.dataset.c === id);
          });
          if (selCard.value !== id) selCard.value = id;
        }
      });
    }, {
      rootMargin: '-30% 0px -60% 0px'
    });
    document.querySelectorAll('#' + STEPS[cur].id + ' .card').forEach(function (c) {
      return io.observe(c);
    });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('.cp');
    if (!b) return;
    var pre = document.getElementById(b.dataset.p);
    var txt = pre.textContent;
    var done = function done() {
      b.textContent = '복사됨';
      b.classList.add('ok');
      setTimeout(function () {
        b.textContent = '복사';
        b.classList.remove('ok');
      }, 1600);
    };
    var fallback = function fallback() {
      var r = document.createRange();
      r.selectNodeContents(pre);
      var s = getSelection();
      s.removeAllRanges();
      s.addRange(r);
      try {
        document.execCommand('copy');
        done();
      } catch (_) {
        b.textContent = 'Ctrl+C';
      }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, fallback);
    } else fallback();
  });
  var fs = 20;
  function applyFs() {
    document.documentElement.style.setProperty('--fs', fs + 'px');
    setHdr();
  }
  document.querySelectorAll('.fsz button').forEach(function (b) {
    return b.onclick = function () {
      var d = +b.dataset.fs;
      fs = d === 0 ? 20 : Math.max(16, Math.min(28, fs + d * 2));
      applyFs();
    };
  });
  if (fs !== 20) applyFs();
  var start = 0;
  initPlayers();
  go(start, false);
  setHdr();
  addEventListener('resize', setHdr);
})();
</script>
</body></html>
