<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>온라인 교재 · PPT보다 쉽게 만드는 미리캔버스 활용 맞춤형 교안 제작</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--fs:21px;--bg:#fbfbf8;--line:#e3e5e8;--ink:#1f2933;--sub:#5b6673;--point:#1d6fb8;--point-soft:#e9f2fb;--fix:#6a4fa0;--fix-soft:#f3effa;--ok:#2f7a4b;--ok-soft:#ecf6ef;--book:#f4f6f8}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.65;word-break:keep-all}
button,input{font-family:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding:26px 20px 14px;border-bottom:1px solid var(--line)}
.hero small{color:var(--point);font-weight:700}
.hero h1{margin:4px 0 4px;font-size:1.45rem;line-height:1.3}
.hero p{margin:0;color:var(--sub);font-size:.9rem}

.topbar{position:sticky;top:0;z-index:20;background:rgba(251,251,248,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(4px)}
.topbar .wrap{display:flex;align-items:center;gap:10px;padding-top:9px;padding-bottom:9px}
.tabs{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:thin}
.tab{flex:none;border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;padding:.28rem .7rem;font-size:.76rem;cursor:pointer;white-space:nowrap}
.tab b{color:var(--point);margin-right:.3rem}
.tab.on{background:var(--point);border-color:var(--point);color:#fff}.tab.on b{color:#fff}
.tools{display:flex;gap:6px;align-items:center;flex:none}
.tools button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:.25rem .6rem;font-size:.78rem;cursor:pointer;color:var(--ink)}
.tools .ed.on{background:var(--point-soft);border-color:var(--point);color:var(--point);font-weight:700}

.layout{display:grid;grid-template-columns:1fr 250px;gap:24px;padding-top:20px;padding-bottom:26px}
#main{min-width:0}
.side{position:sticky;top:78px;align-self:start;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;max-height:calc(100vh - 160px);overflow:auto}
.side h4{margin:0 0 6px;font-size:.78rem;color:var(--sub);font-weight:600}
.side .sh{display:block;margin:.6rem 0 .15rem;padding:.2rem .5rem;font-size:.76rem;font-weight:800;color:var(--point);text-decoration:none;border-radius:8px}
.side .sh:first-of-type{margin-top:0}
.side a.it{display:block;padding:.28rem .5rem;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.76rem;line-height:1.35}
.side a.it:hover,.side a.it.on,.side .sh:hover{background:var(--point-soft);color:var(--point)}

.step{display:none}.step.on{display:block}
.chead{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 22px;margin-bottom:18px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.chead .cn{font-size:2.4rem;font-weight:900;color:var(--point);line-height:1}
.chead h2{margin:0;font-size:1.3rem;line-height:1.3}
.chead p{margin:.2rem 0 0;color:var(--sub);font-size:.9rem}
.chead .cp{text-align:right;font-size:1.25rem;font-weight:800;color:var(--point);white-space:nowrap}
.chead .cp small{display:block;font-size:.7rem;color:var(--sub);font-weight:600}

.sec{margin:0 0 26px}
.sech{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin:0 0 12px;padding:0 0 8px;border-bottom:2px solid var(--point);font-size:1.12rem;scroll-margin-top:80px}
.sech .sn{color:var(--point);font-weight:900}
.sech .sp{margin-left:auto;font-size:.82rem;color:var(--point);font-weight:700}

.item{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:14px;scroll-margin-top:80px;overflow:hidden}
.item>header{display:flex;align-items:center;gap:.7rem;padding:14px 20px 0}
.item h3{margin:0;font-size:1.08rem;line-height:1.35;flex:1;display:flex;gap:.6rem;align-items:center}
.num{flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--point);color:#fff;display:grid;place-items:center;font-size:.8rem;font-weight:700}
.item.isnew .num{background:var(--ok)}
.pgc{flex:none;background:var(--point-soft);color:var(--point);border-radius:999px;padding:.15rem .75rem;font-weight:800;font-size:.9rem;white-space:nowrap}
.pgc.nw{background:var(--ok-soft);color:var(--ok)}
.body{padding:8px 22px 4px 62px;font-size:.98rem}
.body p{margin:.35rem 0 .55rem}
.body ul,.body ol{margin:.3rem 0 .6rem;padding-left:1.25rem}
.body li{margin:.28rem 0}
.body b{color:#0f4c86}
.term{color:var(--sub);font-size:.84em}
.pgi{display:inline-block;margin-left:.4rem;background:var(--book);border:1px solid var(--line);color:var(--sub);border-radius:999px;padding:0 .5rem;font-size:.72rem;font-weight:600;vertical-align:1px}
.tbl{overflow-x:auto;margin:.4rem 0 .7rem}
table{border-collapse:collapse;width:100%;font-size:.9rem;background:#fff}
th,td{border:1px solid var(--line);padding:.45rem .6rem;text-align:left;vertical-align:top}
th{background:var(--book);font-weight:700;color:var(--sub);font-size:.84rem}
td b[data-a]{white-space:nowrap;color:var(--point)}
.flow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:.4rem 0 .7rem}
.flow span{background:var(--point-soft);color:var(--point);border-radius:999px;padding:.22rem .8rem;font-weight:700;font-size:.88rem}
.flow i{color:var(--sub);font-style:normal}
.hl{background:var(--point-soft);border-radius:10px;padding:.55rem .8rem}
.faq p{border-bottom:1px dashed var(--line);padding-bottom:.5rem}
.boxes{display:grid;gap:8px;padding:6px 22px 16px 62px}
.bx{border-radius:12px;padding:.6rem .85rem;font-size:.9rem;line-height:1.55;display:flex;gap:.6rem}
.bx .ic{flex:none;font-size:1rem}
.bx .lb{display:block;font-weight:800;font-size:.78rem;margin-bottom:.1rem}
.bx.now{background:var(--point-soft)}.bx.now .lb{color:var(--point)}
.bx.fix{background:var(--fix-soft)}.bx.fix .lb{color:var(--fix)}
.bx.did{background:var(--ok-soft)}.bx.did .lb{color:var(--ok)}
.bx.when{background:#fff;border:1px dashed #c9d1da}.bx.when .lb{color:var(--sub)}
.bx b{color:inherit}
.bx.now b{color:#0f4c86}.bx.fix b{color:var(--fix)}.bx.did b{color:var(--ok)}

.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:.6rem 0 .8rem;align-items:start}
.shots figure{margin:0;background:var(--book);border:1px solid var(--line);border-radius:12px;padding:8px;cursor:zoom-in}
.shots figure.w,.shots figure.zoom{grid-column:1/-1}
.shots figure.zoom{cursor:zoom-out}
.shots img{display:block;max-width:100%;height:auto;margin:0 auto;border-radius:8px;background:#fff}
.shots figure.w img,.shots figure.zoom img{width:100%}
.shots figure:not(.w):not(.zoom) img{max-height:420px;object-fit:contain}
.shots figcaption{font-size:.74rem;color:var(--sub);margin-top:6px;line-height:1.4}
/* 처음 화면 */
.scene-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px}
.scene-box h3{margin:0 0 2px;font-size:1.05rem}.scene-box p{margin:0 0 8px;color:var(--sub);font-size:.85rem}
#scene{position:relative;width:100%;height:330px;border-radius:12px;overflow:hidden;background:linear-gradient(#f7fafd,#eef3f8)}
#scene canvas{display:block}
.lbl{position:absolute;transform:translate(-50%,0);background:#fff;border:1px solid var(--line);border-radius:999px;padding:.1rem .6rem;font-size:.72rem;white-space:nowrap;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.lbl.on{border-color:var(--point);color:var(--point);font-weight:700}
.ctrl{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ctrl button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:.3rem .8rem;font-size:.8rem;cursor:pointer}
.ctrl button.primary{background:var(--point);color:#fff;border-color:var(--point)}
.caption{margin-top:6px;font-size:.88rem;min-height:1.5em}.caption b{color:var(--point)}
.nogl{display:none;padding:20px;color:var(--sub)}
.intro{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px}
.box h3{margin:0 0 6px;font-size:1.05rem}
.box ol{margin:0;padding-left:1.2rem;font-size:.93rem}
.edition{display:flex;gap:8px;margin-top:8px}
.edition button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:.6rem .8rem;text-align:left;cursor:pointer;font-size:.88rem;line-height:1.4}
.edition button.on{border-color:var(--point);background:var(--point-soft)}
.edition button b{display:block;color:var(--point)}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.legend .bx{display:block;font-size:.84rem}
.toc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px}
.toc h3{margin:0 0 10px;font-size:1.05rem}
.tocg{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px}
.tc{border-top:1px solid var(--line);padding-top:8px}
.tc .t1{display:flex;gap:.5rem;align-items:baseline;font-weight:800;cursor:pointer}
.tc .t1 .n{color:var(--point);font-size:1.15rem}
.tc .t1 .pp{margin-left:auto;color:var(--point);font-size:.8rem;white-space:nowrap}
.tc .t2{font-size:.82rem;color:var(--sub);font-weight:700;margin:.35rem 0 .1rem}
.tc a{display:flex;gap:.4rem;font-size:.8rem;color:var(--ink);text-decoration:none;padding:.1rem .3rem;border-radius:6px;line-height:1.4}
.tc a:hover{background:var(--point-soft);color:var(--point)}
.tc a span{margin-left:auto;color:var(--sub);white-space:nowrap}

/* 찾아보기 */
.find{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px}
.find input{width:100%;border:1px solid var(--line);border-radius:12px;padding:.6rem .9rem;font-size:1rem;margin:.2rem 0 12px;outline:none}
.find input:focus{border-color:var(--point)}
.fl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 14px}
.fg{grid-column:1/-1;font-weight:900;color:var(--point);border-bottom:1px solid var(--line);margin-top:8px;padding-bottom:2px}
.fi{display:flex;gap:.5rem;align-items:baseline;padding:.3rem .5rem;border-radius:8px;cursor:pointer;font-size:.88rem}
.fi:hover{background:var(--point-soft)}
.fi .fp{margin-left:auto;color:var(--point);font-weight:700;white-space:nowrap;font-size:.82rem}
.fi .fc{color:var(--sub);font-size:.72rem;white-space:nowrap}

.bottom{position:sticky;bottom:0;z-index:15;background:rgba(251,251,248,.97);border-top:1px solid var(--line)}
.bottom .wrap{display:flex;justify-content:space-between;align-items:center;padding-top:9px;padding-bottom:9px}
.bottom button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:.45rem 1rem;font-size:.85rem;cursor:pointer}
.bottom button.primary{background:var(--point);border-color:var(--point);color:#fff}
.bottom button:disabled{opacity:.4;cursor:default}
.bottom .where{color:var(--sub);font-size:.8rem}
footer{color:var(--sub);font-size:.75rem;text-align:center;padding:14px 0 24px}
.flash{animation:fl 1.6s ease}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--point)}100%{box-shadow:0 0 0 0 transparent}}

@media (max-width:980px){.layout{grid-template-columns:1fr}.side{display:none}.legend{grid-template-columns:1fr 1fr}.fl{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.topbar .wrap{flex-wrap:wrap}.tabs{flex-basis:100%}.intro,.tocg,.legend,.fl{grid-template-columns:1fr}#scene{height:280px}.bottom .where{display:none}.body,.boxes{padding-left:20px}.chead{grid-template-columns:1fr}.chead .cp{text-align:left}.item>header{flex-wrap:wrap;padding:14px 16px 0}.item h3{flex-basis:100%}.chead{padding:16px}.sech .sp{margin-left:0}}
</style>
</head>
<body>
<header class="wrap hero">
  <small>온라인 교재</small>
  <h1>PPT보다 쉽게 만드는 미리캔버스 활용 맞춤형 교안 제작</h1>
  <p>종이 교재의 목차 그대로, 쪽마다 무엇이 있는지 자세히 풀었어요. 화면이 바뀐 곳은 2026년 10월 실제 화면을 넣어 지금 기준으로 다시 설명했어요.</p>
</header>

<nav class="topbar"><div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="tools">
    <button class="ed on" data-ed="0" title="로그인 설명이 13쪽에서 시작">13쪽판</button>
    <button class="ed" data-ed="4" title="로그인 설명이 17쪽에서 시작">17쪽판</button>
    <button id="fsDown">가−</button><button id="fsUp">가+</button>
  </div>
</div></nav>

<div class="wrap layout"><main id="main"></main><aside class="side" id="side"></aside></div>

<div class="bottom"><div class="wrap">
  <button id="prev">← 이전</button><span class="where" id="where"></span><button id="next" class="primary">다음 →</button>
</div></div>
<footer>김에듀 · 김충효 강사 · kimedu.kr</footer>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
const CH=[
{no:'01',name:'본 수업의 이해',short:'수업 이해',p:[1,12],goal:'왜 PPT 대신 미리캔버스로 교안을 만드는지, 훈련생·훈련교사·기관 입장에서 무엇이 좋아지는지 알아봐요.',
 secs:[{no:'01-1',t:'기존 교안 작성법과 비교하여 장점 이해하기',p:[1,12],items:[
  {id:'a1',t:'글만 가득한 교안의 한계와 미리캔버스의 장점',p:[2,3],
   d:`<p>교재는 먼저 <b>지금까지 교안의 아쉬운 점</b>부터 짚어요.</p>
   <ul><li><b>텍스트 중심</b> · 글만 나열된 교안은 훈련생을 지루하게 하고 집중력을 떨어뜨려요.</li>
   <li><b>급하게 만든 디자인</b> · 시간에 쫓겨 만든 PPT는 내용과 디자인이 어울리지 않아 전달력이 약해져요.</li>
   <li><b>낮은 흥미</b> · 눈길을 끌지 못하면 이해도도 함께 떨어져요.</li></ul>
   <p>미리캔버스는 이 부분을 이렇게 채워 줘요.</p>
   <ul><li><b>완성된 템플릿</b><span class="term">(미리 디자인된 양식)</span>이 주제별로 아주 많아요.</li>
   <li>수업 내용에 맞는 <b>그림 · 도식</b>을 쉽게 만들 수 있어요.</li>
   <li>그 결과 훈련생의 <b>몰입도와 이해도</b>가 함께 올라가요.</li></ul>`,
   when:'첫 시간에 "왜 이 도구를 배우지?" 싶을 때'},
  {id:'a2',t:'직종별로 이렇게 써요 · 엑셀, 요양보호사, 미용',p:[4,8],
   d:`<p>교재는 직업훈련 현장의 세 가지 예를 보여 줘요. 내 직종에 대입해 보면서 읽으면 좋아요.</p>
   <div class="tbl"><table><tr><th>과정</th><th>글로만 하면</th><th>미리캔버스로 하면</th><th>쪽</th></tr>
   <tr><td><b>사무자동화(엑셀)</b></td><td>복잡한 수식을 글로 설명하기 어려워요</td><td>수식이 흘러가는 순서를 <b>도식</b>으로 그려 셀 사이 관계가 보여요</td><td><b data-a="4" data-b="4"></b></td></tr>
   <tr><td><b>요양보호사</b></td><td>환자 이동 순서를 말로만 설명</td><td>단계마다 <b>사진 + 안전 포인트</b>를 눈에 띄게 표시</td><td><b data-a="4" data-b="4"></b></td></tr>
   <tr><td><b>미용 케어</b></td><td>피부 관리 기법이 머릿속에 안 그려져요</td><td>단계별 이미지와 <b>주의사항 도식</b>으로 정리</td><td><b data-a="5" data-b="5"></b></td></tr>
   <tr><td><b>요양보호사 교안 만들기</b></td><td>글 정렬 · 그림 배치에 시간이 많이 들어요</td><td>준비된 템플릿에 <b>글과 그림만 넣으면</b> 완성</td><td><b data-a="8" data-b="8"></b></td></tr></table></div>`,
   when:'내 과목에 어떻게 써먹을지 아이디어가 필요할 때'},
  {id:'a3',t:'그림이 함께 있으면 왜 더 잘 배울까',p:[5,6],
   d:`<p>교재는 두 가지 연구를 근거로 들어요.</p>
   <ol><li><b>메이어(Mayer)의 멀티미디어 학습</b> · 글만 줄 때보다 <b>글과 그림을 함께</b> 줄 때 정보를 더 잘 처리하고, 오래 기억하고, 응용도 잘해요.</li>
   <li><b>에빙하우스의 망각 곡선</b><span class="term">(시간이 지나며 잊는 정도를 그린 그래프)</span> · 배운 직후에 가장 빨리 잊고, 시간이 지날수록 잊는 속도가 느려져요. 그림으로 다시 보여 주면 기억을 붙잡는 데 도움이 돼요.</li></ol>`,
   fix:`교재의 "시각 자료가 집중력을 <b>30% 이상</b> 높인다"는 숫자는 출처를 확인하기 어려워요. <b>"글 + 그림을 함께 쓰면 이해와 응용이 크게 좋아진다"</b>로 기억하면 충분해요. 망각 곡선 그림도 모양이 원래와 조금 달라요. 처음에 <b>뚝 떨어졌다가 완만해지는</b> 곡선이 맞아요.`,
   when:'훈련생에게 "왜 그림을 넣었는지" 설명하고 싶을 때'},
  {id:'a4',t:'링크로 나누고, 쉽게 만들고, 어디서나 열어요',p:[7,9],
   d:`<ul><li><b>공유</b> · 교안을 <b>웹 링크</b> 하나로 나눠 줘요. 훈련생은 시간과 장소에 상관없이 열어 봐요. 고친 내용은 링크에 <b>바로 반영</b>돼요.<span class="pgi" data-a="7" data-b="7"></span></li>
   <li><b>쉬운 화면</b> · 끌어다 놓기<span class="term">(드래그 앤 드롭)</span>로 글과 그림을 배치해요. 컴퓨터가 익숙하지 않아도 금방 적응해요.<span class="pgi" data-a="9" data-b="9"></span></li>
   <li><b>클라우드</b><span class="term">(인터넷 저장 공간)</span> · 만든 자료가 인터넷에 저장돼서 잃어버릴 걱정이 적고, 어느 컴퓨터에서든 이어서 작업해요.<span class="pgi" data-a="9" data-b="9"></span></li></ul>`,
   now:`지금은 <b>실시간 자동 저장</b>이 기본이에요. 워크스페이스 멤버를 초대하면 <b>최대 50명이 동시에</b> 같은 디자인을 고칠 수 있어요.`},
  {id:'a5',t:'누구에게 무엇이 좋아질까 · 정리',p:[7,12],
   d:`<div class="tbl"><table><tr><th>누구</th><th>좋아지는 점</th></tr>
   <tr><td><b>훈련교사</b></td><td>교안 만드는 시간이 줄어요 · 디자인 부담이 줄어 <b>내용에 집중</b> · 남는 시간을 수업 준비와 훈련생 지도에</td></tr>
   <tr><td><b>훈련생</b></td><td>보기 좋은 자료로 <b>흥미</b>가 생기고 이해가 쉬워요 · 학습 경험이 좋아져요</td></tr>
   <tr><td><b>기관 · 관리</b></td><td>클라우드로 자료를 한곳에서 관리 · 함께 작업하기 편해요</td></tr></table></div>
   <p>교재는 이것을 <b>교육의 질 · 훈련생 참여 · 시각 효과가 모두 함께 좋아진다</b>는 말로 마무리해요. 미리캔버스는 <b>온라인 플랫폼</b>이라 인터넷만 되면 어디서든 써요.</p>`,
   did:'첫 시간에 슬라이도로 서로의 수준과 바라는 점을 함께 봤어요.'}
 ]}]},

{no:'02',name:'교안 작성 툴 기능의 이해',short:'기본 기능',p:[13,71],goal:'로그인부터 워크스페이스, 에디터 화면, 템플릿, 사진, 요소, 표·차트, 글자, QR, 배경, 다운로드, 공유까지. 교재 순서대로 따라가되, 화면이 바뀐 곳은 2026년 10월 지금 화면으로 설명해요.',
 secs:[
 {no:'02-1',t:'로그인, 워크스페이스, 구성 메뉴 및 템플릿의 이해',p:[13,38],items:[
  {id:'b1',t:'미리캔버스 들어가기와 회원가입',p:[13,21],
   d:`<ol><li>크롬을 열고 <b>주소창</b>에 "미리캔버스"를 치거나, <b>검색창</b>에서 검색해 미리캔버스 사이트로 들어가요.<span class="pgi" data-a="14" data-b="15"></span></li>
   <li>로그인 없이 <b>바로 시작하기</b>로도 들어갈 수 있지만, 이때는 <b>내려받기와 저장이 안 돼요</b>. 수업 전에 꼭 가입해 두세요.</li>
   <li>오른쪽 위 <b>회원가입</b>을 눌러요. <b>카카오 · 네이버</b>(국내), <b>구글 · 페이스북 · 애플</b>(해외) 계정으로 바로 가입하거나 일반 이메일로 가입해요. 보통 구글이나 네이버로 많이 가입하고, 연결을 허락하면 바로 쓸 수 있어요.<span class="pgi" data-a="16" data-b="19"></span></li>
   <li><b>이메일로 가입</b>할 땐 이름 · 이메일 · 비밀번호(8~16자리)를 넣고 필수 약관에 동의해요. 그다음 <b>24시간 안에</b> 메일함에서 인증 메일을 눌러야 쓸 수 있어요. 인증되면 성공 창이 떠요.<span class="pgi" data-a="19" data-b="21"></span></li>
   <li>소셜 계정으로 가입했어도, 같은 이메일로 다시 소셜 가입을 해도 로그인에는 상관없어요.</li>
   <li><b>로그인 유지</b>를 묻는 창이 나오면 내 컴퓨터에서만 "예". 교육장 같은 <b>공용 컴퓨터에서는 "아니요"</b>를 눌러 다른 사람이 내 계정으로 들어가지 않게 해요.</li></ol>`,
   now:'가입 화면 모양과 버튼 위치는 조금 바뀌었어요. 지금 로그인 화면에는 <b>카카오 · 네이버 · 이메일</b> 버튼이 크게 있고, 그 아래 <b>구글 · 페이스북 · 웨일 · 애플</b> 아이콘이 있어요. <b>순서는 같아요</b>. 이미 가입했다면 넘어가도 돼요.'},
  {id:'b2',t:'로그인이 안 될 때 · 처음 들어간 화면',p:[22,24],
   d:`<ul><li><b>크롬 오류</b> · 크롬 위쪽에 "오류" 문구가 보이면 눌러 보세요. 새로 깔린 <b>확장 프로그램</b><span class="term">(크롬에 붙는 작은 프로그램)</span>이 원인이면, 그걸 크롬에서 삭제하면 사라져요.</li>
   <li><b>처음 로그인</b> · 에디터<span class="term">(디자인 편집 화면)</span>가 아니라 <b>워크스페이스</b>가 열려요. 오른쪽 위 <b>새 디자인 만들기</b>를 눌러 원하는 종류를 고르면 에디터로 가요.</li>
   <li><b>다시 로그인</b> · 템플릿 화면이나 에디터가 먼저 뜰 수도 있어요. <b>디자인 만들기</b> 또는 <b>바로 시작하기</b>를 누르면 에디터로 이동해요.</li></ul>`,
   now:'지금 워크스페이스 첫 화면에는 <b>"오늘은 어떤 디자인을 만들어볼까요?"</b> 문구 아래 <b>새 디자인 만들기</b>와 <b>miricle AI로 만들기</b> 버튼이 나란히 있어요. 미리클(miricle)은 미리캔버스 AI의 이름이에요.'},
  {id:'b3',t:'워크스페이스 · 내 작업물이 모이는 곳',p:[24,27],
   d:`<p><b>워크스페이스</b><span class="term">(작업 공간)</span>는 만든 디자인이 저장되는 곳이에요. 팀원과 함께 쓰고 공유하는 공간이고, 개인 워크스페이스도 만들 수 있어요. 다시 들어갈 땐 오른쪽 위 <b>내 이름(계정)</b>을 누르거나, 에디터의 전체 메뉴에서 <b>워크스페이스로 이동하기</b>를 눌러요.</p>
   <div class="tbl"><table><tr><th>메뉴</th><th>하는 일</th></tr>
   <tr><td>내 디자인</td><td>내가 만든 디자인 모아 보기</td></tr>
   <tr><td>내 드라이브</td><td>내 클라우드 저장 공간 · 폴더 만들기, 파일 올리기, 보기 방식 바꾸기</td></tr>
   <tr><td>공유 드라이브</td><td>팀원과 함께 쓰는 저장 공간</td></tr>
   <tr><td>즐겨찾기</td><td>자주 여는 디자인 모아 보기</td></tr>
   <tr><td>휴지통</td><td>지운 디자인 보관 · <b>30일 뒤</b> 완전히 삭제 · 오른쪽 끝을 눌러 <b>복원</b></td></tr></table></div>
   <p>디자인 위에 마우스를 올리면 오른쪽 아래에 <b>점 세 개 메뉴</b>가 생겨요. <b>사본 만들기 · 공유 · 이름 바꾸기 · 이동 · 삭제</b>를 여기서 해요.</p>`,
   now:'2026년 여름부터 화면이 <b>최신 환경</b> 하나로 합쳐졌어요. 워크스페이스에 <b>"이전 버전에서 만들어진 디자인이 모두 최신 환경으로 업데이트되었어요"</b>라는 안내가 보여요. 예전 디자인도 그대로 열리니 따로 옮길 필요가 없어요. 내 드라이브는 <b>폴더 · 템플릿 · 디자인 · 디자인 요소</b> 칸으로 나뉘어 보여요.'},
  {id:'b4',t:'내 드라이브에 폴더 만들고 사진 올리기',p:[28,29],
   d:`<ol><li>내 드라이브에서 <b>+ 폴더 만들기</b>를 눌러 폴더를 만들어요. 예: "이미지".</li>
   <li>폴더를 눌러 들어가요.</li>
   <li>오른쪽 위 <b>업로드</b> → 내 컴퓨터에서 파일 선택 → <b>열기</b>.</li>
   <li>폴더에 사진이 올라간 걸 확인해요. 이 사진은 에디터의 <b>업로드</b> 메뉴에서 바로 꺼내 쓸 수 있어요.</li></ol>`,
   now:'인터넷에서 받은 사진이 <b>WebP</b><span class="term">(웹 전용 이미지 형식)</span>이면 올라가지 않거나 깨질 수 있어요. 크롬 확장 프로그램 등으로 <b>JPG로 바꿔서</b> 올리세요.',
   did:'폴더 만들기 → 사진 올리기, WebP 사진은 JPG로 바꿔 올리기까지 해 봤어요.'},
  {id:'b5',t:'새 디자인 만들기 · 무엇을 만들까 고르기',p:[29,31],
   img:[['01_new_design','새 디자인 만들기 창 (2026.10 화면)']],
   d:`<p><b>새 디자인 만들기</b>를 누르면 <b>"무엇을 만들어야 하나요?"</b> 창이 떠요.</p>
   <ul><li>왼쪽 분류 · <b>추천 · 프레젠테이션 · 소셜 미디어 · 웹사이트 · 인쇄 · 기타</b></li>
   <li>교안은 <b>문서 → 프레젠테이션 (1920×1080 px)</b>을 골라요. 16:9 화면 크기예요.</li>
   <li>같은 줄에 <b>AI 프레젠테이션</b>, <b>인포그래픽 가로형 · 세로형</b>, <b>문서 서식 세로형(A4)</b>도 있어요. 유인물을 만들 땐 세로형을 써요.</li>
   <li>맨 아래 <b>파일 가져오기 (PDF · PPTX)</b>는 왕관 표시가 있는 <b>유료</b> 기능이에요. <b>직접 입력</b>으로 원하는 크기를 정할 수도 있어요.</li>
   <li>위 검색창에 "카드뉴스", "포스터"처럼 만들고 싶은 걸 검색해도 돼요.</li></ul>`},
  {id:'b5b',t:'에디터 화면 한눈에 보기',isnew:true,
   img:[['02_editor_ai_popup','빈 프레젠테이션을 연 에디터 화면']],
   d:`<p>교재에는 화면 전체 안내가 따로 없어서 지금 화면 기준으로 정리했어요. 화면은 <b>왼쪽 메뉴 · 가운데 작업 화면 · 위 막대 · 아래 막대</b> 네 부분이에요.</p>
   <div class="tbl"><table><tr><th>자리</th><th>있는 것</th></tr>
   <tr><td><b>왼쪽 메뉴</b></td><td>템플릿 · 요소 · 텍스트 · 사진 · 업로드 · 프로젝트 · AI 도구 · 배경 · 크리에이터 · 테마 · 차트 · 동영상, <b>아래로 내리면</b> 오디오 · QR/바코드 · 찜</td></tr>
   <tr><td><b>위 막대</b></td><td>왼쪽: 전체 메뉴(줄 세 개) · 되돌리기 · 다시 하기 · 저장 상태(구름) / 가운데: 디자인 제목 · 크기(1920×1080) / 오른쪽: 공유 · 슬라이드쇼 · 다운로드 · 더보기(…)</td></tr>
   <tr><td><b>아래 막대</b></td><td>페이지 목록과 + (페이지 추가) · 애니메이션 · 페이지 재생 시간(5초) · 디자인 에디터 ↔ 동영상 에디터 전환 · 확대/축소 · 레이어 · 도움말 · 사용법</td></tr>
   <tr><td><b>왼쪽 아래 ai 버튼</b></td><td>AI 프레젠테이션, 어울리는 요소 찾기, 맞춤법 검사 등 AI 기능 모음</td></tr></table></div>
   <p>빈 프레젠테이션을 열면 오른쪽 아래에 <b>"프레젠테이션 빠르게 만들어 볼까요?"</b> 창이 떠요. AI 프레젠테이션 안내라서 지금은 X로 닫아도 돼요.</p>`,
   when:'처음 에디터를 열고 "어디에 뭐가 있지?" 싶을 때'},
  {id:'b5c',t:'편집 환경 설정 · 전체 메뉴',isnew:true,
   img:[['20_hamburger','전체 메뉴(줄 세 개)'],['21_editmode','편집 환경 설정 · 패널형 / 툴바형']],
   d:`<p>왼쪽 위 <b>줄 세 개(전체 메뉴)</b>를 누르면 디자인 관리 메뉴가 모여 있어요.</p>
   <ul><li><b>워크스페이스로 이동하기</b> · 새 탭 없이 지금 탭에서 워크스페이스로 가요.</li>
   <li><b>새 디자인 만들기 · PDF·PPTX 가져오기(유료) · 사본 만들기 · 폴더로 이동</b></li>
   <li><b>버전 기록</b> · 지난 작업 내역을 보고 예전 상태로 되돌려요.</li>
   <li><b>텍스트 찾기 및 바꾸기 (Ctrl+F)</b> · 여러 장에 나온 같은 단어를 한 번에 바꿔요. 과정명이 바뀌었을 때 편해요.</li>
   <li><b>안내선 설정 · 페이지 번호 · 레이어 순서 · 언어 · 다크모드</b></li></ul>
   <p><b>편집 환경 설정</b>에서 화면 구성을 고를 수 있어요.</p>
   <ul><li><b>패널형</b> · 글자나 사진을 누르면 속성이 <b>왼쪽 패널</b>에 크게 나와요. 처음 쓰는 분께 편해요.</li>
   <li><b>툴바형</b> · 속성이 <b>위쪽 막대</b>에 한 줄로 나와 작업 화면이 넓어져요. PPT에 익숙한 분께 편해요.</li>
   <li><b>빠른 작업 도구</b> · 켜 두면 고른 요소 바로 위에 복제 · 삭제 · 잠금 같은 작은 버튼이 떠요.</li></ul>`,
   when:'화면이 좁거나, 메뉴 위치가 PPT랑 달라 헷갈릴 때'},
  {id:'b6',t:'템플릿 고르고 넣기 · 한 장만 vs 통째로(덮어쓰기)',p:[29,33],
   img:[['09_template','템플릿 메뉴'],['15_template_detail','템플릿을 누르면 · 이 템플릿으로 덮어쓰기'],['16_overwrite','덮어쓰기 뒤 · 아래에 14장이 모두 생김']],
   d:`<p><b>템플릿</b><span class="term">(미리 만들어진 양식)</span>은 대부분 무료이고, 일부는 유료예요.</p>
   <ol><li>왼쪽 <b>템플릿</b> 메뉴를 열면 위에 <b>"프레젠테이션"</b>이 골라져 있어요. 다른 종류가 필요하면 그 칸을 눌러 바꿔요.</li>
   <li>아래로 내리면 <b>최근사용 · 무료 프레젠테이션 · 추천 · 사업계획 · 경영/기업 · 보고서/기획서 · 포트폴리오 · 교육/강의</b> 묶음이 보여요. 썸네일 아래 <b>1/14</b>는 "14장짜리"라는 뜻이에요.</li>
   <li>검색창에 주제를 넣어 찾아요. 교안은 "교육", "강의", "오리엔테이션"으로 찾으면 잘 나와요.</li>
   <li>템플릿을 누르면 그 템플릿의 <b>모든 페이지</b>가 보여요.
     <ul><li><b>한 장만</b> 쓰려면 원하는 페이지 하나를 눌러요. 지금 페이지에만 들어가요.</li>
     <li><b>전부</b> 쓰려면 맨 위 <b>이 템플릿으로 덮어쓰기</b>를 눌러요. 아래 페이지 목록에 전부 생겨요.</li></ul></li>
   <li>아래쪽 <b>비슷한 템플릿</b>에서 닮은 디자인도 볼 수 있어요.</li></ol>
   <p>템플릿 찾기는 시간이 꽤 걸려요. <b>미리 넉넉히 시간을 잡고</b> 고르세요.</p>`,
   now:'덮어쓰기를 하면 오른쪽에 <b>"어울리는 요소 찾기"</b> 창이 자동으로 떠요. AI가 지금 디자인을 보고 어울리는 도형 · 장식을 추천해 주는 새 기능이에요. 필요 없으면 X로 닫아요.',
   did:'덮어쓰기로 통째로 넣어 보고, 한 장만 가져오기도 해 봤어요.'},
  {id:'b6b',t:'왕관 표시 · 무료와 유료 구분',p:[30,36],
   img:[['24_premium','무료 템플릿에 숨어 있던 유료 일러스트 1개 (다운로드 창)']],
   d:`<p><b>왕관 표시 = 프리미엄(유료)</b> 콘텐츠예요. 템플릿 · 사진 · 요소 · 글꼴 모두 같은 규칙이에요.</p>
   <ul><li>무료 사용자도 왕관 콘텐츠를 <b>넣어서 편집하고 저장</b>할 수 있어요. 대신 <b>MIRICANVAS 워터마크</b><span class="term">(글자 도장)</span>가 찍혀요.</li>
   <li><b>내려받기는 안 돼요.</b> 유료 플랜(Pro) 사용자는 워터마크 없이 내려받아요.</li>
   <li>표시가 없는 콘텐츠는 무료예요.</li></ul>`,
   now:'지금은 다운로드 창에 <b>"프리미엄 콘텐츠 1개 ₩1,100"</b>처럼 몇 개가 섞였는지와 <b>개별 구매 가격</b>이 바로 보여요. 펼치면 어떤 요소인지도 나와요. 그걸 지우거나 무료 요소로 바꾸면 무료로 내려받을 수 있어요.',
   fix:'교재 몇 군데(<b data-a="30" data-b="30"></b>, <b data-a="35" data-b="36"></b>)에 왕관 콘텐츠를 "사용할 수 없다", "저장은 된다"처럼 서로 다르게 적은 곳이 있어요. <b>무료: 넣기 · 편집 · 저장 O, 내려받기 X</b>로 정리해 두세요.'},
  {id:'b7',t:'업로드 · 내 사진 슬라이드에 넣기',p:[34,34],
   img:[['06_upload','업로드 메뉴 (2026.10 화면)']],
   d:`<p>왼쪽 <b>업로드</b> 메뉴를 누르면 내 드라이브 폴더에 올린 사진이 보여요. 사진을 <b>누르면</b> 지금 슬라이드에 들어가요.</p>
   <ul><li>맨 위 <b>업로드</b> 버튼으로 새 파일을 바로 올릴 수도 있어요.</li>
   <li><b>전체 · 폴더 · 이미지 · 오디오 · 동영상</b> 칸으로 골라 볼 수 있어요.</li>
   <li>교재 예시 사진은 Pexels<span class="term">(무료 사진 사이트)</span> 사진이라 자유롭게 써도 돼요.</li></ul>`,
   now:'업로드 메뉴에 <b>PDF · PPTX 가져오기</b>(왕관, 유료)가 생겼어요. 안내 문구는 "이제 PPTX를 편집할 수 있는 디자인으로 가져올 수 있어요"예요. 무료로는 기존 PPT를 통째로 못 가져오니, <b>내용만 복사해서 템플릿에 붙이는</b> 방법을 써요. <b>이미지를 편집할 수 있게 분해하기</b>(그림 속 글자와 요소를 떼어 고치기) 기능도 새로 보여요.'},
  {id:'b8',t:'사진 메뉴 · 찾기와 AI 사진',p:[35,36],
   img:[['05_photo','사진 메뉴']],
   d:`<ul><li><b>사진</b> 메뉴 검색창에 "전시회 관람 중인 사람들"처럼 <b>문장으로</b> 검색해도 돼요.</li>
   <li>검색창 오른쪽 <b>필터 버튼</b>으로 원하는 색이 많이 들어간 사진만 골라 볼 수 있어요.</li>
   <li>아래로 내리면 <b>풍요로운 가을 · 하늘 · 인물 · 바다 · 꽃</b>처럼 주제별 묶음이 있어요.</li>
   <li>왕관 사진은 넣으면 워터마크가 찍혀요. 표시 없는 사진은 무료예요.</li></ul>`,
   now:'사진 메뉴 위쪽에 <b>무료 AI 도구 활용하기</b> 칸이 생겼어요. <b>AI로 원하는 사진 만들기 · 창의적인 제품사진 만들기 · 흰 배경으로 깔끔한 이미지 만들기</b>가 있어요. 쓸 때마다 AI 크레딧이 빠져요.'},
  {id:'b8b',t:'사진 편집 · 자르기, 필터, AI 편집',p:[36,38],
   img:[['30_photo_props','사진을 누르면 왼쪽에 나오는 속성']],
   d:`<p>슬라이드에 넣은 사진을 누르면 왼쪽에 <b>속성</b>이 나와요.</p>
   <div class="tbl"><table><tr><th>칸</th><th>할 수 있는 것</th></tr>
   <tr><td>맨 위 줄</td><td><b>불투명도 · 정렬 · 순서 · 반전 · 자르기 · 배경으로 만들기 · 사진 초기화</b></td></tr>
   <tr><td><b>AI 사진 편집</b></td><td><b>배경 제거</b>(사람 · 물건만 남기기) · 영역 지우개(왕관) · 이미지 확장(왕관) · 부분 생성 · 화질 개선</td></tr>
   <tr><td><b>필터</b></td><td><b>필터 효과</b>(화사한 · 저녁 노을 · 흑백 등) / <b>직접 조정</b>(밝기 · 대비 등)</td></tr>
   <tr><td>아래쪽</td><td>색상 채우기 · <b>그라데이션 마스크</b> · 외곽선 · 그림자 · 요소 크기 입력 · 비슷한 사진</td></tr></table></div>
   <p>사진 위에 뜨는 작은 버튼과 <b>점 세 개 메뉴</b>에는 복사 · 붙여넣기 · 복제 · 삭제 · 순서 · 정렬 · <b>스타일 복사</b>(적용한 꾸밈을 다른 사진에 그대로) · 잠금 · 애니메이션 · 링크 · <b>요소 정보</b>(사진 이름 · 저작권 확인)가 있어요.</p>`,
   now:'교재의 "AI 편집 5번까지"처럼 횟수가 정해져 있던 방식은 바뀌었어요. 지금은 <b>AI 크레딧</b>(매일 조금씩 채워지는 포인트)으로 써요. <b>사진에도 외곽선</b>을 넣을 수 있고, 그라데이션 마스크도 배경뿐 아니라 <b>사진 하나하나에</b> 바로 걸 수 있어요.'}
 ]},
 {no:'02-2',t:'요소 활용 및 데이터 메뉴 활용',p:[39,51],items:[
  {id:'c1',t:'디자인 새로 만들기와 저장',p:[39,41],
   img:[['17_text_props_autosave','"실시간으로 디자인이 저장돼요" 안내']],
   d:`<ol><li>왼쪽 위 <b>전체 메뉴</b><span class="term">(줄 세 개 아이콘)</span> → <b>새 디자인 만들기</b>.</li>
   <li>새 디자인은 <b>새 브라우저 탭</b>으로 열려요. 하던 작업은 원래 탭에 그대로 있어요.</li>
   <li>전체 메뉴의 <b>워크스페이스로 이동하기</b>를 누르면 새 탭 없이 지금 탭에서 워크스페이스로 가요.</li>
   <li>워크스페이스에서 방금 만든 디자인을 누르면 마지막 상태로 열려요.</li></ol>`,
   now:'교재는 "새 디자인 전에 <b>저장 버튼(Ctrl+S)</b>을 꼭 눌러라, 진한 회색은 저장 전 · 옅은 회색은 저장됨"이라고 해요. 지금 에디터는 <b>실시간 자동 저장</b>이에요. 처음 고치면 <b>"실시간으로 디자인이 저장돼요. 이제 저장 버튼을 따로 누르지 않아도 돼요"</b> 안내가 떠요. 위 막대의 <b>구름 아이콘</b>이 저장 상태예요. 예전으로 돌아가고 싶으면 전체 메뉴의 <b>버전 기록</b>을 써요.'},
  {id:'c2',t:'요소의 종류 · 꾸밈 재료 찾기',p:[41,42],
   img:[['03_elements','요소 메뉴']],
   d:`<p><b>요소</b><span class="term">(꾸밈 재료)</span>는 사진 · 배경 · 텍스트를 뺀 모든 그림 재료예요.</p>
   <div class="tbl"><table><tr><th>칸</th><th>내용</th></tr>
   <tr><td>일러스트 · 도형 · 선 · 아이콘 · 애니</td><td>그림, 기본 도형, 선 · 화살표, 아이콘, 움직이는 그림</td></tr>
   <tr><td>컬렉션</td><td>같은 분위기의 일러스트 묶음</td></tr>
   <tr><td>프레임</td><td>사진을 끼우는 틀</td></tr>
   <tr><td>표 · 차트</td><td>데이터 정리 (차트는 왼쪽 <b>차트</b> 메뉴에도 따로 있어요)</td></tr>
   <tr><td>조합 · 스마트 블록 · 다이어그램</td><td>PPT의 스마트아트 같은 도식</td></tr></table></div>
   <ul><li>칸이 많으면 오른쪽 <b>&gt;</b> 화살표로 넘겨 봐요.</li>
   <li>검색창에 글자가 남아 있으면 전체가 안 보여요. 다 보려면 <b>검색어를 지우세요</b>.</li>
   <li>여러 요소를 한꺼번에 고를 땐 <b>Ctrl(맥은 Command) 또는 Shift를 누른 채 클릭</b>해요.</li></ul>`,
   now:'요소 메뉴 첫 화면에 <b>AI 꾸미기</b>(왕관, "요소 찾기부터 배치까지 AI가 대신해요"), <b>확장형 요소</b>(원하는 길이로 늘이는 연필 · 화살표), <b>무료 디자인 꾸미기</b>, <b>스마트 블록</b>이 새로 보여요. 요소 사이 <b>간격 자동 맞춤</b>, 여러 요소의 <b>길이 · 색 한꺼번에 바꾸기</b>도 생겼어요.'},
  {id:'c3',t:'프레임에 사진 끼우기',p:[42,45],
   d:`<ol><li>요소 메뉴의 <b>프레임</b> 칸을 열거나 검색창에 "프레임"을 넣어요. 원형 · 스타일 프레임, 스마트폰 모양 프레임 등이 나와요.</li>
   <li>프레임을 슬라이드에 넣고, 사진 메뉴의 사진을 <b>프레임 위로 끌어다 놓으면</b> 쏙 들어가요. 인물 사진이 연습하기 좋아요.</li>
   <li>프레임 안의 사진을 <b>더블클릭</b>하면 사진 위치와 크기를 옮길 수 있어요. 얼굴이 가운데 오게 맞춰요.</li></ol>`,
   did:'프레임에 사진을 넣고 더블클릭으로 위치를 맞춰 봤어요.',when:'사진을 동그랗게, 휴대폰 화면 안에 넣고 싶을 때'},
  {id:'c4',t:'표 만들기',p:[46,48],
   img:[['34_table','표를 누르면 나오는 속성']],
   d:`<ol><li>요소 메뉴의 <b>표</b> 칸을 열어요. <b>기본 스타일 · 2026 심플 달력 · 의류 사이즈</b> 묶음이 있어요. 더 보려면 <b>더보기</b>.</li>
   <li>원하는 표를 누르면 슬라이드에 들어가요. 셀을 눌러 글자를 고쳐요.</li>
   <li>표 테두리를 누르면 왼쪽에 속성이 나와요.
     <ul><li><b>행 × 열</b> · 숫자만 바꾸면 줄과 칸이 늘거나 줄어요. 예: 4 × 4 → 8 × 7</li>
     <li><b>글꼴 · 크기 · 정렬 · 글자색</b></li>
     <li><b>배경색 · 테두리 · 셀 여백 · 둥근 모서리 · 행/열 간격</b></li>
     <li><b>달력 만들기</b> · 달력 모양 표로 바꿔요. 교육 일정표에 좋아요.</li></ul></li>
   <li>셀 안에서 마우스 오른쪽 · 점 세 개 메뉴로 셀 합치기 · 행/열 추가 · 삭제를 해요.</li></ol>`,
   now:'교재 화면처럼 셀을 하나씩 늘리지 않아도, 지금은 <b>행 × 열 숫자</b>로 한 번에 바꿔요.',
   did:'칸이 많은 표는 익숙한 <b>한글 · 엑셀</b>에서 만든 뒤 가져와 썼어요. 그게 훨씬 빨라요.'},
  {id:'c5',t:'차트 만들기 · 게이지 차트',p:[48,50],
   img:[['10_chart','차트 메뉴 (왼쪽 메뉴로 독립)'],['33_chart_data','차트를 누르면 · 데이터 편집 표'],['32_gauge','게이지 차트 속성']],
   d:`<p>지금은 왼쪽 메뉴에 <b>차트</b>가 따로 있어요. 열면 이렇게 나뉘어요.</p>
   <ul><li><b>플로우차트</b> · 순서도 도형 / <b>차트</b> · 막대 · 선 · 원형 / <b>게이지 차트</b> · 달성률 / <b>인포그래픽 디자인 · 스마트 오브젝트 · 타임라인/연혁도 · 사분면 그래프</b></li></ul>
   <ol><li>차트를 넣고 누르면 왼쪽에 <b>데이터 편집</b> 표가 나와요. 엑셀처럼 A열은 항목, B열부터 숫자를 넣으면 차트가 바로 바뀌어요. 엑셀에서 복사해 붙여도 돼요.</li>
   <li>데이터 편집을 닫으면 속성이 나와요. 차트 종류 바꾸기 · 글꼴 · 최대/최소값 · 색 · 범례 · 데이터 라벨을 정해요.</li>
   <li><b>게이지 차트</b><span class="term">(계기판 모양, 달성률 보여 주기)</span>는 <b>모양</b>(원형 360° 등) · <b>데이터 형식</b>(백분율 / 직접 입력) · <b>값</b> · 게이지 스타일 · 데이터 라벨 · 축 라벨 · 보조 텍스트를 정해요. 출석률, 진도율, 합격률을 보여 주기 좋아요.</li></ol>`,
   now:'교재 화면은 예전 편집기라 메뉴 모양이 달라요. 차트가 <b>왼쪽 메뉴로 독립</b>했고, <b>게이지 차트</b>가 생겼어요. 차트에도 <b>외곽선</b>을 넣을 수 있어요.',
   did:'차트와 게이지 차트를 만들어 봤어요.'},
  {id:'c6',t:'조합 · 인포그래픽 도식',p:[51,51],
   d:`<p>요소 메뉴의 <b>조합</b>, 차트 메뉴의 <b>인포그래픽 디자인 · 스마트 오브젝트 · 타임라인</b>에 도식이 모여 있어요. 넣은 뒤 그룹을 풀면 <b>글자 · 색 · 크기</b>를 하나씩 바꿀 수 있고, <b>비슷한 요소 찾기</b>로 다른 모양을 골라 볼 수 있어요.</p>`,
   when:'순서나 단계를 그림으로 보여 주고 싶을 때'}
 ]},
 {no:'02-3',t:'텍스트 및 배경 활용',p:[52,61],items:[
  {id:'d1',t:'글자 넣기 · 묶인 글자 풀기',p:[52,53],
   img:[['04_text','텍스트 메뉴']],
   d:`<ol><li>왼쪽 <b>텍스트</b> 메뉴 → <b>제목 · 부제목 · 본문 텍스트 추가</b> 중 하나를 눌러요.</li>
   <li><b>스타일</b> 칸에는 미리 꾸며진 글자 묶음이 있어요. 이건 여러 개가 묶인 <b>그룹</b>이라 바로 안 고쳐질 때가 있어요.</li>
   <li>그럴 땐 <b>그룹 해제</b> → 글자 수정 · 크기 조절 → 다시 <b>그룹</b>으로 묶어요.</li></ol>`,
   now:'텍스트 메뉴에 <b>"지금 디자인에 어울리는"</b> 글꼴 추천 칸과 <b>저작권 안심글꼴</b> 묶음이 생겼어요. 디자인을 조금 채운 뒤 <b>수정한 디자인으로 추천</b>을 누르면 어울리는 글꼴을 골라 줘요.'},
  {id:'d2',t:'글자 꾸미기 · 서식, 색, 외곽선, 그림자, 곡선',p:[53,56],
   img:[['17_text_props_autosave','글자를 누르면 왼쪽에 나오는 속성'],['18_color','글자색 · 단색 / 그라데이션']],
   d:`<p>글자를 누르면 <b>파란 테두리</b>가 생기고 왼쪽에 속성이 나와요. 모서리를 끌어 크기를 바꿀 수도 있어요.</p>
   <div class="tbl"><table><tr><th>메뉴</th><th>할 수 있는 것</th></tr>
   <tr><td>맨 위 줄</td><td>불투명도 · 정렬 · 순서</td></tr>
   <tr><td>글꼴 줄</td><td>글꼴 · 크기(− 숫자 +) · 굵게 · 기울임 · 밑줄 · 특수 서식</td></tr>
   <tr><td>문단 줄</td><td>정렬 · 세로 정렬 · 자간/행간 · 글머리 기호/번호 · <b>글자색</b> · <b>글자 배경색</b>(형광펜) · 이모지</td></tr>
   <tr><td>외곽선</td><td>색, 두께 · 제목이나 강조 글자에 좋아요</td></tr>
   <tr><td>그림자</td><td>색, 방향, 투명도, 거리, 흐림</td></tr>
   <tr><td>곡선</td><td>글자를 바깥쪽 · 안쪽으로 휘어 둥근 글자 만들기</td></tr>
   <tr><td>세로 쓰기</td><td>글자를 위에서 아래로</td></tr></table></div>
   <p><b>글자색</b>을 누르면 <b>단색 / 그라데이션</b> 칸이 있어요. <b>사용 중인 색상</b>에 이 디자인에 쓴 색이 모여 있고, 아래 칸에 <b>헥사코드</b><span class="term">(#234B99 같은 색 번호)</span>를 넣거나 <b>스포이드</b>로 화면 색을 찍어 올 수 있어요.</p>`,
   now:'새 에디터에서는 <b>그라데이션 · 외곽선 · 그림자 · 애니메이션</b>을 한 글자에 <b>여러 개 함께</b> 줄 수 있고, 언제든 다시 고칠 수 있어요. 단, <b>곡선 · 외곽선</b>을 넣은 글자는 PPTX로 받으면 그림으로 바뀌어요.',
   did:'글자에 그라데이션 · 그림자 · 외곽선 효과를 넣어 봤어요.'},
  {id:'d2b',t:'자주 쓰는 단축키 · 점 세 개 메뉴',isnew:true,
   img:[['19_more_menu','요소 위 점 세 개 메뉴와 정렬 단축키']],
   d:`<div class="tbl"><table><tr><th>하는 일</th><th>단축키</th></tr>
   <tr><td>복사 / 붙여넣기 / 복제</td><td>Ctrl+C / Ctrl+V / <b>Ctrl+D</b></td></tr>
   <tr><td>스타일 복사 (꾸밈만 복사)</td><td>Ctrl+Alt+C</td></tr>
   <tr><td>잠금 (실수로 안 움직이게)</td><td>Ctrl+L</td></tr>
   <tr><td>왼쪽 · 가운데 · 오른쪽 정렬</td><td>Alt+A · Alt+H · Alt+D</td></tr>
   <tr><td>위 · 중간 · 아래 정렬</td><td>Alt+W · Alt+V · Alt+S</td></tr>
   <tr><td>텍스트 찾기 및 바꾸기</td><td>Ctrl+F</td></tr>
   <tr><td>페이지 추가 / 복제</td><td>Shift+Enter / Ctrl+D</td></tr></table></div>
   <p>점 세 개 메뉴에는 레이어 선택 · 순서 · 정렬 · 잠금 · 애니메이션 · <b>링크</b> · 요소 정보도 있어요.</p>`,
   when:'PPT처럼 빠르게 작업하고 싶을 때'},
  {id:'d3',t:'QR 코드 만들기',p:[57,57],
   img:[['28_qr','왼쪽 메뉴 아래쪽 QR/바코드 → URL → 만들기'],['29_qr_symbol','심벌 마크 · 가운데 아이콘 넣기']],
   d:`<ol><li>왼쪽 메뉴를 <b>아래로 스크롤</b>하면 숨어 있던 <b>QR/바코드</b> 메뉴가 나와요.</li>
   <li><b>QR코드</b> 칸에 인터넷 주소(URL)를 넣고 <b>만들기</b>. <b>바코드</b> 칸은 숫자만 돼요.</li>
   <li>QR을 누르면 속성에서 주소를 바꾸고 <b>적용</b>할 수 있어요.</li>
   <li><b>심벌 마크</b>를 켜면 QR 가운데에 아이콘을 넣어요. <b>아이콘</b> 칸에 라인 · 인스타그램 · 유튜브 등이 있고, <b>업로드</b> 칸으로 <b>내 기관 로고</b>를 넣을 수 있어요.</li></ol>`,
   did:'QR 코드 가운데에 작은 로고를 넣어 봤어요.',when:'교안 마지막 장에 설문 · 자료 링크를 넣고 싶을 때'},
  {id:'d4',t:'배경 바꾸기 · 사진, 패턴, 사진을 배경으로',p:[58,59],
   img:[['08_background','배경 메뉴']],
   d:`<ul><li><b>배경</b> 메뉴에는 <b>사진 / 패턴</b> 칸이 있어요. 맨 위 <b>배경색</b>에서 단색 배경을 고르고, 아래 <b>그래픽 배경 · 텍스처 배경</b>에서 사진 배경을 골라요.</li>
   <li>배경을 넣은 뒤 <b>배경 편집</b>을 누르면 이동 · <b>투명도</b> · 반전 · 자르기 · 배경 빼내기 · 색 · 필터를 바꿔요.</li>
   <li>패턴 배경은 색과 <b>무늬 크기</b>를 바꿀 수 있어요.</li>
   <li>슬라이드에 넣은 사진도 사진 속성의 <b>배경으로 만들기</b>를 누르면 배경이 돼요.</li>
   <li>다른 템플릿에서 가져온 페이지와 배경색을 맞출 땐 배경색 → <b>스포이드</b>로 원래 색을 찍어 와요.</li></ul>`,
   now:'배경 메뉴 아래에 <b>무료 AI 도구 활용하기</b>(몽환적인 배경 만들기 · 자유롭게 배경 만들기 · 비슷한 이미지 생성)가 생겼어요. 그래픽 배경 상당수가 왕관이니 확인하고 쓰세요.'},
  {id:'d5',t:'그라데이션 마스크 · 사진 가장자리를 서서히 투명하게',p:[60,61],
   img:[['31_mask','사진에 그라데이션 마스크 켜기 · 타입과 범위']],
   d:`<p>사진이나 배경 사진에 <b>그라데이션 마스크</b><span class="term">(서서히 투명해지는 효과)</span>를 켜면 사진 가장자리가 안개처럼 흐려져요.</p>
   <ol><li>사진을 누르고 속성 아래쪽 <b>그라데이션 마스크</b>를 켜요.</li>
   <li><b>타입</b>을 골라요. <b>네모</b> · 사각형 모양으로 / <b>원형</b> · 동그랗게 / <b>막대(/)</b> · 한쪽 방향으로만 흐려져요.</li>
   <li><b>범위</b>(%)를 움직여 얼마나 흐릴지 정해요. 막대 타입은 방향도 바꿀 수 있어요.</li>
   <li>흐려진 자리에 제목 글자를 얹으면 깔끔한 표지가 돼요.</li></ol>`,
   did:'표지 사진에 마스크를 넣고 그 자리에 제목을 얹어 봤어요.'},
  {id:'d6',t:'테마 · 색 조합 한 번에 바꾸기',isnew:true,
   img:[['13_theme','테마 메뉴']],
   d:`<p>교재에는 없는 새 메뉴예요. 왼쪽 <b>테마</b> 메뉴에서 색 조합 하나를 누르면 <b>디자인 전체의 색</b>이 한 번에 바뀌어요.</p>
   <ul><li><b>현재 색상</b> · 지금 디자인에 쓰인 색 / <b>초기화</b> · 원래 색으로</li>
   <li><b>모든 테마 색상</b>에서 고르거나, <b>셔플</b>로 무작위로 섞어 봐요.</li>
   <li>검색창에 "파랑", "파스텔"처럼 색 이름을 넣어 찾아요.</li></ul>`,
   when:'템플릿은 마음에 드는데 색이 우리 기관과 안 맞을 때'}
 ]},
 {no:'02-4',t:'협업, 다운로드 및 배포 방법',p:[62,71],items:[
  {id:'e1',t:'내려받기 · 파일 종류 고르기',p:[62,64],
   img:[['22_download','다운로드 창'],['23_filetype','파일 형식 목록']],
   d:`<p>위 막대 오른쪽 <b>다운로드</b>를 눌러요.</p>
   <div class="tbl"><table><tr><th>파일 형식</th><th>화면 설명</th><th>언제</th></tr>
   <tr><td>PNG</td><td>배경이 투명한 고품질 이미지</td><td>로고 · 아이콘처럼 배경 없이 쓸 때</td></tr>
   <tr><td>JPG</td><td>공유에 적합한 이미지</td><td>카톡 · SNS로 한 장씩 보낼 때</td></tr>
   <tr><td><b>PDF (웹용)</b></td><td>문서에 적합한 파일 · <b>권장</b></td><td>훈련생에게 교안 나눠 줄 때</td></tr>
   <tr><td><b>PDF (인쇄용)</b></td><td>벡터를 포함하는 인쇄용 파일</td><td>종이로 뽑을 때</td></tr>
   <tr><td><b>PPTX</b></td><td>텍스트 수정이 가능한 파워포인트 파일</td><td>PPT에서 이어서 고칠 때</td></tr>
   <tr><td>MP4 · GIF</td><td>동영상 / 소리 없이 움직이는 이미지</td><td>애니메이션을 넣은 디자인</td></tr></table></div>
   <p>창 아래 <b>다운로드 정보</b>에 페이지 수와 크기가 나오고, <b>알기 쉬운 저작권 가이드</b> 링크가 있어요. 유료 요소가 섞였으면 <b>프리미엄 콘텐츠 개수와 가격</b>이 보여요.</p>`,
   now:'다운로드를 누르면 위에 <b>"다운로드 전에 체크해볼까요? 맞춤법 검사"</b> 안내가 떠요. 오타 확인에 좋아요. PPTX로 받으면 <b>휘어진 글자 · 둥근 모서리 · 테두리</b> 같은 효과는 파워포인트에서 <b>그림으로 바뀌어</b> 글자를 고칠 수 없어요.',
   did:'PDF와 PPTX로 내려받아 파워포인트에서 열어 봤어요.'},
  {id:'e2',t:'페이지 골라 받기 · 한 장으로 합치기',p:[64,65],
   d:`<ul><li><b>페이지 선택</b>에서 <b>모든 페이지</b> 또는 원하는 페이지만 체크해요.</li>
   <li>두 장 이상을 이미지로 받을 때 · <b>여러 장 그대로</b>(ZIP 압축 파일로 받아져요) 또는 <b>한 장으로 합치기</b>(위아래로 이어 붙인 긴 그림 한 장).</li>
   <li>한 장으로 합치기는 고해상도로만 받을 수 있어요.</li></ul>`},
  {id:'e3',t:'선명도(dpi) · 화면용과 인쇄용',p:[65,68],
   d:`<p><b>dpi</b><span class="term">(1인치에 점이 몇 개인지, 클수록 선명)</span>로 선명도를 비교해요. 교재는 웹용 빠른 다운로드 72dpi, 웹용 고해상도 96dpi, <b>인쇄용 300dpi</b>(예: 6000×3375 픽셀)로 비교해요.</p>`,
   now:'지금 다운로드 창은 "빠른 / 고해상도"를 따로 묻지 않고 <b>PDF (웹용) · PDF (인쇄용)</b>처럼 파일 형식에서 나눠요.',
   fix:'교재에 서로 다른 dpi 숫자가 섞여 있어 헷갈릴 수 있어요. <b>화면용은 웹용, 종이로 뽑을 땐 인쇄용 PDF</b> 하나만 기억하세요.'},
  {id:'e4',t:'함께 작업하기 · 멤버 초대',p:[68,70],
   img:[['26_access','공유 탭 · 사람 초대와 접근 권한']],
   d:`<ol><li>위 막대 <b>공유</b> → <b>공유</b> 탭의 "이름 또는 이메일 입력"에 함께 고칠 사람을 넣어 초대해요.</li>
   <li>초대받은 사람은 알림 · 메일에서 <b>수락</b>하고 디자인을 열어요.</li>
   <li>팀 전체가 함께 쓰는 자료는 워크스페이스의 <b>공유 드라이브</b>에 모아요.</li></ol>`,
   now:'지금은 워크스페이스 멤버 <b>최대 50명이 동시에</b> 같은 디자인을 고칠 수 있어요. 고친 내용은 모두에게 실시간으로 보여요.',
   did:'함께 작업하기는 화면으로 함께 보고 참고만 했어요.'},
  {id:'e5',t:'링크로 나눠 주기 · 접근 권한과 게시',p:[71,71],
   img:[['27_publish','게시 탭 · 디자인 문서 공개']],
   d:`<p><b>공유</b> 창에는 <b>공유 / 게시</b> 두 칸이 있어요.</p>
   <ul><li><b>공유</b> 칸 · <b>접근 권한</b>을 <b>"제한됨(추가된 사용자만)"</b>에서 <b>"링크가 있는 누구나"</b>로 바꾸고 <b>링크 복사</b>를 누르면, 링크를 받은 사람 누구나 볼 수 있어요.</li>
   <li><b>게시</b> 칸 · <b>디자인 문서 공개</b>를 켜면 웹 페이지처럼 볼 수 있는 주소가 생겨요. <b>미리보기</b>로 확인하고, <b>페이지 스타일</b>(좌우 슬라이드 등)과 <b>상세 옵션</b>을 정해요. 받은 사람은 고칠 수 없어요.</li>
   <li><b>템플릿 링크 공유</b> · 내 디자인을 다른 사람이 복사해서 쓸 수 있게 템플릿으로 나눠요.</li>
   <li>만든 링크로 <b>QR 코드</b>를 만들어 슬라이드에 넣으면 훈련생이 휴대폰으로 바로 열어요.</li></ul>`,
   now:'공유 창을 열면 위에 <b>"공유하기 전에 확인해볼까요? 맞춤법 검사"</b> 안내가 떠요. 교재에 나온 비밀번호 · 원본 복제 허용 같은 세부 설정은 게시 칸의 <b>상세 옵션</b>에서 확인하세요.',
   did:'링크를 복사해 <b>패들렛</b>에 올리고 서로 결과물을 봤어요.'}
 ]}
]},

{no:'03',name:'저작권 가이드 이해 및 템플릿 활용 교안 제작',short:'저작권 · 템플릿',p:[72,108],goal:'안심하고 쓰는 저작권 규칙을 알고, 템플릿으로 실제 교안을 만드는 순서를 따라가요.',
 secs:[
 {no:'03-1',t:'미리캔버스 저작권 가이드',p:[72,77],items:[
  {id:'f1',t:'기본 규칙 · 요소, 템플릿, 프리미엄',p:[72,73],
   d:`<ul><li><b>요소</b> · 미리캔버스가 정식 계약으로 받은 재료예요. <b>2개 이상을 조합</b>해서 새 디자인을 만들어야 해요. 요소 <b>하나만 따로 내려받기는 금지</b>예요.</li>
   <li><b>템플릿</b> · 디자인 예시라서 자유롭게 고치고, 여러 템플릿을 섞어도 돼요. 단, <b>고칠 수 있는 파일을 남에게 나눠 주면 안 돼요</b>.</li>
   <li><b>프리미엄(왕관)</b> · Pro/Enterprise 구독이나 개별 구매 시 워터마크 없이 써요. 무료 요금제에선 워터마크가 찍혀요.</li></ul>`,
   did:'요소 하나만 넣으면 내려받기가 안 되는 걸 직접 확인하고, 두 개 이상 넣어 해결했어요.'},
  {id:'f2',t:'인물 사진과 캐릭터 · 조심할 곳',p:[73,74],
   d:`<ul><li><b>미용 · 병의원 · 다이어트 · 성형 광고</b>에는 인물 사진 사용이 제한돼요. 쓰기 전에 고객센터 확인이 필요해요(한 번에 최대 10개까지 검토).</li>
   <li>전후 비교(Before &amp; After) 형식, 모델의 명예를 해치는 사용, 과장 광고용 합성은 <b>금지</b>예요.</li>
   <li><b>캐릭터 요소</b>는 기업 · 단체의 <b>마스코트로 쓸 수 없어요</b>. 본래 모습을 해칠 만큼 바꾸는 것도 안 돼요.</li></ul>`,
   when:'미용 · 의료 · 다이어트 관련 과정을 맡고 있을 때'},
  {id:'f3',t:'써도 되는 곳, 안 되는 곳',p:[74,74],
   d:`<div class="tbl"><table><tr><th>써도 돼요</th><th>안 돼요</th></tr>
   <tr><td>인쇄물(현수막 · 배너 · 브로슈어)<br>온라인(홈페이지 · SNS · 유튜브)<br><b>교육 자료(수업 자료 · 발표 자료 · 보고서)</b><br>광고 · 홍보물(영리 · 비영리)<br>디자인 대행 제작 · 납품</td>
   <td>고칠 수 있는 파일 나눠 주기<br>스톡 이미지 사이트에 올리기<br>크리에이터 마켓에서 팔기<br>상표 등록용 로고 만들기</td></tr></table></div>
   <p>헷갈리면 고객센터에 물어보는 게 가장 확실해요.</p>`},
  {id:'f4',t:'내려받은 파일 다시 고치기 · 나눠 줄 땐 PDF',p:[75,75],
   d:`<ul><li>PPT로 받은 파일은 다른 PPT와 합치거나, 한컴오피스 · 어도비 같은 프로그램에서 고쳐도 돼요.</li>
   <li>요소를 <b>따로 떼어 내거나 캡처하는 것은 금지</b>예요. 바깥 자료를 섞을 땐 그 자료의 저작권도 확인해요.</li>
   <li>남에게 최종본을 줄 땐 <b>PDF처럼 고칠 수 없는 형태</b>로 줘요. 고칠 수 있는 PPT 파일을 나누거나 파는 건 규정 위반이에요.</li></ul>`,
   when:'훈련생에게 교안 파일을 나눠 주기 전에'},
  {id:'f5',t:'법적 책임 · 프리미엄 쓰는 법 · 문의',p:[75,77],
   d:`<ul><li>원저작자의 권리를 존중하고, 라이선스 조건을 지켜요. 재판매 · 임대 · 양도 · 배포는 금지예요.</li>
   <li>바깥 <b>글꼴 · 이미지</b>를 쓸 땐 그쪽 라이선스를 따로 확인해요.</li>
   <li><b>공모전</b>에 낼 땐 주최 측이 미리캔버스 콘텐츠를 허용하는지 확인해요.</li>
   <li>프리미엄은 구독 외에 <b>필요한 것만 개별 구매</b>도 돼요. 무료로는 워터마크 버전이나 무료 대체 콘텐츠를 써요.</li>
   <li>문의 · miricanvas@miridih.com, 미리캔버스 헬프센터(도움말 · 자주 묻는 질문).</li></ul>`,
   fix:'교재 뒤쪽 정리(<b data-a="232" data-b="232"></b>)의 저작권 설명은 "템플릿은 비상업적 용도만"처럼 앞과 다르게 적혀 있어요. <b><b data-a="73" data-b="75"></b> 내용이 기준</b>이에요. 교육 자료와 홍보물에도 쓸 수 있어요.'}
 ]},
 {no:'03-2',t:'템플릿을 활용한 교안 제작',p:[77,108],items:[
  {id:'g1',t:'만들기 전에 · 원고 먼저, 템플릿은 나중',p:[78,80],
   d:`<p>템플릿부터 고르고 내용을 끼워 맞추면 시간이 오래 걸려요. 교재가 권하는 순서는 이래요.</p>
   <div class="flow"><span>① 가원고 준비</span><i>→</i><span>② 템플릿 고르기</span><i>→</i><span>③ 필요 없는 요소 지우기</span><i>→</i><span>④ 빈 슬라이드 추가</span></div>
   <ul><li><b>가원고</b><span class="term">(대강 써 둔 원고)</span>로 필요한 장수를 미리 세요.</li>
   <li>색은 <b>2~3가지</b>, 글꼴은 <b>2가지</b>로 줄여야 깔끔해요.</li>
   <li>과한 그림자 · 복잡한 배경 · 산만한 장식은 과감히 지워요.</li>
   <li>빈 슬라이드로 전체 뼈대를 먼저 잡고 내용을 채워요.</li></ul>`,
   did:'원고 대신 내 자료를 AI로 정리해 장표 내용을 먼저 뽑았어요.'},
  {id:'g2',t:'템플릿 찾기 · 검색, 색으로 찾기',p:[80,83],img:[['09_template','템플릿 메뉴 · 검색창 오른쪽 필터']],
   d:`<ol><li>햄버거 메뉴 → 새 디자인 만들기, 또는 워크스페이스의 새 디자인 만들기 → <b>프레젠테이션</b>.</li>
   <li>검색창 아래가 <b>프레젠테이션</b>으로 되어 있는지 확인하고 검색해요. 예: "교육".</li>
   <li><b>최근 사용</b>은 전에 쓴 템플릿, <b>추천</b>은 주제별 모음이에요.</li>
   <li>검색창 오른쪽 <b>팔레트 아이콘</b>을 누르면 <b>색으로</b> 찾을 수 있어요. 검색어와 색을 함께 써도 되고, <b>+</b>로 원하는 색을 직접 뽑아 찾아요. 초기화로 되돌려요.</li>
   <li>템플릿 목록 옆 <b>손잡이</b>를 오른쪽으로 끌면 미리보기가 크게, 많이 보여요.</li></ol>`,
   now:'지금 템플릿 메뉴는 검색창 오른쪽 <b>필터 버튼</b>에서 색 등 조건을 고르고, 아래에 <b>교육/강의</b> 같은 주제 묶음이 바로 보여요. 검색창 예시처럼 "여름 메뉴 세로 포스터" 같은 <b>문장 검색</b>도 돼요.'},
  {id:'g3',t:'템플릿 살펴보기 · 숨은 유료 요소 지우기',p:[83,86],img:[['38_page_menu','페이지 썸네일의 점 세 개 메뉴'],['24_premium','다운로드 창에서 숨은 유료 요소 확인']],
   d:`<ul><li><b>이 템플릿으로 덮어쓰기</b>로 전부 가져오거나, 한 장만 눌러 가져와요. <b>비슷한 템플릿 보기</b>로 닮은 디자인도 찾아봐요.</li>
   <li>아래쪽 페이지 미리보기는 <b>손잡이</b>로 접고 펼 수 있어요. 접어도 페이지 메뉴로 메모 · 새 페이지 · 복제 · 위아래 이동 · 삭제를 할 수 있어요.</li></ul>
   <p class="hl">왕관이 안 보이는 템플릿이어도 <b>안쪽에 유료 요소 · 사진 · 글꼴</b>이 섞여 있을 수 있어요. 확대해서 <b>MIRICANVAS 워터마크</b>가 보이는 것을 찾아 지우면 내려받기가 돼요.</p>`,
   now:'숨은 유료 요소는 이제 <b>다운로드 창</b>에서 바로 찾을 수 있어요. "프리미엄 콘텐츠 1개"를 펼치면 어떤 요소인지 나와요. 페이지 메뉴는 아래 썸네일에 마우스를 올리면 생기는 <b>점 세 개</b>에 있고, <b>페이지 추가(Shift+Enter) · 페이지 복제(Ctrl+D) · 페이지 삭제 · 딱 맞는 페이지 찾기</b>가 있어요.',
   when:'무료 템플릿인데 내려받기가 안 될 때'},
  {id:'g4',t:'글자 고치기',p:[87,87],
   d:`<p>글자를 누르면 <b>파란 테두리</b>가 생기고 바로 고칠 수 있어요. 왼쪽에서 글꼴 · 크기 · 정렬 등을 바꿔요.</p>
   <p>템플릿 글꼴은 디자이너가 어울리게 골라 둔 거예요. <b>글꼴은 되도록 그대로</b> 쓰는 걸 권해요.</p>`},
  {id:'g5',t:'사진 올리기 · 끌어다 놓기',p:[88,91],
   d:`<ul><li>왼쪽 메뉴 맨 아래 <b>&lt;&lt;</b>를 누르면 메뉴 칸이 접혀 작업 화면이 넓어져요. 다시 누르면 펼쳐져요.</li>
   <li>업로드 메뉴를 쓰지 않아도 돼요. 컴퓨터 폴더의 사진을 <b>에디터 화면으로 끌어다 놓으면</b> 자동으로 올라가고 슬라이드에 들어가요. 원본 파일은 컴퓨터에 그대로 있어요.</li>
   <li>강사 사진, 기관 로고 같은 내 자료를 이렇게 넣어요.</li></ul>`},
  {id:'g6',t:'다른 템플릿에서 필요한 페이지만 가져오기 · 배경 맞추기',p:[92,102],
   d:`<ol><li><b>템플릿</b> 메뉴에서 비슷한 주제로 검색해요. 예: 강사 소개 페이지가 필요하면 "학원".</li>
   <li>넣을 위치의 페이지에서 점 세 개 → <b>페이지 추가</b> → 가져올 템플릿 페이지를 눌러 빈 페이지에 넣어요.</li>
   <li>배경이 다르면 통일해요. 원래 템플릿에서 내용이 적은 페이지를 <b>페이지 복제</b> → 배경만 남기고 다 지워요. (Ctrl · Shift + 클릭으로 여러 개 골라 지우기)</li>
   <li>또는 <b>배경</b> 메뉴 → 배경색 → <b>스포이드</b><span class="term">(화면에서 색을 찍어 오는 도구)</span>로 원래 배경색을 찍어 와요. 예: #dbeeb8. 찍을 위치로 옮긴 뒤 눌러야 엉뚱한 색이 안 찍혀요.</li>
   <li>장식이 안 눌리면 <b>자물쇠</b>(잠금) 때문이에요. 자물쇠를 눌러 풀면 복사 · 삭제가 돼요.</li></ol>`,
   when:'고른 템플릿에 꼭 필요한 페이지가 없을 때'},
  {id:'g7',t:'프레임으로 사진 자리 잡기',p:[102,105],
   d:`<p>02-2에서 배운 프레임을 실제 교안에 적용해요. 프레임을 넣고 사진을 끌어다 놓은 뒤, 더블클릭으로 얼굴이나 중요한 부분이 보이게 맞춰요.</p>`},
  {id:'g8',t:'표로 시간표 · 일정표 만들기',p:[105,107],img:[['34_table','표 속성 · 행 × 열, 달력 만들기']],
   d:`<ol><li>요소 → <b>표</b> → 원하는 표를 눌러요.</li>
   <li>셀을 눌러 글자를 고치고, 모서리를 끌어 크기를 바꿔요.</li>
   <li>표 테두리를 누르면 왼쪽 속성의 <b>행 × 열</b> 숫자로 줄 · 칸 수를 한 번에 바꿔요.</li>
   <li>일정표라면 <b>달력 만들기</b>를 누르거나, 요소 → 표의 <b>2026 심플 달력</b>을 써요.</li>
   <li>셀 하나를 고칠 땐 셀을 더블클릭하고, 점 세 개 메뉴로 합치기 · 행/열 추가 · 삭제를 해요.</li></ol>`,
   did:'칸이 많은 시간표는 한글 · 엑셀에서 만들어 가져왔어요.'},
  {id:'g9',t:'마무리 · 요소 더하고, 도식 넣고, 빼기',p:[108,108],
   d:`<ul><li>목적에 맞게 텍스트 · 이미지 · 도형 · 아이콘을 더해요.</li>
   <li>중복되거나 필요 없는 슬라이드는 <b>과감히 삭제</b>해요.</li>
   <li>데이터는 차트 · 도식으로 보여 줘요.</li>
   <li>템플릿 기본 구조는 지키면서 글 · 그림 · 색을 내 과목에 맞게 바꿔요.</li></ul>`}
 ]}
]},

{no:'04',name:'인공지능 기능 활용',short:'AI 도구',p:[109,182],goal:'미리캔버스 안의 AI 도구와 교재에 소개된 바깥 무료 AI 도구를 알아보고, 지금은 무엇으로 대신하는지 정리해요.',
 secs:[
 {no:'04-1',t:'인공지능 기능 활용 (미리캔버스 AI 도구)',p:[109,147],items:[
  {id:'h1',t:'미리캔버스 AI 도구 한눈에 · ai 버튼',p:[109,111],img:[['35_ai_menu','왼쪽 아래 ai 버튼 메뉴'],['07_aitool','왼쪽 AI 도구 메뉴']],
   d:`<p>에디터의 <b>AI 버튼</b>을 누르면 왼쪽에 AI 도구 메뉴가 열려요.<span class="pgi" data-a="111" data-b="111"></span></p>
   <ul><li><b>디자인에 어울리는 요소 생성</b> · 지금 슬라이드를 보고 어울리는 그림을 만들어요.</li>
   <li><b>AI 프레젠테이션</b> · 주제나 자료를 넣으면 내용과 디자인까지 만들어요.</li>
   <li><b>AI 드로잉 · AI 포토</b> · 글로 설명하면 그림 · 실사 사진을 만들어요.</li>
   <li><b>AI 라이팅</b> · 글을 써 주고 다듬어요.</li></ul>`,
   now:`지금 미리캔버스 AI는 <b>미리클(miricle AI)</b>이라는 이름으로 묶여 있고, 들어가는 곳이 두 군데예요.<ul><li><b>작업 화면 왼쪽 아래 ai 버튼</b> · 디자인 시작(AI 프레젠테이션 · 어울리는 요소 찾기 · AI SNS 게시물 · 딱 맞는 페이지 찾기 · AI 도구 · AI 제품 포스터) / AI에게 요청(<b>맞춤법 검사하기 · AI 라이팅 · AI에게 내용 피드백 받기</b>)</li><li><b>왼쪽 AI 도구 메뉴</b> · 로고 만들기, 내 작업을 이어서 AI로 생성하기(내 화면 수정 · 디자인 시안 · 어울리는 요소 · 발표 자료 4장 · 카드뉴스 4장 · 상세페이지 4장), 이미지를 편집할 수 있게 분해하기, 이미지 생성하기(아이콘 · AI 포토 · 일러스트 · 3D 아이콘 · 글자 이미지 · 배경 이미지 · 캐릭터 · 비슷한 이미지 · 명화 스타일 등), 디자인 생성하기(인포그래픽 · 포스터 · 카드뉴스 · 썸네일 · 만화), 영상 생성하기</li></ul>교재 화면과 메뉴 배치가 많이 달라요. <b>어떤 기능이 있는지</b>만 알면 돼요.`},
  {id:'h2',t:'AI 라이팅 · 글 써 주고 다듬기',p:[112,116],
   d:`<ol><li>AI 버튼 → <b>AI 라이팅</b> → 키워드나 문장을 넣으면 글을 만들어요.</li>
   <li>만든 글 · 내가 쓴 글을 골라서 <b>이어쓰기</b> · <b>요약하기</b> · <b>다시 쓰기</b>를 해요.</li>
   <li>글을 바탕으로 <b>어울리는 디자인 요소를 추천</b>받을 수도 있어요.</li></ol>`,
   now:'교재의 <b>어투 바꾸기(친근하게 · 격식 있게 · 재미있게)</b>는 지금 없어졌어요. 대신 <b>맞춤법 검사</b>와 <b>AI에게 내용 피드백 받기</b>가 생겼어요. 이 두 기능은 프레젠테이션 크기(1920×1080)에서만 보여요.'},
  {id:'h3',t:'AI 크레딧 · 무료로 얼마나 쓸까',p:[116,116],
   d:`<p><b>크레딧</b><span class="term">(AI를 쓸 때 차감되는 포인트)</span>을 써서 AI 그림을 만들어요. 교재 기준으로는 한 번 시도할 때마다 크레딧이 빠지고, 중간에 취소하거나 뒤로 가도 <b>돌려받지 못해요</b>.</p>`,
   now:'지금은 무료 계정에도 <b>매일 크레딧이 자동으로 채워져요</b>(2026년 기준 하루 200, Pro는 1,000). 그림 한 장에 드는 크레딧은 모델마다 달라요. 숫자는 자주 바뀌니 <b>"매일 조금씩 무료로 쓸 수 있다"</b>만 기억하세요.'},
  {id:'h4',t:'디자인에 어울리는 요소 만들기',p:[117,117],
   d:`<p>템플릿 슬라이드를 AI가 살펴보고 그 분위기에 어울리는 그림 요소를 만들어 줘요. 템플릿에 딱 맞는 아이콘이나 일러스트가 없을 때 써요.</p>`},
  {id:'h5',t:'그림 만드는 AI 모음',p:[118,134],
   d:`<p>원하는 그림을 <b>글로 설명</b>하면<span class="term">(이 설명 글을 프롬프트라고 해요)</span> AI가 만들어요. 사진을 꼭 올리지 않아도 돼요.</p>
   <div class="tbl"><table><tr><th>도구</th><th>하는 일</th><th>쪽</th></tr>
   <tr><td>AI 드로잉</td><td>설명대로 그림 · 일러스트 만들기</td><td><b data-a="118" data-b="120"></b></td></tr>
   <tr><td>AI 포토</td><td>실제 사진 같은 이미지 만들기</td><td><b data-a="120" data-b="121"></b></td></tr>
   <tr><td>이미지 확장</td><td>사진 바깥을 이어 그려 9:16 · 16:9로 넓히기</td><td><b data-a="121" data-b="123"></b></td></tr>
   <tr><td>로고 만들기</td><td>이름 · 분위기를 넣어 로고 시안</td><td><b data-a="123" data-b="124"></b></td></tr>
   <tr><td>비슷한 이미지</td><td>고른 그림과 닮은 그림 만들기</td><td><b data-a="125" data-b="125"></b></td></tr>
   <tr><td>일러스트 만들기</td><td>설명으로 일러스트 요소 만들기</td><td><b data-a="126" data-b="126"></b></td></tr>
   <tr><td>사진 배경 교체</td><td>인물 · 물건은 두고 배경만 새로</td><td><b data-a="126" data-b="127"></b></td></tr>
   <tr><td>캐리커처</td><td>사진을 캐리커처로</td><td><b data-a="128" data-b="128"></b></td></tr>
   <tr><td>배경 만들기</td><td>슬라이드 배경 그림 만들기</td><td><b data-a="129" data-b="131"></b></td></tr>
   <tr><td>명화 따라 그리기</td><td>명화 화풍으로 바꾸기</td><td><b data-a="131" data-b="132"></b></td></tr>
   <tr><td>캐릭터 만들기</td><td>교안용 캐릭터 만들기</td><td><b data-a="132" data-b="133"></b></td></tr>
   <tr><td>흑백 컬러 복원</td><td>흑백 사진에 색 입히기</td><td><b data-a="133" data-b="134"></b></td></tr></table></div>`,
   now:'도구 이름과 종류는 계속 바뀌고 있어요. 지금은 AI 드로잉 · AI 포토 · 흑백 컬러 복원 · 캐릭터 만들기처럼 <b>목적별로 골라 쓰는</b> 구조예요. 하나씩 따라 하기보다 <b>"이런 일도 AI로 된다"</b>를 아는 게 중요해요.'},
  {id:'h6',t:'AI 프레젠테이션 · 교안 초안 자동으로 만들기',p:[134,147],img:[['36_ai_ppt','AI 프레젠테이션 첫 화면 (2026.10)']],
   d:`<p><b>들어가는 길</b> · 새 디자인 만들기 → <b>AI 프레젠테이션 만들기</b>, 또는 에디터의 AI 버튼 → AI 프레젠테이션.<span class="pgi" data-a="134" data-b="135"></span></p>
   <div class="tbl"><table><tr><th></th><th>자료 붙여넣기</th><th>주제 입력하기</th></tr>
   <tr><td>넣는 것</td><td>강의 노트 · 수업 계획 같은 <b>내 글</b></td><td>주제 <b>한 문장</b></td></tr>
   <tr><td>교재 기준 분량</td><td>최대 2만 자</td><td>최대 100자</td></tr>
   <tr><td>쪽</td><td><b data-a="135" data-b="142"></b></td><td><b data-a="142" data-b="147"></b></td></tr></table></div>
   <ol><li>장수를 고르고 <b>개요 만들기</b>를 눌러요.</li>
   <li>개요<span class="term">(장별 제목과 내용 목록)</span>를 확인하고 고쳐요. 번호를 잡고 끌면 순서가 바뀌어요.</li>
   <li>템플릿을 골라 <b>생성하기</b> → 약 3분 기다려요.</li>
   <li>다 되면 지금 디자인에 <b>덮어쓰기</b>하거나 <b>새 디자인</b>으로 열어요.</li></ol>`,
   now:`지금은 교재의 "자료 붙여넣기 / 주제 입력하기" 두 갈래가 <b>입력창 하나</b>로 합쳐진 <b>3단계</b>예요.<ol><li><b>입력</b> · "어떤 프레젠테이션을 만들까요?" 창에 주제 한 줄이나 내 글(최대 2만 자)을 넣고, 장수를 <b>6~30장</b> 사이로 정해요.</li><li><b>개요 다듬기</b> · 나온 개요를 직접 고치거나 채팅으로 고쳐 달라고 해요.</li><li><b>디자인 선택</b> · 템플릿을 고르고 생성 → 약 3분.</li></ol>창 위에 <b>"월간 무료 체험 3회 남음"</b>이 보여요. <b>내용 첨부하기</b>(파일 올리기)는 왕관, 유료예요. 파일 내용으로 만들고 싶으면 노트북LM · 제미나이로 정리한 글을 입력창에 <b>붙여 넣으면</b> 돼요. 만든 결과는 <b>PPTX로 내려받아</b> 파워포인트에서 이어 고칠 수 있어요.`,
   did:'내 과목 자료로 AI 프레젠테이션 초안을 만들고, 내 자료와 비교해 고쳤어요.'}
 ]},
 {no:'04-2',t:'인공지능 기능 활용 (무료 생성형 AI 도구 활용)',p:[147,182],items:[
  {id:'i1',t:'바깥 무료 AI 도구 고르는 법',p:[148,153],
   d:`<p>미리캔버스 AI가 무료로는 제한이 있어서, 교재는 바깥 무료 도구를 함께 소개해요. 고를 때 보는 순서는 이래요.</p>
   <ol><li><b>기능</b> · 내가 필요한 일(배경 지우기, 그림 만들기, PPT 만들기)을 하는지</li><li><b>사용 제한</b> · 하루 · 한 달 횟수, 화질, 라이선스</li><li><b>쓰기 편한지</b> · 한국어 지원, 화면</li><li><b>결과 품질</b> · 선명도, 일관성</li></ol>`,
   fix:'교재의 도구별 숫자(하루 몇 회, 한 달 몇 크레딧 등)는 <b>교재를 쓸 때 기준</b>이에요. 지금은 대부분 바뀌었어요. <b>도구 이름 ↔ 하는 일</b>만 짝지어 기억하세요.'},
  {id:'i2',t:'배경 지우기 · 리무브비지, 픽슬러',p:[154,159],
   d:`<ul><li><b>리무브비지(remove.bg)</b> · 검색창에 "리무브비지" → 로그인 없이 사진을 올리면 인물 · 제품 · 동물의 <b>배경을 자동으로 지워요</b>. 무료는 일반 화질로 받아요.</li>
   <li><b>픽슬러(Pixlr) 배경 제거</b> · "픽슬러" 검색 → Remove background → 사진 선택. 끌어다 놓기는 안 되고 파일을 골라야 해요. 받기 버튼이 번역 때문에 <b>"구하다"(SAVE)</b>로 보여요.</li>
   <li>교재는 두 도구의 화질을 비교해요. 원본보다 크기가 줄 수 있으니 결과를 꼭 확인해요.</li></ul>`},
  {id:'i3',t:'어도비 익스프레스',p:[160,162],
   d:`<p>어도비의 온라인 디자인 도구예요. 글로 설명해 <b>이미지 만들기</b>, <b>배경 제거</b>, 색 보정 · 크기 조정 같은 편집을 해요. 회원 가입 후 무료로 일정 횟수를 써요.</p>`},
  {id:'i4',t:'MS 디자이너(마이크로소프트 디자이너)',p:[162,168],
   d:`<p>글로 설명하면 디자인 · 이미지를 <b>여러 장 한 번에</b> 만들어 줘요. <b>무료 · 온라인</b>이고 <b>한국어</b>도 돼요. 배경 제거 등 <b>이미지 편집</b>도 할 수 있어요.</p>`},
  {id:'i5',t:'뤼튼',p:[168,172],
   d:`<p>한국어에 맞춘 AI 서비스예요. 챗봇처럼 대화하고, 이미지를 만들고, <b>PPT 초안</b>도 만들어요. 교재에는 PPT 초안을 만드는 과정과 결과 예시가 있어요.</p>`},
  {id:'i6',t:'감마',p:[172,178],
   d:`<p>글만 넣으면 <b>PPT를 자동으로</b> 만들어 주는 도구예요. 디자인과 이미지까지 함께 만들고, 조건에 맞으면 상업적 사용도 가능해요. 크레딧을 써서 생성해요.</p>`},
  {id:'i7',t:'냅킨 AI · 글로 도식 만들기',p:[178,182],
   d:`<p>글을 넣으면 그 내용을 <b>도식</b><span class="term">(상자와 화살표 그림)</span>으로 바꿔 줘요. 이미 쓴 글을 넣는 방법과 주제만 넣는 방법이 있어요.</p>`},
  {id:'i8',t:'지금은 이렇게 · 노트북LM과 제미나이로',p:null,isnew:true,
   d:`<p>교재의 바깥 도구들은 가입과 화면 설명이 대부분이에요. <b>따라 할 필요는 없어요</b>. 우리 수업에서는 같은 일을 <b>노트북LM · 제미나이</b> 하나로 했어요.</p>
   <div class="tbl"><table><tr><th>교재 도구</th><th>하던 일</th><th>지금은</th></tr>
   <tr><td>뤼튼 · 감마</td><td>PPT 초안 만들기</td><td>노트북LM <b>슬라이드</b> → <b>PPTX</b>로 내보내기</td></tr>
   <tr><td>냅킨</td><td>글로 도식 만들기</td><td>노트북LM <b>인포그래픽</b></td></tr>
   <tr><td>MS 디자이너 · 어도비</td><td>그림 만들기</td><td>제미나이 이미지 만들기 · 미리캔버스 AI</td></tr>
   <tr><td>(없음)</td><td>복습 자료</td><td>노트북LM <b>퀴즈 · 플래시카드 · 오디오 · 동영상 요약</b></td></tr></table></div>`,
   did:'내 자료를 노트북에 넣고 장표 내용 → 디자인 프롬프트 → 슬라이드 → PPTX → 인포그래픽까지 뽑아 봤어요.'}
 ]}
]},

{no:'05',name:'멀티미디어, 클라우드 배포',short:'영상 · 배포',p:[183,192],goal:'교안에 유튜브 · 동영상 · 음악을 넣고, 완성한 교안을 저장하고 나눠 주는 방법을 알아봐요.',
 secs:[
 {no:'05-1',t:'멀티미디어 첨부',p:[183,186],items:[
  {id:'j1',t:'유튜브 영상 넣기',p:[184,186],img:[['11_video','동영상 메뉴'],['12_youtube','유튜브 칸 · URL 넣고 만들기']],
   d:`<ol><li>유튜브 영상에서 <b>공유</b> → 주소(URL) <b>복사</b>. 짧은 주소도 돼요.</li>
   <li>미리캔버스 왼쪽 <b>동영상</b> 메뉴 → 위쪽 <b>유튜브</b> 칸 → URL 칸에 붙여넣기 → <b>만들기</b>. 오른쪽 <b>유튜브로 이동</b>을 누르면 유튜브가 새 탭으로 열려요.</li>
   <li>슬라이드에 영상이 들어가요. 크기 · 위치를 맞추고 시작 시점 · 자동 재생 · 음소거 등을 정해요.</li></ol>
   <p>영상을 파일로 받아 올릴 필요 없이 <b>링크만</b> 있으면 돼요.</p>`,
   now:'동영상 메뉴 위쪽에 <b>미리캔버스로 동영상 만들기</b>(저작권 걱정 없는 영상)와 <b>무료 AI 도구</b>(이미지로 AI 영상 · 텍스트로 AI 영상 · AI 애니메이션)가 생겼어요. 직접 올린 영상은 그 장에 들어가면 <b>자동 재생</b>되니 한 장에 하나씩, 유튜브 링크는 <b>버튼을 눌러 재생</b>해서 여러 개 넣어도 돼요.',
   did:'유튜브 링크로 영상을 넣어 봤어요.'},
  {id:'j1b',t:'디자인 에디터 ↔ 동영상 에디터',isnew:true,img:[['37_video_editor','동영상 에디터로 바꾼 아래 막대 · 장마다 5초']],
   d:`<p>교재에는 없는 새 기능이에요. 아래 막대 오른쪽 <b>디자인 에디터</b>를 누르면 <b>동영상 에디터</b>로 바뀌어요.</p><ul><li>페이지들이 <b>시간 막대</b>처럼 이어지고, 장마다 <b>재생 시간(기본 5초)</b>이 붙어요. 왼쪽 재생 버튼으로 전체를 영상처럼 미리 봐요.</li><li>이렇게 만든 디자인은 다운로드에서 <b>MP4</b>로 받아 짧은 홍보 영상이나 수업 안내 영상으로 써요.</li><li>다시 누르면 디자인 에디터로 돌아와요.</li></ul>`,
   when:'교안을 짧은 안내 영상으로도 만들고 싶을 때'},
  {id:'j2',t:'내 동영상 파일 올리기',p:[184,184],
   d:`<ul><li>되는 파일 · <b>MP4, MOV</b> · 크기 <b>100MB까지</b> · 1920×1080 권장.</li>
   <li>동영상 메뉴 → <b>내 동영상 업로드</b> → 파일 고르기 또는 끌어다 놓기.</li>
   <li>재생 · 일시정지 · 음소거, 보여 줄 <b>구간 정하기</b>, 자동 재생을 설정해요.</li></ul>`,
   when:'직접 찍은 실습 영상을 교안에 넣고 싶을 때'},
  {id:'j3',t:'음악 · 오디오 넣기',p:[185,185],
   d:`<ul><li>되는 파일 · <b>MP3, M4A</b> · 교재 기준 무료 50MB, 10분까지.</li>
   <li>음악 메뉴 → 음악 추가 → 파일 고르기 또는 끌어다 놓기.</li>
   <li><b>배경음악</b>으로 정하면 전체 또는 일부 슬라이드에 깔려요.</li></ul>`,
   now:'새 에디터에서 <b>배경음악(BGM) 넣기와 편집</b>이 더 좋아졌어요.'},
  {id:'j4',t:'저장과 내보내기',p:[185,185],
   d:`<ul><li><b>자동 저장</b>이 기본이에요.</li>
   <li>햄버거 메뉴의 <b>버전 기록</b>에서 지난 작업 내역을 보고 되돌릴 수 있어요.</li>
   <li>전체 또는 고른 페이지만 <b>PDF</b>로, 이미지(JPG · PNG)로 내보내요. 용도에 맞게 웹용 · 인쇄용을 골라요.</li></ul>`,
   now:'교재는 "자동 저장을 켜고 끌 수 있다"고 하지만, 지금은 <b>실시간 자동 저장</b>이라 따로 신경 쓸 게 없어요.'}
 ]},
 {no:'05-2',t:'클라우드 배포',p:[187,192],items:[
  {id:'k1',t:'공유 설정 · 누가, 어디까지',p:[187,188],
   d:`<ul><li><b>공개 범위</b>를 정하고, 무료로도 <b>비밀번호</b>를 걸 수 있어요.</li>
   <li>원본 복제 허용 · 좋아요 · 댓글 · 공유 버튼 · 슬라이드쇼 같은 맞춤 설정은 유료예요.</li>
   <li>함께 고칠 사람은 <b>초대할 때 편집 권한</b>을 줘요. 페이지 <b>메모</b>로 의견을 남겨요.</li></ul>`},
  {id:'k2',t:'구글 드라이브 · 네이버 마이박스로 나눠 주기',p:[188,191],
   d:`<ul><li><b>구글 드라이브</b> · drive.google.com → <b>+ 신규</b> → 파일 · 폴더 업로드(끌어다 놓기도 돼요) → 오른쪽 클릭 <b>공유</b> → 링크 권한(뷰어 · 댓글 작성자 · 편집자).<span class="pgi" data-a="188" data-b="189"></span></li>
   <li><b>네이버 마이박스</b> · 파일 올리기 · 폴더 관리 · 링크 공유 · 비밀번호 · 저장 공간 확인.<span class="pgi" data-a="190" data-b="191"></span></li>
   <li>폴더는 업무 · 과정별로, 파일 이름은 찾기 쉽게 정해요.</li></ul>`,
   now:'교안을 나눠 줄 땐 <b>미리캔버스 공유 링크</b>가 가장 간단해요. 고친 내용이 바로 반영되거든요. 드라이브는 <b>PDF 파일</b>을 따로 나눠 줄 때만 써도 충분해요.',
   did:'미리캔버스 링크를 패들렛에 올려 함께 봤어요.'},
  {id:'k3',t:'업로드 · 재생이 안 될 때, 파일 가볍게',p:[191,192],
   d:`<ul><li>올리기가 안 되면 · 파일 크기 확인 → 인터넷 연결 확인 → 브라우저 임시 파일(캐시) 지우기 → <b>다른 브라우저</b>로 시도.</li>
   <li>재생이 안 되면 · 최신 크롬 · 사파리인지 확인 → 새로고침.</li>
   <li>파일을 가볍게 · 동영상은 H.264, 오디오는 AAC, 이미지는 웹용 형식으로 줄이면 빨리 열려요.</li></ul>`}
 ]}
]},

{no:'06',name:'실제 교안 제작 및 FAQ',short:'교안 완성',p:[193,233],goal:'내 교안을 기획하고 만들고, 점검 목록으로 다듬은 뒤, PPT와 비교하며 마무리해요.',
 secs:[
 {no:'06-1',t:'교안 제작 실습 (기획 및 제작)',p:[193,201],items:[
  {id:'l1',t:'실습 흐름 · 템플릿에서 내 교안까지',p:[193,193],
   d:`<div class="flow"><span>① 템플릿 활용</span><i>→</i><span>② 내 과목에 맞추기</span><i>→</i><span>③ 그림 · 글 · 프레임으로 꾸미기</span><i>→</i><span>④ 의견 받고 고치기</span></div>
   <p>인포그래픽 · 차트 · 도식을 적극적으로 써서 훈련생이 한눈에 이해하게 만들어요.</p>`},
  {id:'l2',t:'교안의 기본 재료 · 프레임, 사진, 텍스트 상자',p:[194,195],
   d:`<ul><li><b>프레임</b> · 사진 자리를 잡는 틀. 정렬 · 크기 · 겹치기로 레이아웃을 만들어요.</li>
   <li><b>사진</b> · 무료/유료 구분, 내 사진 올리기, 크기 · 회전 · 필터 · 투명도.</li>
   <li><b>텍스트 상자</b> · <b>상자를 먼저 만들고 → 위치를 정해요</b>. 여러 개 만들 수 있고, 방향 · 글꼴 · 정렬은 자유예요.</li></ul>
   <p>교안에 쓰는 재료는 <b>프레임 · 텍스트 상자 · 멀티미디어 · 사진</b>이에요. 워드 · 엑셀 · PDF · PPT 파일 자체는 요소가 아니에요.</p>`},
  {id:'l3',t:'도형 · 아이콘 · 선 · 차트',p:[195,195],
   d:`<ul><li><b>도형</b> · 원 · 사각형 · 삼각형을 넣고 <b>크기와 색</b>을 바꿔요. 여러 개를 조합해 그림을 만들어요.</li>
   <li><b>아이콘</b> · 검색해서 넣고 크기 · 색을 교안에 맞춰요.</li>
   <li><b>선 · 화살표</b> · 개념 사이 연결과 흐름을 보여 줘요.</li>
   <li><b>차트</b> · 숫자는 그래프로.</li></ul>`},
  {id:'l4',t:'색 고르기와 배치',p:[196,196],
   d:`<ul><li><b>보색</b><span class="term">(반대 색)</span>은 강조, <b>유사색</b><span class="term">(이웃 색)</span>은 조화.</li>
   <li>기관 대표 색을 제목 · 강조 · 배경에 일관되게 써요. 자주 쓰는 색은 <b>헥사코드</b><span class="term">(#1d6fb8 같은 색 번호)</span>로 적어 두면 정확해요.</li>
   <li>격자에 맞춰 정렬하고, <b>여백</b>을 넉넉히, 글 · 그림 · 도형의 <b>균형</b>을 맞추고, 전체를 <b>일관되게</b>.</li></ul>`},
  {id:'l5',t:'애니메이션 · 영상 · 링크',p:[197,197],
   d:`<ul><li><b>애니메이션</b> · 나타나기 · 밀기 · 확대 등. 시작 시간 · 길이 · 순서를 정해요. <b>너무 많이 쓰면</b> 오히려 산만해요.</li>
   <li><b>영상 · 오디오</b> · 05장 방법으로 넣어요.</li>
   <li><b>하이퍼링크</b> · 글이나 그림에 링크를 걸어 추가 자료로 연결해요.</li>
   <li>퀴즈 · 설문 같은 참여 요소도 넣어 보세요.</li></ul>`},
  {id:'l6',t:'템플릿을 내 것으로 · 내용 구성 · 디자인 요령',p:[198,199],
   d:`<ul><li>템플릿의 <b>기본 구조는 지키고</b>, 색 · 글꼴 · 요소를 내 과목에 맞게 바꿔요.</li>
   <li>장마다 <b>학습 목표</b>를 분명히 하고, 목표에 맞는 내용만 담아요.</li>
   <li>쉬운 것 → 어려운 것 순서로 흐름을 만들고, 핵심어는 굵게 · 번호 · 강조색으로.</li>
   <li><b>일관성 · 여백 · 대비</b> 세 가지만 지켜도 깔끔해져요.</li></ul>`},
  {id:'l7',t:'완성 전 확인 · 공유 · 발표',p:[199,201],
   d:`<ol><li><b>전체 미리보기</b>로 흐름 확인 → PC · 태블릿 · 휴대폰에서 보이는 모습 확인 → <b>오타</b> 확인.</li>
   <li><b>공유</b> 기능으로 동료 · 훈련생과 나누고, <b>댓글 · 메모</b>로 의견을 받아요. 여러 명이 동시에 고칠 수도 있어요.</li>
   <li>위 막대 <b>슬라이드쇼</b>를 눌러 발표해요.</li>
   <li>훈련생에게는 <b>PDF</b>나 이미지로 나눠 줘요.</li>
   <li>수업 뒤 반응과 의견을 모아 계속 고쳐요.</li></ol>`,
   did:'AI 초안을 내 자료와 비교해 고치고, 링크로 공유했어요.'}
 ]},
 {no:'06-2',t:'교안 제작 실습 (보완 및 피드백)',p:[201,217],items:[
  {id:'m1',t:'표지 · 본문 · 마무리 점검 목록',p:[202,204],
   d:`<div class="tbl"><table><tr><th>부분</th><th>스스로 물어보기</th></tr>
   <tr><td><b>표지 · 도입</b></td><td>과정명이 분명한가? 강의 제목이 흥미로운가? 강사 정보 · 교육 일시가 있나? 학습 목표 · 목차 · 미리 알아야 할 것이 있나?</td></tr>
   <tr><td><b>본문</b></td><td>주제별로 나눴나? 페이지 제목이 내용과 맞나? 훈련생 수준에 맞나? 쉬운 것부터인가? 어려운 말을 풀어 썼나? 현장 예시가 있나? 핵심이 눈에 띄나?</td></tr>
   <tr><td><b>마무리</b></td><td>핵심을 요약했나? 목표에 닿았는지 확인할 방법이 있나? 더 볼 자료 · 다음 시간 안내 · 질문 시간이 있나?</td></tr></table></div>`,
   when:'교안을 다 만들고 마지막으로 훑어볼 때'},
  {id:'m2',t:'글자 · 그림 · 색 기준',p:[204,206],
   d:`<ul><li><b>글자</b> · 멀리서도 읽히는 글꼴, <b>제목 28pt 이상 · 본문 18~24pt</b>, 배경과 대비 충분히, 한 장에 핵심 문장 <b>3~5개</b>, 줄 간격 · 들여쓰기 일정하게.</li>
   <li><b>그림 · 도표</b> · 선명한 이미지, 알맞은 크기, 설명 글(캡션), 그래프 단위 표시, <b>출처 · 저작권 확인</b>.</li>
   <li><b>색</b> · 기관 색 일관되게, 글과 배경 대비, <b>색약인 사람도 구분</b>되는 조합, 핵심만 색으로 강조.</li></ul>`,
   did:'색 2~3가지 · 글꼴 2가지 · 한 장에 한 메시지로 다듬었어요.'},
  {id:'m3',t:'동영상 · 오디오 점검',p:[206,207],
   d:`<ul><li><b>동영상</b> · 끊김 없이 재생되나, 화질 · 소리가 깨끗한가, 자막이 정확한가, 길이가 적당한가, 크기가 너무 크지 않은가.</li>
   <li><b>오디오</b> · 소리가 선명한가, 크기가 일정한가, 배경음악이 말소리를 덮지 않는가, 잡음이 없는가.</li></ul>`},
  {id:'m4',t:'훈련생 참여 · 이해 확인',p:[208,209],
   d:`<ul><li>질문 · 토론 · 아이디어 나누기 시간이 있나?</li>
   <li>배운 것을 직접 해 보는 <b>실습</b>이 충분한가?</li>
   <li>간단한 퀴즈나 스스로 점검하기로 <b>이해했는지 확인</b>하나?</li>
   <li>수준에 따라 보충 · 심화 자료가 있나? 훈련생 의견을 받을 방법이 있나?</li>
   <li>훈련생 수준과 특성을 보고 수업 방식을 정했나?</li></ul>`},
  {id:'m5',t:'보관과 배포 준비',p:[210,210],
   d:`<ul><li>최종본에 <b>버전 번호</b>를 붙이고, 클라우드와 내 컴퓨터에 <b>이중 백업</b>.</li>
   <li>고친 내용을 날짜별로 적어 두고, 참고 자료 · 영상 파일을 정리해요.</li>
   <li>PDF · PPT 등 필요한 형식으로 준비하고, 나눠 줄 범위를 정하고, 저작권 정보를 표시해요.</li></ul>`},
  {id:'m6',t:'교안 완성도 높이기 가이드',p:[211,217],
   d:`<p>표지 · 본문 · 글자 · 색 · 영상 · 참여 요소를 한 번 더 점검하는 목록이에요. 앞의 점검 목록과 내용이 거의 같아요.</p>`,
   fix:'비슷한 목록이 두 번 나와요. <b><b data-a="202" data-b="209"></b>의 질문형 목록</b>만 써도 충분해요.'}
 ]},
 {no:'06-3',t:'정리 및 FAQ',p:[218,233],items:[
  {id:'n1',t:'PPT와 미리캔버스 비교',p:[220,226],
   d:`<div class="tbl"><table><tr><th>파워포인트</th><th>미리캔버스</th></tr>
   <tr><td>내 컴퓨터에 저장 · 인터넷 없이 작업 · 익숙한 화면<br><b>슬라이드 마스터 · 화면 전환 · 세밀한 애니메이션 · 매크로</b><br>파일이 크고 함께 작업하기 불편</td>
   <td><b>클라우드</b> 저장 · 어디서나 · 쉬운 화면<br><b>전문가 템플릿 · 실시간 저장 · AI 추천 · 간편한 이미지 편집</b><br>링크 공유 · 실시간 함께 작업</td></tr></table></div>
   <p>두 도구는 경쟁이 아니라 <b>짝꿍</b>이에요. 미리캔버스로 빠르게 만들고, 필요하면 PPTX로 받아 파워포인트에서 마무리해요.</p>`,
   did:'패들렛에 결과물을 모아 함께 보고, 처음에 적은 내 목표를 다시 확인했어요.'},
  {id:'n2',t:'처음부터 끝까지 한 번에',p:[220,223],
   d:`<div class="flow"><span>계정 만들기</span><i>→</i><span>로그인</span><i>→</i><span>템플릿 고르기</span><i>→</i><span>내 내용 넣기</span><i>→</i><span>공유</span></div>

const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const grp=s=>{const c=s.charCodeAt(0);if(c>=0xAC00&&c<=0xD7A3){const g=CHO[Math.floor((c-0xAC00)/588)];return ({'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ'})[g]||g}return 'A~Z'};
function renderFind(q){
  q=(q||'').trim().toLowerCase();
  const list=INDEX.filter(x=>!q||x[0].toLowerCase().includes(q)||ITEM[x[1]].it.t.toLowerCase().includes(q)).sort((a,b)=>{const ga=grp(a[0]),gb=grp(b[0]);if(ga!==gb){if(ga==='A~Z')return 1;if(gb==='A~Z')return -1}return a[0].localeCompare(b[0],'ko')});
  let h='',g='';list.forEach(x=>{const r=ITEM[x[1]];const gg=grp(x[0]);if(gg!==g){g=gg;h+=`<div class="fg">${g}</div>`}h+=`<div class="fi" data-item="${x[1]}">${x[0]}<span class="fc">${CH[r.ci].no}장</span><span class="fp">${r.it.p?pt(r.it.p[0],r.it.p[1]):'새 내용'}</span></div>`});
  document.getElementById('fl').innerHTML=h||'<p style="color:var(--sub)">찾는 이름이 없어요. 다른 말로 넣어 보세요.</p>';
}
function build(){

  renderFind('');
  document.getElementById('q').addEventListener('input',e=>renderFind(e.target.value));
  document.querySelectorAll('.pgi').forEach(el=>el.textContent='📖 '+pt(+el.dataset.a,+el.dataset.b));

  else side.innerHTML=`<h4>찾기</h4><a class="it" href="#" data-t="find">기능 이름으로 찾기</a>`+CH.map((c,ci)=>`<a class="sh" href="#" data-go="${ci+1}">${c.no} ${c.name}</a>`).join('');
  document.getElementById('where').textContent=`${s.no} · ${s.name} · ${edL()}`;
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').textContent=cur===STEPS.length-1?'처음으로 ↺':'다음 →';
  if(scroll!==false)toTop();
  if(s.id==='home'&&window.__sceneResize)setTimeout(window.__sceneResize,50);
}
function toTop(){const tb=document.querySelector('.topbar');const y=main.getBoundingClientRect().top+window.scrollY-tb.offsetHeight-8;window.scrollTo({top:Math.max(0,y),behavior:'smooth'})}
function goTo(id){const el=document.getElementById(id);if(!el)return;el.scrollIntoView({behavior:'smooth',block:'start'});if(el.classList.contains('item')){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}}

function setEd(v){ed=v;document.querySelectorAll('.ed').forEach(b=>b.classList.toggle('on',+b.dataset.ed===ed));
  document.querySelectorAll('b[data-a]').forEach(b=>{b.textContent=pt(+b.dataset.a,+b.dataset.b)});
  document.querySelectorAll('.pgi').forEach(el=>el.textContent='📖 '+pt(+el.dataset.a,+el.dataset.b));
  renderFind(document.getElementById('q').value);
  document.getElementById('where').textContent=`${STEPS[cur].no} · ${STEPS[cur].name} · ${edL()}`;
  if(window.__cap)window.__cap();}
build();setEd(0);show(0,false);
document.addEventListener('click',e=>{
  const t=e.target.closest('.tab');if(t){show(+t.dataset.i);return}
  const b=e.target.closest('.ed');if(b){setEd(+b.dataset.ed);return}
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();show(+g.dataset.go);return}
  const fg=e.target.closest('.shots figure');if(fg){fg.classList.toggle('zoom');return}
  const it=e.target.closest('[data-item]');if(it){e.preventDefault();goItem(it.dataset.item);return}
  const a=e.target.closest('.side a[data-t]');if(a){e.preventDefault();goTo(a.dataset.t);document.querySelectorAll('.side a').forEach(x=>x.classList.toggle('on',x===a))}
