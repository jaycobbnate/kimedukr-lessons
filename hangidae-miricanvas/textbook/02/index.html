<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>02장 교안 작성 툴 기능의 이해 · 온라인 교재</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--fs:21px;--bg:#fbfbf8;--line:#e3e5e8;--ink:#1f2933;--sub:#5b6673;--point:#1d6fb8;--point-soft:#e9f2fb;--fix:#6a4fa0;--fix-soft:#f3effa;--ok:#2f7a4b;--ok-soft:#ecf6ef;--st:#1f7a6d;--st-soft:#e7f4f1;--mo:#3f55a6;--mo-soft:#eef0fb;--job:#4a5866;--job-soft:#f1f4f7;--book:#f4f6f8}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.65;word-break:keep-all}
button,input{font-family:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding:24px 20px 14px;border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:center}
.hero .big{font-size:3rem;font-weight:900;color:var(--point);line-height:1}
.hero small{color:var(--point);font-weight:700;font-size:.8rem}
.hero h1{margin:2px 0 2px;font-size:1.4rem;line-height:1.3}
.hero p{margin:0;color:var(--sub);font-size:.86rem}
.hero .hp{margin-left:auto;text-align:right;font-size:1.2rem;font-weight:800;color:var(--point);white-space:nowrap}
.hero .hp small{display:block;color:var(--sub);font-weight:600;font-size:.7rem}

.topbar{position:sticky;top:0;z-index:20;background:rgba(251,251,248,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(4px)}
.topbar .wrap{display:flex;align-items:center;gap:10px;padding-top:9px;padding-bottom:9px}
.tabs{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:thin}
.tab{flex:none;border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;padding:.28rem .75rem;font-size:.76rem;cursor:pointer;white-space:nowrap}
.tab b{color:var(--point);margin-right:.3rem}
.tab.on{background:var(--point);border-color:var(--point);color:#fff}.tab.on b{color:#fff}
.tools{display:flex;gap:6px;align-items:center;flex:none}
.tools button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:.25rem .6rem;font-size:.78rem;cursor:pointer;color:var(--ink)}
.tools .ed.on{background:var(--point-soft);border-color:var(--point);color:var(--point);font-weight:700}

.layout{display:grid;grid-template-columns:1fr 260px;gap:24px;padding-top:20px;padding-bottom:26px}
#main{min-width:0}
.side{position:sticky;top:78px;align-self:start;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;max-height:calc(100vh - 160px);overflow:auto}
.side h4{margin:0 0 6px;font-size:.78rem;color:var(--sub);font-weight:600}
.side .sh{display:block;margin:.55rem 0 .1rem;padding:.2rem .5rem;font-size:.76rem;font-weight:800;color:var(--point);text-decoration:none;border-radius:8px}
.side .sh.cur{background:var(--point-soft)}
.side a.it{display:flex;gap:.4rem;padding:.26rem .5rem;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.76rem;line-height:1.35}
.side a.it i{font-style:normal;color:var(--point);font-weight:700;flex:none;min-width:1.1rem}
.side a.it:hover,.side a.it.on,.side .sh:hover{background:var(--point-soft);color:var(--point)}

.step{display:none}.step.on{display:block}
.sech{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin:0 0 14px;padding:0 0 8px;border-bottom:2px solid var(--point);font-size:1.15rem;scroll-margin-top:80px}
.sech .sn{color:var(--point);font-weight:900}
.sech .sp{margin-left:auto;font-size:.82rem;color:var(--point);font-weight:700}
.secintro{color:var(--sub);font-size:.9rem;margin:-6px 0 14px}

.item{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:16px;scroll-margin-top:80px;overflow:hidden}
.item>header{display:flex;align-items:center;gap:.7rem;padding:14px 20px 0}
.item h3{margin:0;font-size:1.1rem;line-height:1.35;flex:1;display:flex;gap:.6rem;align-items:center}
.num{flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--point);color:#fff;display:grid;place-items:center;font-size:.8rem;font-weight:700}
.item.isnew .num{background:var(--ok)}
.pgc{flex:none;background:var(--point-soft);color:var(--point);border-radius:999px;padding:.15rem .75rem;font-weight:800;font-size:.9rem;white-space:nowrap}
.pgc.nw{background:var(--ok-soft);color:var(--ok)}
.body{padding:8px 22px 4px 62px;font-size:.98rem}
.body p{margin:.35rem 0 .55rem}
.body ul,.body ol{margin:.3rem 0 .6rem;padding-left:1.25rem}
.body li{margin:.28rem 0}
.body b{color:#0f4c86}
.body h4.sub{margin:1rem 0 .3rem;font-size:1rem;color:var(--point);border-top:1px dashed var(--line);padding-top:.7rem}
.term{color:var(--sub);font-size:.84em}
.pgi{display:inline-block;margin-left:.4rem;background:var(--book);border:1px solid var(--line);color:var(--sub);border-radius:999px;padding:0 .5rem;font-size:.72rem;font-weight:600;vertical-align:1px}
.tbl{overflow-x:auto;margin:.4rem 0 .7rem}
table{border-collapse:collapse;width:100%;font-size:.9rem;background:#fff}
th,td{border:1px solid var(--line);padding:.45rem .6rem;text-align:left;vertical-align:top}
th{background:var(--book);font-weight:700;color:var(--sub);font-size:.84rem}
b[data-a]{white-space:nowrap}

.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:.6rem 0 .8rem;align-items:start}
.shots figure{margin:0;background:var(--book);border:1px solid var(--line);border-radius:12px;padding:8px;cursor:zoom-in}
.shots figure.w,.shots figure.zoom{grid-column:1/-1}
.shots figure.zoom{cursor:zoom-out}
.shots img{display:block;max-width:100%;height:auto;margin:0 auto;border-radius:8px;background:#fff}
.shots figure.w img,.shots figure.zoom img{width:100%}
.shots figure:not(.w):not(.zoom) img{max-height:420px;object-fit:contain}
.shots figcaption{font-size:.74rem;color:var(--sub);margin-top:6px;line-height:1.4}

.boxes{display:grid;gap:8px;padding:6px 22px 18px 62px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bx{border-radius:12px;padding:.6rem .85rem;font-size:.9rem;line-height:1.55;display:flex;gap:.6rem}
.bx .ic{flex:none;font-size:1rem}
.bx .lb{display:block;font-weight:800;font-size:.78rem;margin-bottom:.1rem}
.bx.now{background:var(--point-soft)}.bx.now .lb,.bx.now b{color:#0f4c86}
.bx.fix{background:var(--fix-soft)}.bx.fix .lb,.bx.fix b{color:var(--fix)}
.bx.st{background:var(--st-soft)}.bx.st .lb,.bx.st b{color:var(--st)}
.bx.mo{background:var(--mo-soft)}.bx.mo .lb,.bx.mo b{color:var(--mo)}
.bx.job{background:var(--job-soft)}.bx.job .lb,.bx.job b{color:var(--job)}
.bx.pr{background:#fff;border:2px solid var(--point)}.bx.pr .lb,.bx.pr b{color:var(--point)}
.bx.did{background:var(--ok-soft)}.bx.did .lb,.bx.did b{color:var(--ok)}
.bx.when{background:#fff;border:1px dashed #c9d1da}.bx.when .lb{color:var(--sub)}

.more{border:1px solid var(--line);border-radius:12px;background:#fff}
.more summary{cursor:pointer;padding:.5rem .85rem;font-size:.86rem;font-weight:700;color:var(--sub);list-style:none;display:flex;gap:.5rem;align-items:center}
.more summary::-webkit-details-marker{display:none}
.more summary span{margin-left:auto;font-size:.76rem;color:var(--point);font-weight:600}
.more[open] summary span{font-size:0}.more[open] summary span::after{content:'접기';font-size:.76rem}
.more summary:hover{background:var(--point-soft);border-radius:12px}
.mbody{display:grid;gap:8px;padding:0 10px 10px}
.edl{font-size:.74rem;color:var(--sub);font-weight:700;white-space:nowrap}
.ref{background:var(--book);border-left:3px solid var(--point);border-radius:0 10px 10px 0;padding:.45rem .8rem;font-size:.88rem;color:var(--sub)}
.ref b{color:var(--point)}
.ba{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:.6rem 0 .8rem}
.ba .ar{font-size:1.6rem;color:var(--point);font-weight:900}
.sl{aspect-ratio:16/9;border:1px solid var(--line);border-radius:10px;background:#fff;padding:5%;display:flex;flex-direction:column;gap:5%;font-size:.62rem;line-height:1.35;overflow:hidden}
.sl.old p{margin:0;color:#333}.sl.old h5{margin:0;font-size:.85rem}
.sl.nw{background:linear-gradient(135deg,#eef5fc,#fff)}.sl.nw h5{margin:0;font-size:1rem;color:var(--point)}
.sl .row{display:flex;gap:6%;flex:1}.sl .stp{flex:1;background:#fff;border:1px solid #d6e4f2;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;color:#0f4c86}
.sl .stp i{font-style:normal;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--point);color:#fff;display:grid;place-items:center;font-size:.7rem}
.ba figcaption{grid-column:1/-1;font-size:.74rem;color:var(--sub);text-align:center}
@media (max-width:640px){.ba{grid-template-columns:1fr}.ba .ar{transform:rotate(90deg);justify-self:center}}
/* 절 끝 · 해 볼 것 */
.check{background:#fff;border:2px solid var(--point);border-radius:16px;padding:16px 20px;margin:4px 0 20px}
.check h3{margin:0 0 4px;font-size:1.05rem;color:var(--point)}
.check p{margin:0 0 8px;color:var(--sub);font-size:.85rem}
.check label{display:flex;gap:.6rem;align-items:flex-start;padding:.4rem .5rem;border-radius:10px;cursor:pointer;font-size:.92rem}
.check label:hover{background:var(--point-soft)}
.check input{width:1.1rem;height:1.1rem;margin-top:.3rem;accent-color:var(--point);flex:none}
.check label.done span{color:var(--sub);text-decoration:line-through}
.check .cnt{font-weight:800;color:var(--point)}

/* 처음 화면 */
.scene-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px}
.scene-box h3{margin:0 0 2px;font-size:1.05rem}.scene-box p{margin:0 0 8px;color:var(--sub);font-size:.85rem}
#scene{position:relative;width:100%;height:330px;border-radius:12px;overflow:hidden;background:linear-gradient(#f7fafd,#eef3f8)}
#scene canvas{display:block}
.lbl{position:absolute;transform:translate(-50%,0);background:#fff;border:1px solid var(--line);border-radius:999px;padding:.1rem .6rem;font-size:.72rem;white-space:nowrap;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.lbl.on{border-color:var(--point);color:var(--point);font-weight:700}
.ctrl{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ctrl button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:.3rem .8rem;font-size:.8rem;cursor:pointer}
.ctrl button.primary{background:var(--point);color:#fff;border-color:var(--point)}
.caption{margin-top:6px;font-size:.88rem;min-height:1.5em}.caption b{color:var(--point)}
.nogl{display:none;padding:20px;color:var(--sub)}
.intro{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px}
.box h3{margin:0 0 6px;font-size:1.05rem}
.box ol{margin:0;padding-left:1.2rem;font-size:.93rem}
.edition{display:flex;gap:8px;margin-top:8px}
.edition button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:.6rem .8rem;text-align:left;cursor:pointer;font-size:.88rem;line-height:1.4}
.edition button.on{border-color:var(--point);background:var(--point-soft)}
.edition button b{display:block;color:var(--point)}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.legend .bx{display:block;font-size:.84rem}
.toc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 18px}
.tc .t1{display:flex;gap:.5rem;align-items:baseline;font-weight:800;cursor:pointer;margin-bottom:6px}
.tc .t1 .n{color:var(--point)}
.tc .t1 .pp{margin-left:auto;color:var(--point);font-size:.8rem;white-space:nowrap}
.tc a{display:flex;gap:.4rem;font-size:.82rem;color:var(--ink);text-decoration:none;padding:.15rem .3rem;border-radius:6px;line-height:1.4}
.tc a:hover{background:var(--point-soft);color:var(--point)}
.tc a span{margin-left:auto;color:var(--sub);white-space:nowrap;font-size:.76rem}

.bottom{position:sticky;bottom:0;z-index:15;background:rgba(251,251,248,.97);border-top:1px solid var(--line)}
.bottom .wrap{display:flex;justify-content:space-between;align-items:center;padding-top:9px;padding-bottom:9px}
.bottom button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:.45rem 1rem;font-size:.85rem;cursor:pointer}
.bottom button.primary{background:var(--point);border-color:var(--point);color:#fff}
.bottom button:disabled{opacity:.4;cursor:default}
.bottom .where{color:var(--sub);font-size:.8rem}
footer{color:var(--sub);font-size:.75rem;text-align:center;padding:14px 0 24px}
.flash{animation:fl 1.6s ease}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--point)}100%{box-shadow:0 0 0 0 transparent}}

@media (max-width:980px){.layout{grid-template-columns:1fr}.side{display:none}.legend{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.hero{flex-wrap:wrap}.hero .hp{margin-left:0;text-align:left}.topbar .wrap{flex-wrap:wrap}.tabs{flex-basis:100%}.intro,.toc,.legend,.pair{grid-template-columns:1fr}#scene{height:280px}.bottom .where{display:none}.body,.boxes{padding-left:18px;padding-right:16px}.item>header{flex-wrap:wrap;padding:14px 16px 0}.item h3{flex-basis:100%}.sech .sp{margin-left:0}}
</style>
</head>
<body>
<header class="wrap hero">
  <div class="big" id="hNo"></div>
  <div><small>온라인 교재 · PPT보다 쉽게 만드는 미리캔버스 활용 맞춤형 교안 제작</small><h1 id="hName"></h1><p id="hGoal"></p></div>
  <div class="hp" id="hPage"></div>
</header>

<nav class="topbar"><div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="tools">
    <span class="edl">내 교재</span><button class="ed on" data-ed="0" title="로그인 설명이 13쪽에서 시작하는 교재">13쪽판</button>
    <button class="ed" data-ed="4" title="로그인 설명이 17쪽에서 시작하는 교재">17쪽판</button>
    <button id="fsDown" title="글자 작게">가−</button><button id="fsUp" title="글자 크게">가+</button>
  </div>
</div></nav>

<div class="wrap layout"><main id="main"></main><aside class="side" id="side"></aside></div>

<div class="bottom"><div class="wrap">
  <button id="prev">← 이전</button><span class="where" id="where"></span><button id="next" class="primary">다음 →</button>
</div></div>
<footer>김에듀 · 김충효 강사 · kimedu.kr</footer>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
const C={no:'02',name:'교안 작성 툴 기능의 이해',short:'기본 기능',p:[13,71],goal:'로그인부터 워크스페이스, 에디터 화면, 템플릿, 사진, 요소, 표·차트, 글자, QR, 배경, 다운로드, 공유까지. 교재 순서대로 따라가되, 화면이 바뀐 곳은 2026년 10월 지금 화면으로 설명해요.',
 secs:[
 {no:'02-1',t:'로그인, 워크스페이스, 구성 메뉴 및 템플릿의 이해',p:[13,38],items:[
  {id:'b1',t:'미리캔버스 들어가기와 회원가입',p:[13,21],
   d:`<ol><li>크롬을 열고 <b>주소창</b>에 "미리캔버스"를 치거나, <b>검색창</b>에서 검색해 미리캔버스 사이트로 들어가요.<span class="pgi" data-a="14" data-b="15"></span></li>
   <li>로그인 없이 <b>바로 시작하기</b>로도 들어갈 수 있지만, 이때는 <b>내려받기와 저장이 안 돼요</b>. 수업 전에 꼭 가입해 두세요.</li>
   <li>오른쪽 위 <b>회원가입</b>을 눌러요. <b>카카오 · 네이버</b>(국내), <b>구글 · 페이스북 · 애플</b>(해외) 계정으로 바로 가입하거나 일반 이메일로 가입해요. 보통 구글이나 네이버로 많이 가입하고, 연결을 허락하면 바로 쓸 수 있어요.<span class="pgi" data-a="16" data-b="19"></span></li>
   <li><b>이메일로 가입</b>할 땐 이름 · 이메일 · 비밀번호(8~16자리)를 넣고 필수 약관에 동의해요. 그다음 <b>24시간 안에</b> 메일함에서 인증 메일을 눌러야 쓸 수 있어요. 인증되면 성공 창이 떠요.<span class="pgi" data-a="19" data-b="21"></span></li>
   <li>소셜 계정으로 가입했어도, 같은 이메일로 다시 소셜 가입을 해도 로그인에는 상관없어요.</li>
   <li><b>로그인 유지</b>를 묻는 창이 나오면 내 컴퓨터에서만 "예". 교육장 같은 <b>공용 컴퓨터에서는 "아니요"</b>를 눌러 다른 사람이 내 계정으로 들어가지 않게 해요.</li></ol>`,
   now:'가입 화면 모양과 버튼 위치는 조금 바뀌었어요. 지금 로그인 화면에는 <b>카카오 · 네이버 · 이메일</b> 버튼이 크게 있고, 그 아래 <b>구글 · 페이스북 · 웨일 · 애플</b> 아이콘이 있어요. <b>순서는 같아요</b>. 이미 가입했다면 넘어가도 돼요.'},
  {id:'b2',t:'로그인이 안 될 때 · 처음 들어간 화면',p:[22,24],
   d:`<ul><li><b>크롬 오류</b> · 크롬 위쪽에 "오류" 문구가 보이면 눌러 보세요. 새로 깔린 <b>확장 프로그램</b><span class="term">(크롬에 붙는 작은 프로그램)</span>이 원인이면, 그걸 크롬에서 삭제하면 사라져요.</li>
   <li><b>처음 로그인</b> · 에디터<span class="term">(디자인 편집 화면)</span>가 아니라 <b>워크스페이스</b>가 열려요. 오른쪽 위 <b>새 디자인 만들기</b>를 눌러 원하는 종류를 고르면 에디터로 가요.</li>
   <li><b>다시 로그인</b> · 템플릿 화면이나 에디터가 먼저 뜰 수도 있어요. <b>디자인 만들기</b> 또는 <b>바로 시작하기</b>를 누르면 에디터로 이동해요.</li></ul>`,
   now:'지금 워크스페이스 첫 화면에는 <b>"오늘은 어떤 디자인을 만들어볼까요?"</b> 문구 아래 <b>새 디자인 만들기</b>와 <b>miricle AI로 만들기</b> 버튼이 나란히 있어요. 미리클(miricle)은 미리캔버스 AI의 이름이에요.'},
  {id:'b3',t:'워크스페이스 · 내 작업물이 모이는 곳',p:[24,27],
   d:`<p><b>워크스페이스</b><span class="term">(작업 공간)</span>는 만든 디자인이 저장되는 곳이에요. 팀원과 함께 쓰고 공유하는 공간이고, 개인 워크스페이스도 만들 수 있어요. 다시 들어갈 땐 오른쪽 위 <b>내 이름(계정)</b>을 누르거나, 에디터의 전체 메뉴에서 <b>워크스페이스로 이동하기</b>를 눌러요.</p>
   <div class="tbl"><table><tr><th>메뉴</th><th>하는 일</th></tr>
   <tr><td>내 디자인</td><td>내가 만든 디자인 모아 보기</td></tr>
   <tr><td>내 드라이브</td><td>내 클라우드 저장 공간 · 폴더 만들기, 파일 올리기, 보기 방식 바꾸기</td></tr>
   <tr><td>공유 드라이브</td><td>팀원과 함께 쓰는 저장 공간</td></tr>
   <tr><td>즐겨찾기</td><td>자주 여는 디자인 모아 보기</td></tr>
   <tr><td>휴지통</td><td>지운 디자인 보관 · <b>30일 뒤</b> 완전히 삭제 · 오른쪽 끝을 눌러 <b>복원</b></td></tr></table></div>
   <p>디자인 위에 마우스를 올리면 오른쪽 아래에 <b>점 세 개 메뉴</b>가 생겨요. <b>사본 만들기 · 공유 · 이름 바꾸기 · 이동 · 삭제</b>를 여기서 해요.</p>`,
   now:'2026년 여름부터 화면이 <b>최신 환경</b> 하나로 합쳐졌어요. 워크스페이스에 <b>"이전 버전에서 만들어진 디자인이 모두 최신 환경으로 업데이트되었어요"</b>라는 안내가 보여요. 예전 디자인도 그대로 열리니 따로 옮길 필요가 없어요. 내 드라이브는 <b>폴더 · 템플릿 · 디자인 · 디자인 요소</b> 칸으로 나뉘어 보여요.'},
  {id:'b4',t:'내 드라이브에 폴더 만들고 사진 올리기',p:[28,29],
   d:`<ol><li>내 드라이브에서 <b>+ 폴더 만들기</b>를 눌러 폴더를 만들어요. 예: "이미지".</li>
   <li>폴더를 눌러 들어가요.</li>
   <li>오른쪽 위 <b>업로드</b> → 내 컴퓨터에서 파일 선택 → <b>열기</b>.</li>
   <li>폴더에 사진이 올라간 걸 확인해요. 이 사진은 에디터의 <b>업로드</b> 메뉴에서 바로 꺼내 쓸 수 있어요.</li></ol>`,
   now:'인터넷에서 받은 사진이 <b>WebP</b><span class="term">(웹 전용 이미지 형식)</span>이면 올라가지 않거나 깨질 수 있어요. 크롬 확장 프로그램 등으로 <b>JPG로 바꿔서</b> 올리세요.',
   did:'폴더 만들기 → 사진 올리기, WebP 사진은 JPG로 바꿔 올리기까지 해 봤어요.'},
  {id:'b5',t:'새 디자인 만들기 · 무엇을 만들까 고르기',p:[29,31],
   img:[['01_new_design','새 디자인 만들기 창 (2026.10 화면)']],
   d:`<p><b>새 디자인 만들기</b>를 누르면 <b>"무엇을 만들어야 하나요?"</b> 창이 떠요.</p>
   <ul><li>왼쪽 분류 · <b>추천 · 프레젠테이션 · 소셜 미디어 · 웹사이트 · 인쇄 · 기타</b></li>
   <li>교안은 <b>문서 → 프레젠테이션 (1920×1080 px)</b>을 골라요. 16:9 화면 크기예요.</li>
   <li>같은 줄에 <b>AI 프레젠테이션</b>, <b>인포그래픽 가로형 · 세로형</b>, <b>문서 서식 세로형(A4)</b>도 있어요. 유인물을 만들 땐 세로형을 써요.</li>
   <li>맨 아래 <b>파일 가져오기 (PDF · PPTX)</b>는 왕관 표시가 있는 <b>유료</b> 기능이에요. <b>직접 입력</b>으로 원하는 크기를 정할 수도 있어요.</li>
   <li>위 검색창에 "카드뉴스", "포스터"처럼 만들고 싶은 걸 검색해도 돼요.</li></ul>`},
  {id:'b5b',t:'에디터 화면 한눈에 보기',isnew:true,
   img:[['02_editor_ai_popup','빈 프레젠테이션을 연 에디터 화면']],
   d:`<p>교재에는 화면 전체 안내가 따로 없어서 지금 화면 기준으로 정리했어요. 화면은 <b>왼쪽 메뉴 · 가운데 작업 화면 · 위 막대 · 아래 막대</b> 네 부분이에요.</p>
   <div class="tbl"><table><tr><th>자리</th><th>있는 것</th></tr>
   <tr><td><b>왼쪽 메뉴</b></td><td>템플릿 · 요소 · 텍스트 · 사진 · 업로드 · 프로젝트 · AI 도구 · 배경 · 크리에이터 · 테마 · 차트 · 동영상, <b>아래로 내리면</b> 오디오 · QR/바코드 · 찜</td></tr>
   <tr><td><b>위 막대</b></td><td>왼쪽: 전체 메뉴(줄 세 개) · 되돌리기 · 다시 하기 · 저장 상태(구름) / 가운데: 디자인 제목 · 크기(1920×1080) / 오른쪽: 공유 · 슬라이드쇼 · 다운로드 · 더보기(…)</td></tr>
   <tr><td><b>아래 막대</b></td><td>페이지 목록과 + (페이지 추가) · 애니메이션 · 페이지 재생 시간(5초) · 디자인 에디터 ↔ 동영상 에디터 전환 · 확대/축소 · 레이어 · 도움말 · 사용법</td></tr>
   <tr><td><b>왼쪽 아래 ai 버튼</b></td><td>AI 프레젠테이션, 어울리는 요소 찾기, 맞춤법 검사 등 AI 기능 모음</td></tr></table></div>
   <p>빈 프레젠테이션을 열면 오른쪽 아래에 <b>"프레젠테이션 빠르게 만들어 볼까요?"</b> 창이 떠요. AI 프레젠테이션 안내라서 지금은 X로 닫아도 돼요.</p>`,
   when:'처음 에디터를 열고 "어디에 뭐가 있지?" 싶을 때'},
  {id:'b5c',t:'편집 환경 설정 · 전체 메뉴',isnew:true,
   img:[['20_hamburger','전체 메뉴(줄 세 개)'],['21_editmode','편집 환경 설정 · 패널형 / 툴바형']],
   d:`<p>왼쪽 위 <b>줄 세 개(전체 메뉴)</b>를 누르면 디자인 관리 메뉴가 모여 있어요.</p>
   <ul><li><b>워크스페이스로 이동하기</b> · 새 탭 없이 지금 탭에서 워크스페이스로 가요.</li>
   <li><b>새 디자인 만들기 · PDF·PPTX 가져오기(유료) · 사본 만들기 · 폴더로 이동</b></li>
   <li><b>버전 기록</b> · 지난 작업 내역을 보고 예전 상태로 되돌려요.</li>
   <li><b>텍스트 찾기 및 바꾸기 (Ctrl+F)</b> · 여러 장에 나온 같은 단어를 한 번에 바꿔요. 과정명이 바뀌었을 때 편해요.</li>
   <li><b>안내선 설정 · 페이지 번호 · 레이어 순서 · 언어 · 다크모드</b></li></ul>
   <p><b>편집 환경 설정</b>에서 화면 구성을 고를 수 있어요.</p>
   <ul><li><b>패널형</b> · 글자나 사진을 누르면 속성이 <b>왼쪽 패널</b>에 크게 나와요. 처음 쓰는 분께 편해요.</li>
   <li><b>툴바형</b> · 속성이 <b>위쪽 막대</b>에 한 줄로 나와 작업 화면이 넓어져요. PPT에 익숙한 분께 편해요.</li>
   <li><b>빠른 작업 도구</b> · 켜 두면 고른 요소 바로 위에 복제 · 삭제 · 잠금 같은 작은 버튼이 떠요.</li></ul>`,
   when:'화면이 좁거나, 메뉴 위치가 PPT랑 달라 헷갈릴 때'},
  {id:'b6',t:'템플릿 고르고 넣기 · 한 장만 vs 통째로(덮어쓰기)',p:[29,33],
   img:[['09_template','템플릿 메뉴'],['15_template_detail','템플릿을 누르면 · 이 템플릿으로 덮어쓰기'],['16_overwrite','덮어쓰기 뒤 · 아래에 14장이 모두 생김']],
   d:`<p><b>템플릿</b><span class="term">(미리 만들어진 양식)</span>은 대부분 무료이고, 일부는 유료예요.</p>
   <ol><li>왼쪽 <b>템플릿</b> 메뉴를 열면 위에 <b>"프레젠테이션"</b>이 골라져 있어요. 다른 종류가 필요하면 그 칸을 눌러 바꿔요.</li>
   <li>아래로 내리면 <b>최근사용 · 무료 프레젠테이션 · 추천 · 사업계획 · 경영/기업 · 보고서/기획서 · 포트폴리오 · 교육/강의</b> 묶음이 보여요. 썸네일 아래 <b>1/14</b>는 "14장짜리"라는 뜻이에요.</li>
   <li>검색창에 주제를 넣어 찾아요. 교안은 "교육", "강의", "오리엔테이션"으로 찾으면 잘 나와요.</li>
   <li>템플릿을 누르면 그 템플릿의 <b>모든 페이지</b>가 보여요.
     <ul><li><b>한 장만</b> 쓰려면 원하는 페이지 하나를 눌러요. 지금 페이지에만 들어가요.</li>
     <li><b>전부</b> 쓰려면 맨 위 <b>이 템플릿으로 덮어쓰기</b>를 눌러요. 아래 페이지 목록에 전부 생겨요.</li></ul></li>
   <li>아래쪽 <b>비슷한 템플릿</b>에서 닮은 디자인도 볼 수 있어요.</li></ol>
   <p>템플릿 찾기는 시간이 꽤 걸려요. <b>미리 넉넉히 시간을 잡고</b> 고르세요.</p>`,
   now:'덮어쓰기를 하면 오른쪽에 <b>"어울리는 요소 찾기"</b> 창이 자동으로 떠요. AI가 지금 디자인을 보고 어울리는 도형 · 장식을 추천해 주는 새 기능이에요. 필요 없으면 X로 닫아요.',
   did:'덮어쓰기로 통째로 넣어 보고, 한 장만 가져오기도 해 봤어요.'},
  {id:'b6b',t:'왕관 표시 · 무료와 유료 구분',p:[30,36],
   img:[['24_premium','무료 템플릿에 숨어 있던 유료 일러스트 1개 (다운로드 창)']],
   d:`<p><b>왕관 표시 = 프리미엄(유료)</b> 콘텐츠예요. 템플릿 · 사진 · 요소 · 글꼴 모두 같은 규칙이에요.</p>
   <ul><li>무료 사용자도 왕관 콘텐츠를 <b>넣어서 편집하고 저장</b>할 수 있어요. 대신 <b>MIRICANVAS 워터마크</b><span class="term">(글자 도장)</span>가 찍혀요.</li>
   <li><b>내려받기는 안 돼요.</b> 유료 플랜(Pro) 사용자는 워터마크 없이 내려받아요.</li>
   <li>표시가 없는 콘텐츠는 무료예요.</li></ul>`,
   now:'지금은 다운로드 창에 <b>"프리미엄 콘텐츠 1개 ₩1,100"</b>처럼 몇 개가 섞였는지와 <b>개별 구매 가격</b>이 바로 보여요. 펼치면 어떤 요소인지도 나와요. 그걸 지우거나 무료 요소로 바꾸면 무료로 내려받을 수 있어요.',
   fix:'교재 몇 군데(<b data-a="30" data-b="30"></b>, <b data-a="35" data-b="36"></b>)에 왕관 콘텐츠를 "사용할 수 없다", "저장은 된다"처럼 서로 다르게 적은 곳이 있어요. <b>무료: 넣기 · 편집 · 저장 O, 내려받기 X</b>로 정리해 두세요.'},
  {id:'b7',t:'업로드 · 내 사진 슬라이드에 넣기',p:[34,34],
   img:[['06_upload','업로드 메뉴 (2026.10 화면)']],
   d:`<p>왼쪽 <b>업로드</b> 메뉴를 누르면 내 드라이브 폴더에 올린 사진이 보여요. 사진을 <b>누르면</b> 지금 슬라이드에 들어가요.</p>
   <ul><li>맨 위 <b>업로드</b> 버튼으로 새 파일을 바로 올릴 수도 있어요.</li>
   <li><b>전체 · 폴더 · 이미지 · 오디오 · 동영상</b> 칸으로 골라 볼 수 있어요.</li>
   <li>교재 예시 사진은 Pexels<span class="term">(무료 사진 사이트)</span> 사진이라 자유롭게 써도 돼요.</li></ul>`,
   now:'업로드 메뉴에 <b>PDF · PPTX 가져오기</b>(왕관, 유료)가 생겼어요. 안내 문구는 "이제 PPTX를 편집할 수 있는 디자인으로 가져올 수 있어요"예요. 무료로는 기존 PPT를 통째로 못 가져오니, <b>내용만 복사해서 템플릿에 붙이는</b> 방법을 써요. <b>이미지를 편집할 수 있게 분해하기</b>(그림 속 글자와 요소를 떼어 고치기) 기능도 새로 보여요.'},
  {id:'b8',t:'사진 메뉴 · 찾기와 AI 사진',p:[35,36],
   img:[['05_photo','사진 메뉴']],
   d:`<ul><li><b>사진</b> 메뉴 검색창에 "전시회 관람 중인 사람들"처럼 <b>문장으로</b> 검색해도 돼요.</li>
   <li>검색창 오른쪽 <b>필터 버튼</b>으로 원하는 색이 많이 들어간 사진만 골라 볼 수 있어요.</li>
   <li>아래로 내리면 <b>풍요로운 가을 · 하늘 · 인물 · 바다 · 꽃</b>처럼 주제별 묶음이 있어요.</li>
   <li>왕관 사진은 넣으면 워터마크가 찍혀요. 표시 없는 사진은 무료예요.</li></ul>`,
   now:'사진 메뉴 위쪽에 <b>무료 AI 도구 활용하기</b> 칸이 생겼어요. <b>AI로 원하는 사진 만들기 · 창의적인 제품사진 만들기 · 흰 배경으로 깔끔한 이미지 만들기</b>가 있어요. 쓸 때마다 AI 크레딧이 빠져요.'},
  {id:'b8b',t:'사진 편집 · 자르기, 필터, AI 편집',p:[36,38],
   img:[['30_photo_props','사진을 누르면 왼쪽에 나오는 속성']],

   <tr><td>맨 위 줄</td><td><b>불투명도 · 정렬 · 순서 · 반전 · 자르기 · 배경으로 만들기 · 사진 초기화</b></td></tr>
   <tr><td><b>AI 사진 편집</b></td><td><b>배경 제거</b>(사람 · 물건만 남기기) · 영역 지우개(왕관) · 이미지 확장(왕관) · 부분 생성 · 화질 개선</td></tr>
   <tr><td><b>필터</b></td><td><b>필터 효과</b>(화사한 · 저녁 노을 · 흑백 등) / <b>직접 조정</b>(밝기 · 대비 등)</td></tr>
   <tr><td>아래쪽</td><td>색상 채우기 · <b>그라데이션 마스크</b> · 외곽선 · 그림자 · 요소 크기 입력 · 비슷한 사진</td></tr></table></div>
   <p>사진 위에 뜨는 작은 버튼과 <b>점 세 개 메뉴</b>에는 복사 · 붙여넣기 · 복제 · 삭제 · 순서 · 정렬 · <b>스타일 복사</b>(적용한 꾸밈을 다른 사진에 그대로) · 잠금 · 애니메이션 · 링크 · <b>요소 정보</b>(사진 이름 · 저작권 확인)가 있어요.</p>`,
   now:'교재의 "AI 편집 5번까지"처럼 횟수가 정해져 있던 방식은 바뀌었어요. 지금은 <b>AI 크레딧</b>(매일 조금씩 채워지는 포인트)으로 써요. <b>사진에도 외곽선</b>을 넣을 수 있고, 그라데이션 마스크도 배경뿐 아니라 <b>사진 하나하나에</b> 바로 걸 수 있어요.'}
 ]},
 {no:'02-2',t:'요소 활용 및 데이터 메뉴 활용',p:[39,51],items:[
  {id:'c1',t:'디자인 새로 만들기와 저장',p:[39,41],
   img:[['17_text_props_autosave','"실시간으로 디자인이 저장돼요" 안내']],
   d:`<ol><li>왼쪽 위 <b>전체 메뉴</b><span class="term">(줄 세 개 아이콘)</span> → <b>새 디자인 만들기</b>.</li>
   <li>새 디자인은 <b>새 브라우저 탭</b>으로 열려요. 하던 작업은 원래 탭에 그대로 있어요.</li>
   <li>전체 메뉴의 <b>워크스페이스로 이동하기</b>를 누르면 새 탭 없이 지금 탭에서 워크스페이스로 가요.</li>
   <li>워크스페이스에서 방금 만든 디자인을 누르면 마지막 상태로 열려요.</li></ol>`,
   now:'교재는 "새 디자인 전에 <b>저장 버튼(Ctrl+S)</b>을 꼭 눌러라, 진한 회색은 저장 전 · 옅은 회색은 저장됨"이라고 해요. 지금 에디터는 <b>실시간 자동 저장</b>이에요. 처음 고치면 <b>"실시간으로 디자인이 저장돼요. 이제 저장 버튼을 따로 누르지 않아도 돼요"</b> 안내가 떠요. 위 막대의 <b>구름 아이콘</b>이 저장 상태예요. 예전으로 돌아가고 싶으면 전체 메뉴의 <b>버전 기록</b>을 써요.'},
  {id:'c2',t:'요소의 종류 · 꾸밈 재료 찾기',p:[41,42],
   img:[['03_elements','요소 메뉴']],
   d:`<p><b>요소</b><span class="term">(꾸밈 재료)</span>는 사진 · 배경 · 텍스트를 뺀 모든 그림 재료예요.</p>
   <div class="tbl"><table><tr><th>칸</th><th>내용</th></tr>
   <tr><td>일러스트 · 도형 · 선 · 아이콘 · 애니</td><td>그림, 기본 도형, 선 · 화살표, 아이콘, 움직이는 그림</td></tr>
   <tr><td>컬렉션</td><td>같은 분위기의 일러스트 묶음</td></tr>
   <tr><td>프레임</td><td>사진을 끼우는 틀</td></tr>
   <tr><td>표 · 차트</td><td>데이터 정리 (차트는 왼쪽 <b>차트</b> 메뉴에도 따로 있어요)</td></tr>
   <tr><td>조합 · 스마트 블록 · 다이어그램</td><td>PPT의 스마트아트 같은 도식</td></tr></table></div>
   <ul><li>칸이 많으면 오른쪽 <b>&gt;</b> 화살표로 넘겨 봐요.</li>
   <li>검색창에 글자가 남아 있으면 전체가 안 보여요. 다 보려면 <b>검색어를 지우세요</b>.</li>
   <li>여러 요소를 한꺼번에 고를 땐 <b>Ctrl(맥은 Command) 또는 Shift를 누른 채 클릭</b>해요.</li></ul>`,
   now:'요소 메뉴 첫 화면에 <b>AI 꾸미기</b>(왕관, "요소 찾기부터 배치까지 AI가 대신해요"), <b>확장형 요소</b>(원하는 길이로 늘이는 연필 · 화살표), <b>무료 디자인 꾸미기</b>, <b>스마트 블록</b>이 새로 보여요. 요소 사이 <b>간격 자동 맞춤</b>, 여러 요소의 <b>길이 · 색 한꺼번에 바꾸기</b>도 생겼어요.'},
  {id:'c3',t:'프레임에 사진 끼우기',p:[42,45],
   d:`<ol><li>요소 메뉴의 <b>프레임</b> 칸을 열거나 검색창에 "프레임"을 넣어요. 원형 · 스타일 프레임, 스마트폰 모양 프레임 등이 나와요.</li>
   <li>프레임을 슬라이드에 넣고, 사진 메뉴의 사진을 <b>프레임 위로 끌어다 놓으면</b> 쏙 들어가요. 인물 사진이 연습하기 좋아요.</li>
   <li>프레임 안의 사진을 <b>더블클릭</b>하면 사진 위치와 크기를 옮길 수 있어요. 얼굴이 가운데 오게 맞춰요.</li></ol>`,
   did:'프레임에 사진을 넣고 더블클릭으로 위치를 맞춰 봤어요.',when:'사진을 동그랗게, 휴대폰 화면 안에 넣고 싶을 때'},
  {id:'c4',t:'표 만들기',p:[46,48],
   d:`<ol><li>요소 메뉴의 <b>표</b> 칸을 열어요. <b>기본 스타일 · 2026 심플 달력 · 의류 사이즈</b> 묶음이 있어요. 더 보려면 <b>더보기</b>.</li>
   <li>원하는 표를 누르면 슬라이드에 들어가요.</li>
   <li>표 테두리를 누르면 왼쪽에 속성이 나와요.
     <ul><li><b>행 × 열</b> · 숫자만 바꾸면 줄과 칸이 늘거나 줄어요. 예: 4 × 4 → 8 × 7</li>
     <li><b>글꼴 · 크기 · 정렬 · 글자색</b></li>
     <li><b>배경색 · 테두리 · 셀 여백 · 둥근 모서리 · 행/열 간격</b></li>
     <li><b>달력 만들기</b> · 달력 모양 표로 바꿔요. 교육 일정표에 좋아요.</li></ul></li>
   <li>표를 고른 상태에서 <b>셀을 한 번 누르면</b> 그 셀만 골라지고, 왼쪽이 <b>「셀」 속성</b>으로 바뀌어요. 셀마다 글꼴 · 글자 크기 · 배경색 · 테두리를 따로 정해요.</li>
   <li>셀을 고르면 줄 왼쪽에 <b>⋮</b>, 칸 위쪽에 <b>⋯</b> 손잡이가 생겨요. 누르면 <b>줄 전체 · 칸 전체</b>가 한 번에 골라져요.</li>
   <li>위에 뜨는 <b>점 세 개 메뉴</b>에서 <b>셀 병합 · 행 삭제 · 행 추가 · 열 추가 · 열 간격 맞추기</b>를 해요. 여러 셀을 골라 셀 병합을 누르면 하나로 합쳐져요.</li></ol>`,
   img:[['34_table','표를 누르면 나오는 「표」 속성'],['58_table_cell','셀을 한 번 더 누르면 · 「셀」 속성과 ⋮ · ⋯ 손잡이'],['50_table_menu','셀 · 줄을 고르고 점 세 개 메뉴 · 셀 병합, 행 · 열 추가와 삭제']],
   now:'교재는 셀을 <b>더블클릭</b>해서 고치고 셀을 하나씩 늘려요. 지금은 <b>표 한 번 → 셀 한 번</b> 누르면 바로 셀이 골라지고, 줄 · 칸 수는 <b>행 × 열 숫자</b>로 한 번에 바꿔요. 줄 · 칸 추가와 삭제, 셀 합치기는 점 세 개 메뉴에 모여 있어요.',
   did:'칸이 많은 표는 익숙한 <b>한글 · 엑셀</b>에서 만든 뒤 가져와 썼어요. 그게 훨씬 빨라요.'},
  {id:'c5',t:'차트 만들기 · 게이지 차트',p:[48,50],
   img:[['10_chart','차트 메뉴 (왼쪽 메뉴로 독립)'],['33_chart_data','차트를 누르면 · 데이터 편집 표'],['53_bar_color','막대 하나를 더블클릭하고 색상 변경 · 같은 요소색 모두 변경'],['52_chart_props','차트 전체 속성 · 막대 두께, 둥근 모서리, 라벨, 범례, 축'],['54_gauge_list','게이지 차트 15가지 모양'],['55_gauge_style','게이지 스타일 · 색상, 두께, 조각 나누기'],['57_gauge_compare','둥근 게이지는 둥근 모서리, 막대 게이지는 조각 나누기']],
   d:`<p>지금은 왼쪽 메뉴에 <b>차트</b>가 따로 있어요. 열면 이렇게 나뉘어요.</p>
   <ul><li><b>플로우차트</b> · 순서도 도형 / <b>차트</b> · 막대 · 선 · 원형 / <b>게이지 차트</b> · 달성률 / <b>인포그래픽 디자인 · 스마트 오브젝트 · 타임라인/연혁도 · 사분면 그래프</b></li></ul>
   <ol><li>차트를 넣고 누르면 왼쪽에 <b>데이터 편집</b> 표가 나와요. 엑셀처럼 A열은 항목, B열부터 숫자를 넣으면 차트가 바로 바뀌어요. 엑셀에서 복사해 붙여도 돼요.</li>
   <li>데이터 편집을 닫으면 속성이 나와요. 차트 종류 바꾸기 · 글꼴 · 최대/최소값 · 색 · 범례 · 데이터 라벨을 정해요.</li>
   <li><b>게이지 차트</b><span class="term">(계기판 모양, 달성률 보여 주기)</span>는 아래 「게이지 차트 자세히」를 보세요. 출석률, 진도율, 합격률을 보여 주기 좋아요.</li></ol>
   <h4 class="sub">일반 차트 · 막대 하나하나 따로 꾸미기</h4>
   <p>차트는 통째로만 바뀌는 게 아니라 <b>막대 하나만 골라</b> 따로 꾸밀 수 있어요.</p>
   <ol><li>차트를 누른 뒤 강조할 막대를 <b>더블클릭</b>하면 그 막대 하나만 골라져요. 예: 막대 3개 중 "우리 반" 막대 하나만.</li>
   <li>왼쪽 <b>막대 스타일</b>의 <b>색상</b>을 바꾸면 그 막대만 색이 바뀌어요. 나머지는 연한 색, 강조할 막대만 진한 포인트 색으로 두면 한눈에 들어와요. 색상 창 아래 <b>같은 요소색 모두 변경</b>을 누르면 같은 색 막대가 한꺼번에 바뀌어요.</li>
   <li>고른 막대 하나에도 <b>둥근 모서리 · 외곽선</b>을 따로 줄 수 있어요.</li></ol>
   <p><b>차트 전체</b>를 누르면(한 번 클릭) 왼쪽에 나오는 것</p>
   <div class="tbl"><table><tr><th>칸</th><th>할 수 있는 것</th></tr>
   <tr><td>차트 종류</td><td>세로 막대 차트 등 다른 모양으로 바꾸기 · 옆 화살표 버튼으로 행과 열 바꾸기</td></tr>
   <tr><td>데이터 편집</td><td>항목 · 숫자 고치기, 줄을 더 넣으면 막대가 바로 늘어나요</td></tr>
   <tr><td><b>강조 요소</b></td><td>차트 위에 <b>상승 화살표 · 구간 표시 · "200% 증가" 원 · 말풍선</b>을 얹어 숫자를 강조해요(전체 보기)</td></tr>
   <tr><td>막대 스타일</td><td><b>색상</b>(막대별) · <b>두께</b>(%) · <b>둥근 모서리</b>(%) · 외곽선</td></tr>
   <tr><td>표시</td><td><b>데이터 라벨</b>(막대 위 숫자) · <b>범례</b> · 가로축 · 세로축 · 눈금선을 켜고 끄기</td></tr></table></div>
   <h4 class="sub">게이지 차트 자세히 · 모양, 숫자, 꾸미기</h4>
   <p>차트 메뉴의 <b>게이지 차트 → 더보기</b>를 누르면 <b>15가지</b> 기본 모양이 나와요. 막대형 · 원형 · 반원형에, 칸이 나뉜 <b>눈금형</b>까지 있어요. 넣은 뒤 게이지를 누르면 왼쪽에서 모두 바꿀 수 있어요.</p>
   <div class="tbl"><table><tr><th>칸</th><th>할 수 있는 것</th></tr>
   <tr><td><b>모양</b></td><td><b>반원(180°) · 아치형(270°) · 원형(360°) · 가로 막대 · 세로 막대</b> 다섯 가지로 바꿔요</td></tr>
   <tr><td><b>데이터 형식</b></td><td><b>백분율(%)</b> · 값만 넣으면 돼요 (예: 75) / <b>직접 입력</b> · 값과 <b>최솟값 · 최댓값</b>을 넣어요 (예: 18, 0~20)</td></tr>
   <tr><td><b>표시 형식</b></td><td>직접 입력일 때 가운데 숫자를 <b>값/최댓값</b>(18/20)처럼 보여 줘요</td></tr>
   <tr><td><b>게이지 스타일</b></td><td><b>게이지 색상</b>(채워진 부분) · <b>트랙 색상</b>(빈 부분) · <b>게이지 두께</b> · 트랙 두께 따로 정하기 · 둥근 모서리</td></tr>
   <tr><td><b>조각 나누기</b></td><td>켜면 게이지가 칸칸이 <b>나뉜 눈금</b> 모양이 돼요. <b>조각 개수</b>로 몇 칸으로 나눌지 정해요 (예: 20명 반이면 20칸)</td></tr>
   <tr><td>라벨</td><td><b>데이터 라벨</b>(가운데 숫자) · <b>축 라벨</b>(0 · 100 같은 양 끝 숫자) · 보조 텍스트(예: 달성률)를 켜고 끄기</td></tr></table></div>
   <h4 class="sub">게이지 차트 · 이렇게 쓰면 좋아요</h4>
   <div class="tbl"><table><tr><th>보여 줄 것</th><th>예시</th><th>데이터 형식</th></tr>
   <tr><td>출석률 · 진도율</td><td>과정 진도 60%, 이번 주 출석 95%</td><td>백분율</td></tr>
   <tr><td>합격률 · 취업률</td><td>지난 기수 필기 합격률 82%</td><td>백분율</td></tr>
   <tr><td>과제 · 실습 제출</td><td>실습 과제 제출 18 / 20명</td><td>직접 입력</td></tr>
   <tr><td>학습 목표 달성</td><td>오늘 목표 3개 중 2개 완료</td><td>직접 입력</td></tr>
   <tr><td>만족도 · 자기 점검</td><td>수업 만족도 4.6 / 5</td><td>직접 입력</td></tr>
   <tr><td>안전 · 위생 점검</td><td>점검표 10항목 중 9항목 이행</td><td>직접 입력</td></tr></table></div>
   <ul><li>게이지 여러 개를 <b>나란히</b> 놓으면 한 장짜리 과정 현황판이 돼요. 예: 출석 · 진도 · 과제 세 개.</li>
   <li>첫 시간에는 "지금 0%", 마지막 시간에는 "100%"처럼 <b>같은 게이지를 시작과 끝에</b> 두면 성장이 눈에 보여요.</li>
   <li><b>게이지 색상</b>을 목표 기준에 맞춰 바꿔요. 예: 목표 미달은 주황, 달성은 초록.</li>
   <li>사람 수 · 단계 수가 정해진 건 <b>조각 나누기</b>가 잘 맞아요. 20명 반 출석은 20칸, 실습 8단계 진도는 8칸.</li>
   <li><b>모양에 따라 어울리는 꾸밈이 달라요.</b> 원형 · 반원 · 아치형처럼 <b>둥근 게이지</b>는 조각을 나누면 칸이 각져 보여요. 둥근 게이지는 <b>조각 나누기를 끄고 둥근 모서리를 켜면</b> 깔끔해요. 조각 나누기는 <b>가로 · 세로 막대</b>에 쓰면 눈금처럼 잘 어울려요.</li></ul>`,
   now:'교재 화면은 예전 편집기라 메뉴 모양이 달라요. 차트가 <b>왼쪽 메뉴로 독립</b>했고, <b>게이지 차트</b>(모양 다섯 가지 · 조각 나누기)가 생겼어요. 막대 하나만 골라 색 · 모양을 바꾸는 <b>개별 편집</b>이 되고, 차트에도 <b>외곽선</b>을 넣을 수 있어요.',
   did:'차트와 게이지 차트를 만들어 봤어요.'},
  {id:'c6',t:'조합 · 인포그래픽 도식',p:[51,51],
   d:`<p>요소 메뉴의 <b>조합</b>, 차트 메뉴의 <b>인포그래픽 디자인 · 스마트 오브젝트 · 타임라인</b>에 도식이 모여 있어요. 넣은 뒤 그룹을 풀면 <b>글자 · 색 · 크기</b>를 하나씩 바꿀 수 있고, <b>비슷한 요소 찾기</b>로 다른 모양을 골라 볼 수 있어요.</p>`,
   when:'순서나 단계를 그림으로 보여 주고 싶을 때'}
 ]},
 {no:'02-3',t:'텍스트 및 배경 활용',p:[52,61],items:[
  {id:'d1',t:'글자 넣기 · 묶인 글자 풀기',p:[52,53],
   img:[['04_text','텍스트 메뉴']],
   d:`<ol><li>왼쪽 <b>텍스트</b> 메뉴 → <b>제목 · 부제목 · 본문 텍스트 추가</b> 중 하나를 눌러요.</li>
   <li><b>스타일</b> 칸에는 미리 꾸며진 글자 묶음이 있어요. 이건 여러 개가 묶인 <b>그룹</b>이라 바로 안 고쳐질 때가 있어요.</li>
   <li>그럴 땐 <b>그룹 해제</b> → 글자 수정 · 크기 조절 → 다시 <b>그룹</b>으로 묶어요.</li></ol>`,
   now:'텍스트 메뉴에 <b>"지금 디자인에 어울리는"</b> 글꼴 추천 칸과 <b>저작권 안심글꼴</b> 묶음이 생겼어요. 디자인을 조금 채운 뒤 <b>수정한 디자인으로 추천</b>을 누르면 어울리는 글꼴을 골라 줘요.'},
  {id:'d2',t:'글자 꾸미기 · 서식, 색, 외곽선, 그림자, 곡선',p:[53,56],
   img:[['17_text_props_autosave','글자를 누르면 왼쪽에 나오는 속성'],['18_color','글자색 · 단색 / 그라데이션']],
   d:`<p>글자를 누르면 <b>파란 테두리</b>가 생기고 왼쪽에 속성이 나와요. 모서리를 끌어 크기를 바꿀 수도 있어요.</p>
   <div class="tbl"><table><tr><th>메뉴</th><th>할 수 있는 것</th></tr>
   <tr><td>맨 위 줄</td><td>불투명도 · 정렬 · 순서</td></tr>
   <tr><td>글꼴 줄</td><td>글꼴 · 크기(− 숫자 +) · 굵게 · 기울임 · 밑줄 · 특수 서식</td></tr>
   <tr><td>문단 줄</td><td>정렬 · 세로 정렬 · 자간/행간 · 글머리 기호/번호 · <b>글자색</b> · <b>글자 배경색</b>(형광펜) · 이모지</td></tr>
   <tr><td>외곽선</td><td>색, 두께 · 제목이나 강조 글자에 좋아요</td></tr>
   <tr><td>그림자</td><td>색, 방향, 투명도, 거리, 흐림</td></tr>
   <tr><td>곡선</td><td>글자를 바깥쪽 · 안쪽으로 휘어 둥근 글자 만들기</td></tr>
   <tr><td>세로 쓰기</td><td>글자를 위에서 아래로</td></tr></table></div>
   <p><b>글자색</b>을 누르면 <b>단색 / 그라데이션</b> 칸이 있어요. <b>사용 중인 색상</b>에 이 디자인에 쓴 색이 모여 있고, 아래 칸에 <b>헥사코드</b><span class="term">(#234B99 같은 색 번호)</span>를 넣거나 <b>스포이드</b>로 화면 색을 찍어 올 수 있어요.</p>`,
   now:'새 에디터에서는 <b>그라데이션 · 외곽선 · 그림자 · 애니메이션</b>을 한 글자에 <b>여러 개 함께</b> 줄 수 있고, 언제든 다시 고칠 수 있어요. 단, <b>곡선 · 외곽선</b>을 넣은 글자는 PPTX로 받으면 그림으로 바뀌어요.',
   did:'글자에 그라데이션 · 그림자 · 외곽선 효과를 넣어 봤어요.'},
  {id:'d2b',t:'자주 쓰는 단축키 · 점 세 개 메뉴',isnew:true,
   img:[['19_more_menu','요소 위 점 세 개 메뉴와 정렬 단축키']],
   d:`<div class="tbl"><table><tr><th>하는 일</th><th>단축키</th></tr>
   <tr><td>복사 / 붙여넣기 / 복제</td><td>Ctrl+C / Ctrl+V / <b>Ctrl+D</b></td></tr>
   <tr><td>스타일 복사 (꾸밈만 복사)</td><td>Ctrl+Alt+C</td></tr>
   <tr><td>잠금 (실수로 안 움직이게)</td><td>Ctrl+L</td></tr>
   <tr><td>왼쪽 · 가운데 · 오른쪽 정렬</td><td>Alt+A · Alt+H · Alt+D</td></tr>
   <tr><td>위 · 중간 · 아래 정렬</td><td>Alt+W · Alt+V · Alt+S</td></tr>
   <tr><td>텍스트 찾기 및 바꾸기</td><td>Ctrl+F</td></tr>
   <tr><td>페이지 추가 / 복제</td><td>Shift+Enter / Ctrl+D</td></tr></table></div>
   <p>점 세 개 메뉴에는 레이어 선택 · 순서 · 정렬 · 잠금 · 애니메이션 · <b>링크</b> · 요소 정보도 있어요.</p>`,
   when:'PPT처럼 빠르게 작업하고 싶을 때'},
  {id:'d3',t:'QR 코드 만들기',p:[57,57],
   img:[['28_qr','왼쪽 메뉴 아래쪽 QR/바코드 → URL → 만들기'],['29_qr_symbol','심벌 마크 · 가운데 아이콘 넣기']],
   d:`<ol><li>왼쪽 메뉴를 <b>아래로 스크롤</b>하면 숨어 있던 <b>QR/바코드</b> 메뉴가 나와요.</li>
   <li><b>QR코드</b> 칸에 인터넷 주소(URL)를 넣고 <b>만들기</b>. <b>바코드</b> 칸은 숫자만 돼요.</li>
   <li>QR을 누르면 속성에서 주소를 바꾸고 <b>적용</b>할 수 있어요.</li>
   <li><b>심벌 마크</b>를 켜면 QR 가운데에 아이콘을 넣어요. <b>아이콘</b> 칸에 라인 · 인스타그램 · 유튜브 등이 있고, <b>업로드</b> 칸으로 <b>내 기관 로고</b>를 넣을 수 있어요.</li></ol>`,
   did:'QR 코드 가운데에 작은 로고를 넣어 봤어요.',when:'교안 마지막 장에 설문 · 자료 링크를 넣고 싶을 때'},
  {id:'d4',t:'배경 바꾸기 · 사진, 패턴, 사진을 배경으로',p:[58,59],
   img:[['08_background','배경 메뉴']],
   d:`<ul><li><b>배경</b> 메뉴에는 <b>사진 / 패턴</b> 칸이 있어요. 맨 위 <b>배경색</b>에서 단색 배경을 고르고, 아래 <b>그래픽 배경 · 텍스처 배경</b>에서 사진 배경을 골라요.</li>
   <li>배경을 넣은 뒤 <b>배경 편집</b>을 누르면 이동 · <b>투명도</b> · 반전 · 자르기 · 배경 빼내기 · 색 · 필터를 바꿔요.</li>
   <li>패턴 배경은 색과 <b>무늬 크기</b>를 바꿀 수 있어요.</li>
   <li>슬라이드에 넣은 사진도 사진 속성의 <b>배경으로 만들기</b>를 누르면 배경이 돼요.</li>
   <li>다른 템플릿에서 가져온 페이지와 배경색을 맞출 땐 배경색 → <b>스포이드</b>로 원래 색을 찍어 와요.</li></ul>`,
   now:'배경 메뉴 아래에 <b>무료 AI 도구 활용하기</b>(몽환적인 배경 만들기 · 자유롭게 배경 만들기 · 비슷한 이미지 생성)가 생겼어요. 그래픽 배경 상당수가 왕관이니 확인하고 쓰세요.'},
  {id:'d5',t:'그라데이션 마스크 · 사진 가장자리를 서서히 투명하게',p:[60,61],
   img:[['31_mask','사진에 그라데이션 마스크 켜기 · 타입과 범위']],
   d:`<p>사진이나 배경 사진에 <b>그라데이션 마스크</b><span class="term">(서서히 투명해지는 효과)</span>를 켜면 사진 가장자리가 안개처럼 흐려져요.</p>
   <ol><li>사진을 누르고 속성 아래쪽 <b>그라데이션 마스크</b>를 켜요.</li>
   <li><b>타입</b>을 골라요. <b>네모</b> · 사각형 모양으로 / <b>원형</b> · 동그랗게 / <b>막대(/)</b> · 한쪽 방향으로만 흐려져요.</li>
   <li><b>범위</b>(%)를 움직여 얼마나 흐릴지 정해요. 막대 타입은 방향도 바꿀 수 있어요.</li>
   <li>흐려진 자리에 제목 글자를 얹으면 깔끔한 표지가 돼요.</li></ol>`,
   did:'표지 사진에 마스크를 넣고 그 자리에 제목을 얹어 봤어요.'},
  {id:'d6',t:'테마 · 색 조합 한 번에 바꾸기',isnew:true,
   img:[['13_theme','테마 메뉴']],
   d:`<p>교재에는 없는 새 메뉴예요. 왼쪽 <b>테마</b> 메뉴에서 색 조합 하나를 누르면 <b>디자인 전체의 색</b>이 한 번에 바뀌어요.</p>
   <ul><li><b>현재 색상</b> · 지금 디자인에 쓰인 색 / <b>초기화</b> · 원래 색으로</li>
   <li><b>모든 테마 색상</b>에서 고르거나, <b>셔플</b>로 무작위로 섞어 봐요.</li>
   <li>검색창에 "파랑", "파스텔"처럼 색 이름을 넣어 찾아요.</li></ul>`,
   when:'템플릿은 마음에 드는데 색이 우리 기관과 안 맞을 때'}
 ]},
 {no:'02-4',t:'협업, 다운로드 및 배포 방법',p:[62,71],items:[
  {id:'e1',t:'내려받기 · 파일 종류 고르기',p:[62,64],
   img:[['22_download','다운로드 창'],['23_filetype','파일 형식 목록']],
   d:`<p>위 막대 오른쪽 <b>다운로드</b>를 눌러요.</p>
   <div class="tbl"><table><tr><th>파일 형식</th><th>화면 설명</th><th>언제</th></tr>
   <tr><td>PNG</td><td>배경이 투명한 고품질 이미지</td><td>로고 · 아이콘처럼 배경 없이 쓸 때</td></tr>
   <tr><td>JPG</td><td>공유에 적합한 이미지</td><td>카톡 · SNS로 한 장씩 보낼 때</td></tr>
   <tr><td><b>PDF (웹용)</b></td><td>문서에 적합한 파일 · <b>권장</b></td><td>훈련생에게 교안 나눠 줄 때</td></tr>
   <tr><td><b>PDF (인쇄용)</b></td><td>벡터를 포함하는 인쇄용 파일</td><td>종이로 뽑을 때</td></tr>
   <tr><td><b>PPTX</b></td><td>텍스트 수정이 가능한 파워포인트 파일</td><td>PPT에서 이어서 고칠 때</td></tr>
   <tr><td>MP4 · GIF</td><td>동영상 / 소리 없이 움직이는 이미지</td><td>애니메이션을 넣은 디자인</td></tr></table></div>
   <p>창 아래 <b>다운로드 정보</b>에 페이지 수와 크기가 나오고, <b>알기 쉬운 저작권 가이드</b> 링크가 있어요. 유료 요소가 섞였으면 <b>프리미엄 콘텐츠 개수와 가격</b>이 보여요.</p>`,
   now:'다운로드를 누르면 위에 <b>"다운로드 전에 체크해볼까요? 맞춤법 검사"</b> 안내가 떠요. 오타 확인에 좋아요. PPTX로 받으면 <b>휘어진 글자 · 둥근 모서리 · 테두리</b> 같은 효과는 파워포인트에서 <b>그림으로 바뀌어</b> 글자를 고칠 수 없어요.',
   did:'PDF와 PPTX로 내려받아 파워포인트에서 열어 봤어요.'},
  {id:'e2',t:'페이지 골라 받기 · 한 장으로 합치기',p:[64,65],
   d:`<ul><li><b>페이지 선택</b>에서 <b>모든 페이지</b> 또는 원하는 페이지만 체크해요.</li>
   <li>두 장 이상을 이미지로 받을 때 · <b>여러 장 그대로</b>(ZIP 압축 파일로 받아져요) 또는 <b>한 장으로 합치기</b>(위아래로 이어 붙인 긴 그림 한 장).</li>
   <li>한 장으로 합치기는 고해상도로만 받을 수 있어요.</li></ul>`},
  {id:'e3',t:'선명도(dpi) · 화면용과 인쇄용',p:[65,68],
   d:`<p><b>dpi</b><span class="term">(1인치에 점이 몇 개인지, 클수록 선명)</span>로 선명도를 비교해요. 교재는 웹용 빠른 다운로드 72dpi, 웹용 고해상도 96dpi, <b>인쇄용 300dpi</b>(예: 6000×3375 픽셀)로 비교해요.</p>`,
   now:'지금 다운로드 창은 "빠른 / 고해상도"를 따로 묻지 않고 <b>PDF (웹용) · PDF (인쇄용)</b>처럼 파일 형식에서 나눠요.',
   fix:'교재에 서로 다른 dpi 숫자가 섞여 있어 헷갈릴 수 있어요. <b>화면용은 웹용, 종이로 뽑을 땐 인쇄용 PDF</b> 하나만 기억하세요.'},
  {id:'e4',t:'함께 작업하기 · 멤버 초대',p:[68,70],
   img:[['26_access','공유 탭 · 사람 초대와 접근 권한']],
   d:`<ol><li>위 막대 <b>공유</b> → <b>공유</b> 탭의 "이름 또는 이메일 입력"에 함께 고칠 사람을 넣어 초대해요.</li>
   <li>초대받은 사람은 알림 · 메일에서 <b>수락</b>하고 디자인을 열어요.</li>

function PROPS(T,mat){
  const BLUE=0x1d6fb8,LIGHT=0x9cc3e8,GRAY=0xc9d1da,WHITE=0xffffff,GREEN=0x5aa874,PURPLE=0x8a72c4,NAVY=0x234b99;
  function folder(){const g=new T.Group();const back=new T.Mesh(new T.BoxGeometry(1.1,.78,.06),mat(BLUE));back.position.set(0,.45,-.08);
    const tab=new T.Mesh(new T.BoxGeometry(.4,.12,.06),mat(BLUE));tab.position.set(-.33,.89,-.08);
    const paper=new T.Mesh(new T.BoxGeometry(.9,.7,.02),mat(WHITE));paper.position.set(0,.55,-.03);
    const front=new T.Mesh(new T.BoxGeometry(1.1,.62,.06),mat(LIGHT));front.position.set(0,.36,.03);front.rotation.x=-.18;
    g.add(back,tab,paper,front);g.userData.tick=(t,on)=>{paper.position.y=.55+(on?Math.sin(t/260)*.07+.06:0)};return g}
  function chart(){const g=new T.Group();const hs=[.45,.75,1.05],cs=[LIGHT,BLUE,NAVY],bars=[];
    hs.forEach((h,i)=>{const b=new T.Mesh(new T.BoxGeometry(.26,1,.26),mat(cs[i]));b.scale.y=h;b.position.set(-.36+i*.36,h/2,0);g.add(b);bars.push([b,h])});
    const dot=new T.Mesh(new T.SphereGeometry(.12,20,14),mat(GREEN));dot.position.set(.36,1.22,0);g.add(dot);
    g.userData.tick=(t,on)=>{bars.forEach(([b,h],i)=>{const s=on?h*(0.85+0.15*Math.sin(t/300+i)):h;b.scale.y=s;b.position.y=s/2});dot.position.y=bars[2][0].scale.y+.17};return g}
  function letter(){const g=new T.Group();const bg=new T.Mesh(new T.BoxGeometry(1.15,1.15,.05),mat(0xe8f0f8));bg.position.set(0,.6,-.2);
    const top=new T.Mesh(new T.BoxGeometry(.8,.18,.16),mat(BLUE));top.position.set(0,.98,0);
    const stem=new T.Mesh(new T.BoxGeometry(.18,.72,.16),mat(BLUE));stem.position.set(0,.53,0);
    const sh=new T.Mesh(new T.BoxGeometry(.8,.18,.04),mat(PURPLE));sh.position.set(.05,.93,-.1);
    g.add(bg,sh,top,stem);g.userData.tick=(t,on)=>{sh.position.x=on?.05+Math.sin(t/400)*.05:.05};return g}
  function download(){const g=new T.Group();const base=new T.Mesh(new T.BoxGeometry(1,.1,.5),mat(GRAY));base.position.y=.08;
    const l=new T.Mesh(new T.BoxGeometry(.1,.3,.5),mat(GRAY));l.position.set(-.45,.25,0);const r=l.clone();r.position.x=.45;
    const arrow=new T.Group();const shaft=new T.Mesh(new T.CylinderGeometry(.08,.08,.55,16),mat(BLUE));shaft.position.y=.3;
    const head=new T.Mesh(new T.ConeGeometry(.22,.3,20),mat(BLUE));head.rotation.x=Math.PI;head.position.y=-.05;arrow.add(shaft,head);arrow.position.y=.55;
    const share=new T.Mesh(new T.SphereGeometry(.09,16,12),mat(GREEN));share.position.set(.55,.75,0);
    g.add(base,l,r,arrow,share);g.userData.tick=(t,on)=>{arrow.position.y=on?.5+Math.abs(Math.sin(t/350))*.25:.55};return g}
  return [folder,chart,letter,download];
}

     <div class="box"><h3>내 교재는 어느 버전?</h3><p style="margin:0;font-size:.9rem">내용은 같고 앞쪽 안내 페이지 수만 달라 <b>쪽수가 4쪽씩</b> 차이 나요. 「미리캔버스 로그인 설명」이 몇 쪽에서 시작하나요?</p>
       <div class="edition"><button class="ed on" data-ed="0"><b>13쪽에서 시작</b>원래 판</button><button class="ed" data-ed="4"><b>17쪽에서 시작</b>4쪽 늘어난 판</button></div></div>
   </div>
   <div class="box" style="margin-bottom:16px" id="legend"><h3>상자 색깔 읽는 법</h3><div class="legend">
     ${bx('now','🔄','지금 화면에서는','교재 화면과 달라진 곳 · 새 기능')}${bx('fix','✏️','바르게 알아 두기','교재에서 헷갈리게 적힌 곳 바로잡기')}${bx('st','🧩','막힐 때','잘 안 될 때 먼저 확인할 것')}${bx('mo','🚀','한 걸음 더','익숙한 분을 위한 빠른 방법 · 응용')}${bx('job','💼','내 직종에 쓰면','훈련 과목에 맞춘 활용 예')}${bx('pr','✍️','실습 포인트','절 끝 「해 볼 것」 · 내 과목으로 직접')}</div></div>
   <div class="toc" id="toc">${toc}</div>`;
}
function build(){
  document.getElementById('hNo').textContent=C.no;document.getElementById('hName').textContent=C.name;document.getElementById('hGoal').textContent=C.goal;
  document.getElementById('hPage').innerHTML=pgB(C.p)+'<small>교재 쪽수</small>';
  tabs.innerHTML=STEPS.map((s,i)=>`<button class="tab" data-i="${i}"><b>${s.no}</b>${s.name}</button>`).join('');
  main.innerHTML=STEPS.map(s=>`<section class="step" id="${s.id}">${s.sec?section(s.sec):home()}</section>`).join('');
  document.querySelectorAll('.check input').forEach(c=>{c.checked=!!DONE[c.dataset.k];c.closest('label').classList.toggle('done',c.checked)});
  counts();
}
function counts(){document.querySelectorAll('.check').forEach(ch=>{const a=ch.querySelectorAll('input'),d=[...a].filter(x=>x.checked).length;ch.querySelector('.cnt').textContent=`${d} / ${a.length}`})}
function sideHtml(){
  const s=STEPS[cur];
  return `<h4>${C.no}장 · ${C.name}</h4><a class="sh${cur===0?' cur':''}" href="#" data-go="0">처음 · 한눈에 보기</a>`+C.secs.map((se,si)=>{
    const on=s.sec===se;
    return `<a class="sh${on?' cur':''}" href="#" data-go="${si+1}">${se.no} ${se.short||se.t}</a>`+(on?se.items.map((it,k)=>`<a class="it" href="#" data-t="i-${it.id}"><i>${k+1}</i>${it.t}</a>`).join('')+`<a class="it" href="#" data-t="chk-${se.no}"><i>✍️</i>해 볼 것</a>`:'')}).join('');
}
function show(i,scroll){
  cur=Math.max(0,Math.min(STEPS.length-1,i));
  document.querySelectorAll('.step').forEach((el,k)=>el.classList.toggle('on',k===cur));
  document.querySelectorAll('.tab').forEach((el,k)=>el.classList.toggle('on',k===cur));
  side.innerHTML=sideHtml();
  const s=STEPS[cur];
  document.getElementById('where').textContent=`${s.no} · ${s.name} · ${edL()}`;
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').textContent=cur===STEPS.length-1?'처음으로 ↺':'다음 절 →';
  document.getElementById('prev').textContent=cur===1?'← 처음':'← 이전 절';
  if(scroll!==false)toTop();
  if(cur===0&&window.__sceneResize)setTimeout(window.__sceneResize,50);
}
function toTop(){const tb=document.querySelector('.topbar');const y=main.getBoundingClientRect().top+window.scrollY-tb.offsetHeight-8;window.scrollTo({top:Math.max(0,y),behavior:'smooth'})}
function goTo(id){const el=document.getElementById(id);if(!el)return;el.scrollIntoView({behavior:'smooth',block:'start'});if(el.classList.contains('item')){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}}
function goItem(id){const si=C.secs.findIndex(s=>s.items.some(i=>i.id===id));if(si<0)return;show(si+1,false);setTimeout(()=>goTo('i-'+id),30)}
function setEd(v){ed=v;try{localStorage.setItem('mc-ed',v)}catch(e){}document.querySelectorAll('.ed').forEach(b=>b.classList.toggle('on',+b.dataset.ed===ed));
  document.querySelectorAll('b[data-a]').forEach(b=>{b.textContent=pt(+b.dataset.a,+b.dataset.b)});
  document.querySelectorAll('.pgi').forEach(el=>el.textContent='📖 '+pt(+el.dataset.a,+el.dataset.b));
  document.getElementById('where').textContent=`${STEPS[cur].no} · ${STEPS[cur].name} · ${edL()}`;
  if(window.__cap)window.__cap();}
build();show(0,false);let ed0=0;try{ed0=+(localStorage.getItem('mc-ed')||0)}catch(e){}setEd(ed0===4?4:0);
document.addEventListener('click',e=>{
  const fg=e.target.closest('.shots figure');if(fg){fg.classList.toggle('zoom');return}

/* three.js · 절마다 소품 하나 */
(function(){
  const box=document.getElementById('scene');if(!window.THREE){document.getElementById('nogl').style.display='block';return}
  let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:true})}catch(e){document.getElementById('nogl').style.display='block';return}
  renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));box.appendChild(renderer.domElement);
  const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,2,.1,100);cam.position.set(0,3.0,8.2);cam.lookAt(0,0.75,0);
  scene.add(new THREE.HemisphereLight(0xffffff,0xdde6ef,.95));const sun=new THREE.DirectionalLight(0xffffff,.75);sun.position.set(4,8,6);scene.add(sun);
  const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.55,metalness:.05});
  const world=new THREE.Group();scene.add(world);
  const path=new THREE.Mesh(new THREE.BoxGeometry(C.secs.length>2?11:(C.secs.length>1?7:4.5),.06,1.9),mat(0xe7edf3));path.position.y=-.03;world.add(path);
  const STOPS=PROPS(THREE,mat).map((f,i)=>({f,s:C.secs[i],step:i+1}));
  const props=[],labels=[],n=STOPS.length;
  STOPS.forEach((s,i)=>{const g=s.f();g.scale.setScalar(n===1?2.1:1.35);g.position.set(n>1?(i-(n-1)/2)*Math.min(3.2,8.4/(n-1)):0,0,0);g.userData.i=i;world.add(g);props.push(g);
    const pad=new THREE.Mesh(new THREE.CylinderGeometry(.85,.85,.05,32),mat(0xdfe7ef));pad.position.set(g.position.x,.02,0);world.add(pad);g.userData.pad=pad;
    const el=document.createElement('div');el.className='lbl';el.textContent=s.s.no+' '+(s.s.short||s.s.t).split(' · ')[0];el.onclick=()=>show(s.step);box.appendChild(el);labels.push(el)});
  let active=0,playing=false,spin=false,t0=0,last=performance.now();const cap=document.getElementById('caption');
  window.__cap=()=>{const s=STOPS[active].s;cap.innerHTML=`<b>${s.no} ${s.t}</b> · ${pt(s.p[0],s.p[1])} · 항목 ${s.items.length}개`};
  function setActive(i){active=i;props.forEach((p,k)=>p.userData.pad.material.color.setHex(k===i?0x9cc3e8:0xdfe7ef));labels.forEach((l,k)=>l.classList.toggle('on',k===i));window.__cap()}
  setActive(0);
  function resize(){const w=box.clientWidth,h=box.clientHeight;if(!w)return;renderer.setSize(w,h);cam.aspect=w/h;cam.position.z=w<480?12:(w<640?11:(w<900?10:8.2));cam.updateProjectionMatrix()}
  window.__sceneResize=resize;window.addEventListener('resize',resize);resize();
  const v=new THREE.Vector3();
  function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(playing){t0+=dt;if(t0>2.2){t0=0;setActive((active+1)%n)}}if(spin)world.rotation.y+=dt*.25;
    props.forEach((p,k)=>{const tgt=k===active?.25+Math.sin(now/300)*.06:0;p.position.y+=(tgt-p.position.y)*.12;p.rotation.y=k===active?Math.sin(now/700)*.35:p.rotation.y*.9;if(p.userData.tick)p.userData.tick(now,k===active)});
    renderer.render(scene,cam);const w=box.clientWidth,h=box.clientHeight;
    props.forEach((p,k)=>{v.set(p.position.x,p.position.y-.15,p.position.z+.7);v.applyMatrix4(world.matrixWorld);v.project(cam);const x=(v.x*.5+.5)*w,y=(-v.y*.5+.5)*h+12+(w<640&&k%2?30:0);const l=labels[k];l.style.left=x+'px';l.style.top=Math.min(h-30,y)+'px';l.style.display=(v.z<1&&(w>=520||k===active))?'block':'none'});
    requestAnimationFrame(loop)}
  requestAnimationFrame(loop);
  const ray=new THREE.Raycaster(),m=new THREE.Vector2();
  renderer.domElement.addEventListener('click',e=>{const r=renderer.domElement.getBoundingClientRect();m.x=((e.clientX-r.left)/r.width)*2-1;m.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(m,cam);const hit=ray.intersectObjects(props,true)[0];if(!hit)return;let o=hit.object;while(o&&o.userData.i===undefined)o=o.parent;if(o){setActive(o.userData.i);setTimeout(()=>show(STOPS[o.userData.i].step),350)}});
  document.getElementById('play').onclick=()=>playing=true;document.getElementById('pause').onclick=()=>playing=false;
  document.getElementById('reset').onclick=()=>{playing=false;t0=0;world.rotation.y=0;setActive(0)};document.getElementById('spin').onclick=()=>{spin=!spin;if(!spin)world.rotation.y=0};
})();
