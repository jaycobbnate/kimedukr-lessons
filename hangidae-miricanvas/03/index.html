<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교재 톺아보기 · PPT보다 쉽게 만드는 미리캔버스 활용 맞춤형 교안 제작</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--fs:21px;--bg:#fbfbf8;--line:#e3e5e8;--ink:#1f2933;--sub:#5b6673;--point:#1d6fb8;--point-soft:#e9f2fb;--ai:#7a5af5;--ai-soft:#f1edfd;--book:#f6f7f9;--ok:#2f7a4b;--ok-soft:#ecf6ef;--warn:#8a6a1f;--warn-soft:#fbf5e6}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6;word-break:keep-all}
button{font-family:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hero{padding:26px 20px 14px;border-bottom:1px solid var(--line)}
.hero small{color:var(--point);font-weight:700}
.hero h1{margin:4px 0 4px;font-size:1.45rem;line-height:1.3}
.hero p{margin:0;color:var(--sub);font-size:.9rem}

/* 상단 메뉴 */
.topbar{position:sticky;top:0;z-index:20;background:rgba(251,251,248,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(4px)}
.topbar .wrap{display:flex;align-items:center;gap:10px;padding-top:9px;padding-bottom:9px}
.tabs{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:thin}
.tab{flex:none;border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;padding:.28rem .7rem;font-size:.76rem;cursor:pointer;white-space:nowrap}
.tab b{color:var(--point);margin-right:.3rem}
.tab.on{background:var(--point);border-color:var(--point);color:#fff}.tab.on b{color:#fff}
.tab.ai b{color:var(--ai)} .tab.ai.on{background:var(--ai);border-color:var(--ai)} .tab.ai.on b{color:#fff}
.sep{width:1px;height:1.6rem;background:var(--line);flex:none;margin:0 2px}
.tools{display:flex;gap:6px;align-items:center;flex:none}
.tools button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:.25rem .6rem;font-size:.78rem;cursor:pointer;color:var(--ink)}
.tools .ed.on{background:var(--point-soft);border-color:var(--point);color:var(--point);font-weight:700}

.layout{display:grid;grid-template-columns:1fr 230px;gap:24px;padding-top:20px;padding-bottom:26px}
.side{position:sticky;top:78px;align-self:start;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px}
.side h4{margin:0 0 6px;font-size:.78rem;color:var(--sub);font-weight:600}
.side a{display:block;padding:.35rem .5rem;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.8rem;line-height:1.35}
.side a:hover,.side a.on{background:var(--point-soft);color:var(--point)}
.side a span{color:var(--point);font-weight:700;margin-right:.3rem}

.step{display:none}.step.on{display:block}
.step-head{margin-bottom:14px}
.step-head .kicker{color:var(--point);font-weight:700;font-size:.82rem}
.step-head h2{margin:2px 0 2px;font-size:1.25rem}
.step-head p{margin:0;color:var(--sub);font-size:.9rem}

/* 반갈 카드 */
.card{display:grid;grid-template-columns:7fr 3fr;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px;scroll-margin-top:78px;min-height:0}
.card .l{padding:20px 26px 18px;border-left:6px solid var(--point)}
.card .r{padding:16px 16px 14px;font-size:.92em;background:var(--book);border-left:1px solid var(--line)}
.card h3{display:flex;align-items:center;gap:.6rem;margin:0 0 14px;font-size:1.25rem;line-height:1.35}
.num{flex:none;width:2.1rem;height:2.1rem;border-radius:50%;background:var(--point);color:#fff;display:grid;place-items:center;font-size:.85rem;font-weight:700}
.lb{display:block;font-size:.78rem;font-weight:700;color:var(--sub);margin:0 0 4px}
.card .l>.lb{display:inline-block;background:var(--point);color:#fff;border-radius:999px;padding:.1rem .7rem;margin-bottom:8px}
.keep{margin:0 0 12px;padding:0;list-style:none;display:grid;gap:8px;counter-reset:k}
.keep li{position:relative;padding:.6rem .9rem .6rem 3rem;margin:0;font-size:1.1rem;line-height:1.55;background:var(--point-soft);border-radius:12px;counter-increment:k}
.keep li::before{content:counter(k);position:absolute;left:.8rem;top:.65rem;width:1.55rem;height:1.55rem;border-radius:50%;background:var(--point);color:#fff;font-weight:800;font-size:.85rem;display:grid;place-items:center}
.keep b{color:#0f4c86;background:linear-gradient(transparent 58%,#bcd8f3 58%);padding:0 .1em}
.row{display:flex;gap:.6rem;align-items:flex-start;margin-top:8px;font-size:1rem;line-height:1.5;border-radius:10px;padding:.5rem .8rem}
.row .ic{flex:none;width:1.6rem;text-align:center}
.row.no{color:#5a3f92;background:#f3effa}.row.no s{color:#8a8f98}
.row.did{color:var(--ok);background:#ecf6ef}
.pgbig{font-size:1.25rem;font-weight:800;color:var(--point);line-height:1.1;margin-bottom:8px}
.pgbig small{display:block;font-size:.72rem;color:var(--sub);font-weight:600;margin-top:2px}
.pgs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.pg{border:1px solid var(--line);background:#fff;border-radius:999px;padding:.05rem .55rem;font-size:.74rem;color:var(--sub)}
.pg b{color:var(--point)}
.r ul{margin:0 0 10px;padding-left:1.05rem;font-size:.9rem}
.r li{margin:.2rem 0}
.skip{background:#fff;border:1px dashed #c9d1da;border-radius:10px;padding:.45rem .7rem;font-size:.84rem;color:var(--sub)}
.skip b{color:var(--ink)}
.big{display:inline-block;background:#fff;border:1.5px solid var(--point);color:var(--point);border-radius:8px;padding:0 .4rem;font-weight:800}
.term{color:var(--sub);font-size:.85em}

/* AI 특화 */
.ai .step-head .kicker{color:var(--ai)}
.aicard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 22px;margin-bottom:16px;scroll-margin-top:78px;border-left:6px solid var(--ai)}
.aicard h3{display:flex;align-items:center;gap:.6rem;margin:0 0 8px;font-size:1.1rem}
.aicard .num{background:var(--ai)}
.aicard p{margin:.2rem 0 .5rem;font-size:.95rem}
.aicard ol,.aicard ul{margin:.2rem 0 .6rem;padding-left:1.2rem;font-size:.95rem}
.aicard li{margin:.2rem 0}
.aigrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.aigrid .aicard{margin:0}
pre{background:#1f2430;color:#e6e9f0;border-radius:12px;padding:14px 16px;font-size:.84rem;line-height:1.55;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:.4rem 0 .6rem;position:relative;font-family:"D2Coding",Consolas,Menlo,monospace}
.copy{position:absolute;right:10px;top:8px;border:1px solid #56607a;background:#2a3142;color:#dfe4f2;border-radius:6px;padding:.1rem .55rem;font-size:.72rem;cursor:pointer}
.att{margin:.2rem 0 .6rem}
.dl{display:inline-block;background:#fff;border:1.5px solid var(--ai);color:var(--ai);border-radius:10px;padding:.4rem .9rem;font-size:.88rem;font-weight:700;text-decoration:none}
.dl:hover{background:var(--ai-soft)}
.note{background:var(--ai-soft);border-radius:10px;padding:.5rem .8rem;font-size:.88rem;margin-top:.5rem}
.note b{color:var(--ai)}
.flow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:.3rem 0 .8rem}
.flow span{background:var(--ai-soft);color:var(--ai);border-radius:999px;padding:.25rem .8rem;font-weight:700;font-size:.88rem}
.flow i{color:var(--sub);font-style:normal}
.feat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.feat div{background:var(--ai-soft);border-radius:12px;padding:.7rem .8rem;font-size:.86rem;line-height:1.45}
.feat b{display:block;color:var(--ai);font-size:.95rem;margin-bottom:.15rem}
.logo{display:grid;grid-template-columns:140px 1fr;gap:14px;align-items:center}
.logo svg{width:140px;height:110px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:.3rem}
.chips span{border-radius:999px;padding:.1rem .6rem;font-size:.78rem;border:1px solid var(--line);background:#fff}

/* three.js */
.scene-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px}
.scene-box h3{margin:0 0 2px;font-size:1.05rem}.scene-box p{margin:0 0 8px;color:var(--sub);font-size:.85rem}
#scene{position:relative;width:100%;height:330px;border-radius:12px;overflow:hidden;background:linear-gradient(#f7fafd,#eef3f8)}
#scene canvas{display:block}
.lbl{position:absolute;transform:translate(-50%,0);background:#fff;border:1px solid var(--line);border-radius:999px;padding:.1rem .6rem;font-size:.72rem;white-space:nowrap;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.lbl.on{border-color:var(--point);color:var(--point);font-weight:700}
.ctrl{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ctrl button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:.3rem .8rem;font-size:.8rem;cursor:pointer}
.ctrl button.primary{background:var(--point);color:#fff;border-color:var(--point)}
.caption{margin-top:6px;font-size:.88rem;min-height:1.5em}.caption b{color:var(--point)}
.nogl{display:none;padding:20px;color:var(--sub)}
.intro{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.intro .box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px}
.intro h3{margin:0 0 6px;font-size:1.05rem}
.intro ol{margin:0;padding-left:1.2rem;font-size:.95rem}
.edition{display:flex;gap:8px;margin-top:8px}
.edition button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:.6rem .8rem;text-align:left;cursor:pointer;font-size:.88rem;line-height:1.4}
.edition button.on{border-color:var(--point);background:var(--point-soft)}
.edition button b{display:block;color:var(--point)}

.bottom{position:sticky;bottom:0;z-index:15;background:rgba(251,251,248,.97);border-top:1px solid var(--line)}
.bottom .wrap{display:flex;justify-content:space-between;align-items:center;padding-top:9px;padding-bottom:9px}
.bottom button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:.45rem 1rem;font-size:.85rem;cursor:pointer}
.bottom button.primary{background:var(--point);border-color:var(--point);color:#fff}
.bottom .where{color:var(--sub);font-size:.8rem}
footer{color:var(--sub);font-size:.75rem;text-align:center;padding:14px 0 24px}

@media (max-width:980px){.layout{grid-template-columns:1fr}.side{display:none}.card{grid-template-columns:1fr}.card .r{border-left:0;border-top:1px solid var(--line)}.aigrid,.intro,.feat{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.topbar .wrap{flex-wrap:wrap}.tabs{flex-basis:100%}.aigrid,.intro,.feat{grid-template-columns:1fr}.logo{grid-template-columns:1fr}#scene{height:280px}.bottom .where{display:none}}

/* v3 카드: 한 칸 · 읽기 편하게 */
.card.v3{display:block;padding:0;border-radius:16px}
.v3 .ch{display:flex;align-items:center;gap:.7rem;padding:18px 24px 6px}
.v3 .ch h3{margin:0;font-size:1.15rem;line-height:1.4;flex:1}
.v3 .pgpill{flex:none;font-size:.8rem;color:var(--sub);background:var(--book);border:1px solid var(--line);border-radius:999px;padding:.15rem .7rem;white-space:nowrap}
.v3 .pgpill b{color:var(--point)}
.v3 .cb{padding:6px 24px 18px 24px}
.v3 .klbl{font-size:.78rem;font-weight:700;color:var(--point);letter-spacing:.02em;margin:6px 0 2px}
.keep3{list-style:none;margin:0 0 14px;padding:0;counter-reset:k}
.keep3 li{counter-increment:k;position:relative;padding:.6rem 0 .6rem 2.2rem;border-bottom:1px solid #eef0f3;line-height:1.65}
.keep3 li:last-child{border-bottom:0}
.keep3 li::before{content:counter(k);position:absolute;left:0;top:.68rem;width:1.45rem;height:1.45rem;border-radius:50%;border:1.5px solid var(--point);color:var(--point);font-size:.78rem;font-weight:800;display:grid;place-items:center}
.keep3 b{color:var(--point);font-weight:700}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo .d{border-radius:12px;padding:.65rem .9rem;font-size:.92rem;line-height:1.6}
.duo .dl3{display:block;font-size:.74rem;font-weight:700;margin-bottom:2px}
.no3{background:#f6f3fb;color:#4b3a78}.no3 .dl3{color:#6a4fa0}.no3 s{color:#6f7480}
.did3{background:#eef7f1;color:#245f3b}.did3 .dl3{color:var(--ok)}
.v3 .bk{text-align:left;background:var(--book);border-top:1px solid var(--line);padding:12px 24px 14px;font-size:.84rem;color:var(--sub);line-height:1.6;display:grid;gap:6px}
.pgs3{display:flex;flex-wrap:wrap;gap:5px}
.pg3{background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 .6rem;font-size:.76rem}
.pg3 b{color:var(--point)}
.look3 b{color:var(--ink);margin-right:.4rem}.look3 i{font-style:normal;margin:0 .45rem;color:#c3c8cf}
.skip3 b{color:var(--ink)}
@media (max-width:700px){.duo{grid-template-columns:1fr}.v3 .ch{flex-wrap:wrap}}
</style>
</head>
<body>
<header class="wrap hero">
  <small>교재 톺아보기 · 핵심 정리</small>
  <h1>PPT보다 쉽게 만드는 미리캔버스 활용 맞춤형 교안 제작</h1>
  <p>왼쪽은 꼭 기억할 것, 오른쪽은 교재 어디를 펴면 되는지. 교재를 옆에 두고 함께 넘겨요.</p>
</header>

<nav class="topbar"><div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="tools">
    <button class="ed on" data-ed="0" title="로그인 설명이 13쪽에서 시작">13쪽판</button>
    <button class="ed" data-ed="4" title="로그인 설명이 17쪽에서 시작">17쪽판</button>
    <button id="fsDown">가−</button><button id="fsUp">가+</button>
  </div>
</div></nav>

<div class="wrap layout"><main id="main"></main><aside class="side" id="side"></aside></div>

<div class="bottom"><div class="wrap">
  <button id="prev">← 이전</button><span class="where" id="where"></span><button id="next" class="primary">다음 →</button>
</div></div>
<footer>김에듀 · 김충효 강사 · kimedu.kr</footer>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
const STEPS=[
 {id:'s0',no:'STEP 0',name:'시작하기',desc:'교재 버전을 확인하고, 전체 흐름을 한눈에 봐요.'},
 {id:'s1',no:'STEP 1',name:'기본 기능',desc:'워크스페이스부터 글자·배경·다운로드까지.'},
 {id:'s2',no:'STEP 2',name:'저작권·템플릿',desc:'안심하고 쓰는 규칙과 템플릿으로 교안 만드는 순서.'},
 {id:'s3',no:'STEP 3',name:'AI 도구',desc:'미리캔버스 안의 AI와 교재에 소개된 바깥 AI 도구.'},
 {id:'s4',no:'STEP 4',name:'영상·완성',desc:'영상 넣기, 공유, 내 교안 다듬기, 마무리 비교.'}
];

const CARDS=[
 {s:'s1',n:'01',t:'미리캔버스로 교안을 만들면 좋은 점',p:[1,12],sub:[],
  keep:['미리캔버스 자료는 <b>온라인 플랫폼에서</b> 활용해요','교육의 질 · 훈련생 참여 · 시각 효과가 <b>모두 함께</b> 좋아져요','<b>재미와 흥미</b>로 훈련생이 스스로 참여하게 해요'],
  no:'<s>오프라인 수업에서만 쓸 수 있다</s> → 틀린 말이에요',did:'첫 시간 슬라이도로 서로의 수준과 바라는 것을 함께 봤어요',
  look:['엑셀 · 요양보호사 · 미용 과정 적용 예시','PPT와 비교한 장점(시간 · 디자인 · 공유)'],skip:'장점 설명은 <b>가볍게</b> 훑어도 충분해요'},
 {s:'s1',n:'02',t:'로그인 · 워크스페이스 · 템플릿',p:[13,38],sub:[['로그인',13,23],['워크스페이스',24,27],['폴더 · 업로드',28,29],['왕관',30,30],['템플릿',31,33],['사진',34,38]],
  keep:['워크스페이스<span class="term">(작업 공간)</span> = <b>팀원과 함께 쓰고 공유</b>하는 공간. 개인도 만들 수 있고 수정도 돼요','템플릿은 저장 · 공유할 수 있고, 저장한 뒤에도 <b>언제든 수정</b>','기본 로그인 = <b>이메일 + 비밀번호</b>'],
  no:'<s>템플릿은 한 번 저장하면 못 고친다</s>',did:'폴더 만들기 · 사진 올리기 · WebP는 JPG로 바꿔 올리기 · 덮어쓰기 · 왕관 확인',
  look:['폴더 만들고 사진 올리는 순서','왕관 = 프리미엄(유료)','한 장만 가져오기 vs 전체 적용(덮어쓰기)'],skip:'<b>로그인 · 회원가입</b>은 이미 하셨으니 넘기기. <b>저장</b> 설명은 예전 화면이라 지금은 자동 저장'},
 {s:'s1',n:'03',t:'요소 · 프레임 · 표와 차트',p:[41,51],sub:[['요소 · 프레임',41,45],['표',46,48],['차트 · 조합',48,51]],
  keep:['요소<span class="term">(꾸밈 재료)</span>는 텍스트 · 이미지 · 도형 · 아이콘을 <b>조합</b>해 디자인','여러 개 고를 땐 <b>Ctrl(맥 Command) + 클릭</b>','도형 기본 = <b>크기 조절 · 색 바꾸기</b>'],
  no:'<s>다중 선택 옵션을 먼저 켜야 한다</s> → Ctrl만 누르면 돼요',did:'요소 · 프레임 넣기, 차트와 <b>게이지 차트</b> 만들기',
  look:['프레임에 사진 끌어 넣고 더블클릭으로 위치 맞추기','차트 데이터 고치기, 조합(인포그래픽)'],skip:'차트 화면은 예전 편집기예요. 지금은 <b>게이지 차트</b>도 있어요. 표는 우리처럼 <b>한글 · 엑셀</b>에서'},
 {s:'s1',n:'04',t:'글자 · QR 코드 · 배경',p:[52,61],sub:[['글자',52,56],['QR',57,57],['배경',58,59],['마스크',59,61]],

function card(c){
  return `<article class="card v3" id="c${c.n}">
   <header class="ch"><span class="num">${c.n}</span><h3>${c.t}</h3><span class="pgpill">📖 교재 <b data-a="${c.p[0]}" data-b="${c.p[1]}">${pt(c.p[0],c.p[1])}</b></span></header>
   <div class="cb">
     <div class="klbl">꼭 기억할 것</div>
     <ol class="keep3">${c.keep.map(k=>`<li>${k}</li>`).join('')}</ol>
     <div class="duo">
       <div class="d no3"><span class="dl3">💡 헷갈리기 쉬운 말</span><div>${c.no}</div></div>
       <div class="d did3"><span class="dl3">🖐 우리 수업에서는</span><div>${c.did}</div></div>
     </div>
   </div>
   <div class="bk">
     ${c.sub.length?`<div class="pgs3">${c.sub.map(x=>`<span class="pg3">${x[0]} <b data-a="${x[1]}" data-b="${x[2]}">${pt(x[1],x[2])}</b></span>`).join('')}</div>`:''}
     <div class="look3"><b>교재에 이런 내용</b> ${c.look.join('<i>·</i>')}</div>
     <div class="skip3">⏭ ${c.skip}</div>
   </div></article>`;
}

function build(){
  tabs.innerHTML=STEPS.map((s,i)=>`<button class="tab${s.ai?' ai':''}" data-i="${i}"><b>${s.no}</b>${s.name}</button>`).join('');

    h+=`<section class="step${s.ai?' ai':''}" id="${s.id}"><div class="step-head"><div class="kicker">${s.no}</div><h2>${s.id==='ai'?'제미나이 노트북으로 교안 뽑기':(s.id==='s4'?'영상 · 교안 완성':s.name)}</h2><p>${s.desc}</p></div>`;
    if(s.id==='s0') h+=`

      </div>`;
    else h+=CARDS.filter(c=>c.s===s.id).map(card).join('');
    h+='</section>';
  });
  main.innerHTML=h;
}
function show(i,scroll){
  cur=Math.max(0,Math.min(STEPS.length-1,i));
  document.querySelectorAll('.step').forEach((el,k)=>el.classList.toggle('on',k===cur));
  document.querySelectorAll('.tab').forEach((el,k)=>el.classList.toggle('on',k===cur));
  const s=STEPS[cur];
  let list;
  if(s.id==='ai') list=[['0','노트북이 뭐예요?','ai'],['1','장표 내용 얻기','ai1'],['2','디자인 프롬프트','ai2'],['3','슬라이드 만들기','ai3'],['4','PPTX 뽑기','ai4'],['5','인포그래픽','ai5'],['6','퀴즈 · 팟캐스트 · 영상','ai6']];
  else if(s.id==='s0') list=[['','수업 흐름 그림','scene'],['','내 교재 버전','s0']];
  else list=CARDS.filter(c=>c.s===s.id).map(c=>[c.n,c.t,'c'+c.n]);
  side.innerHTML=`<h4>${s.no} · ${s.name}</h4>`+list.map(x=>`<a href="#${x[2]}" data-t="${x[2]}">${x[0]?'<span>'+x[0]+'</span>':''}${x[1]}</a>`).join('');
  document.getElementById('where').textContent=`${s.no} · ${edL()}`;
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').textContent=cur===STEPS.length-1?'처음으로 ↺':'다음 →';
  if(scroll!==false){const tb=document.querySelector('.topbar');const y=main.getBoundingClientRect().top+window.scrollY-tb.offsetHeight-8;window.scrollTo({top:Math.max(0,y),behavior:'smooth'});}
  if(s.id==='s0'&&window.__sceneResize)setTimeout(window.__sceneResize,50);
}
function setEd(v){ed=v;document.querySelectorAll('.ed').forEach(b=>b.classList.toggle('on',+b.dataset.ed===ed));
  document.querySelectorAll('[data-a]').forEach(b=>{b.textContent=pt(+b.dataset.a,+b.dataset.b)});
  document.getElementById('where').textContent=`${STEPS[cur].no} · ${edL()}`;}
build();show(0,false);
document.addEventListener('click',e=>{
  const t=e.target.closest('.tab');if(t){show(+t.dataset.i);return}
  const b=e.target.closest('.ed');if(b){setEd(+b.dataset.ed);return}
  const cp=e.target.closest('.copy');if(cp){const txt=document.getElementById(cp.dataset.c).textContent;navigator.clipboard&&navigator.clipboard.writeText(txt).then(()=>{cp.textContent='복사됨';setTimeout(()=>cp.textContent='복사',1200)});return}
  const a=e.target.closest('.side a');if(a){e.preventDefault();const el=document.getElementById(a.dataset.t);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});document.querySelectorAll('.side a').forEach(x=>x.classList.toggle('on',x===a))}
});
document.getElementById('prev').onclick=()=>show(cur-1);
document.getElementById('next').onclick=()=>show(cur===STEPS.length-1?0:cur+1);

  function shapes(){const g=new THREE.Group();const s=new THREE.Mesh(new THREE.SphereGeometry(.25,24,16),mat(BLUE));s.position.set(-.32,.28,0);const c=new THREE.Mesh(new THREE.ConeGeometry(.25,.5,24),mat(PURPLE));c.position.set(.3,.28,.05);const k=new THREE.Mesh(new THREE.BoxGeometry(.34,.34,.34),mat(GREEN));k.position.set(0,.2,-.38);k.rotation.y=.6;g.add(s,c,k);return g}
  function lock(){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(.8,.6,.3),mat(BLUE));b.position.y=.32;const sh=new THREE.Mesh(new THREE.TorusGeometry(.26,.06,12,24,Math.PI),mat(GRAY));sh.position.y=.62;const kh=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.04,16),mat(WHITE));kh.rotation.x=Math.PI/2;kh.position.set(0,.34,.16);g.add(b,sh,kh);return g}
  function bulb(){const g=new THREE.Group();const gl=new THREE.Mesh(new THREE.SphereGeometry(.38,28,20),new THREE.MeshStandardMaterial({color:0xfff8d6,emissive:0xffe9a3,emissiveIntensity:.35,roughness:.3}));gl.position.y=.72;const base=new THREE.Mesh(new THREE.CylinderGeometry(.17,.2,.32,20),mat(GRAY));base.position.y=.26;const st=new THREE.Mesh(new THREE.OctahedronGeometry(.13),mat(PURPLE));st.position.set(.42,1.05,0);g.add(gl,base,st);return g}
  function play(){const g=new THREE.Group();const sc=new THREE.Mesh(new THREE.BoxGeometry(1.2,.75,.1),mat(0x2b3a4a));sc.position.y=.5;const tri=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,.06,3),mat(WHITE));tri.rotation.x=Math.PI/2;tri.rotation.y=Math.PI/2;tri.position.set(.03,.5,.07);const st=new THREE.Mesh(new THREE.BoxGeometry(.1,.12,.1),mat(GRAY));st.position.y=.07;g.add(sc,tri,st);return g}
  function done(){const g=new THREE.Group();const d=new THREE.Mesh(new THREE.BoxGeometry(.8,1,.06),mat(WHITE));d.position.y=.55;for(let i=0;i<3;i++){const ln=new THREE.Mesh(new THREE.BoxGeometry(.5,.05,.02),mat(GRAY));ln.position.set(-.05,.8-i*.15,.04);g.add(ln)}const c1=new THREE.Mesh(new THREE.BoxGeometry(.18,.07,.07),mat(GREEN));c1.position.set(-.08,.27,.08);c1.rotation.z=-.8;const c2=new THREE.Mesh(new THREE.BoxGeometry(.36,.07,.07),mat(GREEN));c2.position.set(.1,.33,.08);c2.rotation.z=.9;g.add(d,c1,c2);return g}
  const STOPS=[{f:book,name:'교재 펴기',step:0,cap:'<b>교재 펴기</b> · 13쪽판인지 17쪽판인지 확인'},{f:folder,name:'워크스페이스',step:1,cap:'<b>워크스페이스 · 템플릿</b> · 폴더, 사진, 템플릿 적용'},{f:shapes,name:'요소 · 글자 · 배경',step:1,cap:'<b>요소 · 글자 · 배경</b> · 프레임, 차트, QR, 마스크'},{f:lock,name:'저작권',step:2,cap:'<b>저작권</b> · 요소 2개 이상, 왕관은 무료 내려받기 불가'},{f:bulb,name:'AI 도구',step:3,cap:'<b>AI 도구</b> · AI 프레젠테이션, 바깥 도구는 이름만'},{f:play,name:'영상 · 공유',step:4,cap:'<b>영상 · 공유</b> · 유튜브는 링크, 공유도 링크'},{f:done,name:'내 교안 완성',step:4,cap:'<b>내 교안 완성</b> · 표지 → 본문 → 마무리, PDF로'}];
  const props=[],labels=[];
  STOPS.forEach((s,i)=>{const g=s.f();g.scale.setScalar(1.35);g.position.set(-6+i*(12/(STOPS.length-1)),0,0);g.userData.i=i;world.add(g);props.push(g);const pad=new THREE.Mesh(new THREE.CylinderGeometry(.8,.8,.05,32),mat(i===0?LIGHT:0xdfe7ef));pad.position.set(g.position.x,.02,0);world.add(pad);g.userData.pad=pad;const el=document.createElement('div');el.className='lbl';el.textContent=(i+1)+'. '+s.name;el.onclick=()=>show(s.step);box.appendChild(el);labels.push(el)});
  let active=0,playing=false,spin=false,t0=0,last=performance.now();const cap=document.getElementById('caption');
  function setActive(i){active=i;props.forEach((p,k)=>p.userData.pad.material.color.setHex(k===i?LIGHT:0xdfe7ef));labels.forEach((l,k)=>l.classList.toggle('on',k===i));cap.innerHTML=STOPS[i].cap}
  setActive(0);
  function resize(){const w=box.clientWidth,h=box.clientHeight;if(!w)return;renderer.setSize(w,h);cam.aspect=w/h;cam.position.z=w<480?24:(w<640?19:(w<900?11.5:8.6));cam.updateProjectionMatrix()}
  window.__sceneResize=resize;window.addEventListener('resize',resize);resize();
  const v=new THREE.Vector3();
  function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(playing){t0+=dt;if(t0>2.2){t0=0;setActive((active+1)%STOPS.length)}}if(spin)world.rotation.y+=dt*.25;
    props.forEach((p,k)=>{const tgt=k===active?.25+Math.sin(now/300)*.06:0;p.position.y+=(tgt-p.position.y)*.12;p.rotation.y=k===active?Math.sin(now/700)*.35:p.rotation.y*.9});
    renderer.render(scene,cam);const w=box.clientWidth,h=box.clientHeight;
    props.forEach((p,k)=>{v.set(p.position.x,p.position.y-.15,p.position.z+.6);v.applyMatrix4(world.matrixWorld);v.project(cam);const x=(v.x*.5+.5)*w,y=(-v.y*.5+.5)*h+10+(k%2?30:0);const l=labels[k];l.style.left=x+'px';l.style.top=Math.min(h-30,y)+'px';l.style.display=(v.z<1&&(w>=640||k===active))?'block':'none'});
    requestAnimationFrame(loop)}
  requestAnimationFrame(loop);
  const ray=new THREE.Raycaster(),m=new THREE.Vector2();
  renderer.domElement.addEventListener('click',e=>{const r=renderer.domElement.getBoundingClientRect();m.x=((e.clientX-r.left)/r.width)*2-1;m.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(m,cam);const hit=ray.intersectObjects(props,true)[0];if(!hit)return;let o=hit.object;while(o&&o.userData.i===undefined)o=o.parent;if(o){setActive(o.userData.i);setTimeout(()=>show(STOPS[o.userData.i].step),350)}});
  document.getElementById('play').onclick=()=>playing=true;document.getElementById('pause').onclick=()=>playing=false;
  document.getElementById('reset').onclick=()=>{playing=false;t0=0;world.rotation.y=0;setActive(0)};document.getElementById('spin').onclick=()=>{spin=!spin;if(!spin)world.rotation.y=0};
})();
